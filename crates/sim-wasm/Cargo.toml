[package]
name = "sim-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
# Shipped as binaries, wheels and FMUs, not on crates.io (CONTRIBUTING.md).
publish = false

# A cdylib for the browser (wasm32-unknown-unknown) and an rlib for the native tests. No wasm-bindgen: the page
# talks to a handful of plain C-ABI functions, so the build needs no tool beyond cargo.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core.workspace = true
sim-components.workspace = true
sim-machines.workspace = true
sim-netlist.workspace = true
# Writes a value the page changed over the config's own text, keeping its comments (as the app saves a config).
toml_edit.workspace = true
toml.workspace = true

[dev-dependencies]
# Reads the page's answers in the tests.
serde_json.workspace = true

[lints]
workspace = true
