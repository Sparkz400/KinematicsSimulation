[package]
name = "sim-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

# A cdylib for the browser (wasm32-unknown-unknown) and an rlib for the native tests. No wasm-bindgen: the page
# talks to a handful of plain C-ABI functions, so the build needs no tool beyond cargo.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim-core.workspace = true
sim-components.workspace = true
sim-machines.workspace = true
sim-netlist.workspace = true

[lints]
workspace = true
