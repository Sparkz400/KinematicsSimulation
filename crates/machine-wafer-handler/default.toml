# Retracted in front of station A (theta 0), holding a wafer picked there.
[start]
pose = [0.05, 0.0, 0.06]

# Between two stations 90 degrees apart at r = 0.55 m, a load port A whose wafer lies at z = 0.05 m and a chamber B at
# 0.25 m: turn to B while rising, extend to B and settle (the hand-off), lower 10 mm (the wafer on B), retract, turn
# back to A while lowering, extend under the next wafer and settle, lift 10 mm (the wafer on the pads), retract. Each leg
# is a move of its own, its axes starting and stopping together (a rest of 0.1 s after the first); the column turns and
# the lift travels in the same legs, as a handler does, so that within the first 6 s every motor has run both ways for
# over 0.8 s. "payload" is whether the
# effector holds the wafer once the segment has arrived.
[[cycle.segment]]
target = [0.05, 1.5707963267948966, 0.26]
dwell_s = 0.1
payload = true

[[cycle.segment]]
target = [0.55, 1.5707963267948966, 0.26]
dwell_s = 0.08
payload = true

[[cycle.segment]]
target = [0.55, 1.5707963267948966, 0.25]
dwell_s = 0.05
payload = false

[[cycle.segment]]
target = [0.05, 1.5707963267948966, 0.25]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [0.05, 0.0, 0.05]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [0.55, 0.0, 0.05]
dwell_s = 0.08
payload = false

[[cycle.segment]]
target = [0.55, 0.0, 0.06]
dwell_s = 0.05
payload = true

[[cycle.segment]]
target = [0.05, 0.0, 0.06]
dwell_s = 0.0
payload = true
