# Wafer handler: the R-theta-Z arm of semiconductor and flat-panel handling. A column lifts (Z, motor 3, on a ball
# screw) and turns (theta, motor 1) an arm of two links of equal length; motor 2 on the column turns the upper arm, and
# bands inside the links turn the forearm at 2:1 and the end effector at 1:2 against it, so that the wafer runs along a
# straight radial line (r) while the effector keeps pointing outwards. Gravity acts along -z, out of the plane: the
# joints' bearings carry the arm's weight, the arm's motors only accelerate it; the Z motor holds everything it lifts.
# Sized as an atmospheric handler for 300 mm wafers between two stations 90 degrees apart (the class of the Brooks,
# Kawasaki NT or Rorze RR arms): reach up to 780 mm to the wafer centre (550 mm at the stations), the wafer of 128 g
# held on friction pads.
# Every value says where it comes from:
#   [catalogue]  read from a maker's document: Siemens catalogue D 32 (catalog/siemens/*.csv) for the motors and
#                drives, SEMI M1 for the wafer (300 mm, 775 um of silicon at 2329 kg/m3).
#   [estimate]   ours. The makers publish neither link lengths nor masses, band sizes or pad friction.
# Units are in the field names. The frame: the column's axis at the origin, x and y in the plane, z up. The tool pose
# is (r, theta, z): r the wafer centre's distance from the column's axis along the effector, theta the effector's
# direction from +x (rad), z the stroke from its bottom.
format_version = 1
# Obstacles in the work area, boxes along the axes of the 3D view (see docs/config-reference.md). None by default.
obstacles = []

[sim]
dt_s = 62.5e-6
substeps = 4

# Parts by name from the catalogue in catalog/, as for every machine (see docs/config-reference.md). "" names none: the
# numbers below are the parts' own, written out (motor 1FK2103-2AH at 400 V, converter 6SL3210-5HE10-4UF0).
[parts]
motor = ""
motor_supply = "400v"
gearbox = ""
drive = ""
belt = ""
axis = ""

# One switch per effect.
# Motor options: the holding brake (its inertia and weight) and the encoder ("" keeps drive.encoder_counts_per_rev).
motor_brake = false
motor_encoder = ""
[effects]
gravity = true
payload = true
# The gearboxes twist under load (stiffness, damping, backlash): motor and link are two bodies per joint. Off, the
# machine is the rigid reference model, in which the motor turns with the link times the ratio.
joint_elasticity = true
# The bands in the links stretch under load ([elbow_band], [wrist_band]): the forearm and the effector are bodies of
# their own on the bands' springs, the wafer lags in r and the effector turns out of the radial line. Off, the bands
# are rigid and the arm has the two coordinates of its motors.
band_elasticity = true
# Friction in the joints' bearings ([joint]) and the Z guides ([slide]).
joint_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
# The ball screw's efficiency from its lead angle and its balls' friction (screw.friction_coefficient, THK's
# formula) in place of screw.efficiency, a catalogue's figure that holds the nut's preload drag, which drags apart.
# Off in the shipped configs: their sizing was done with screw.efficiency.
screw_lead_efficiency = false
torque_ripple = true
# Stops at both ends of the column's turn, the upper arm's angle ([joint], [joint.2]) and the Z stroke.
hard_stops = true
holding_brake = true
# The holding brakes engage brake.engage_delay_s after they are asked to hold and release brake.release_delay_s after
# they are asked to let go. Off by default, so that earlier results stay as they were.
brake_delay = false
velocity_feedforward = true
torque_feedforward = true
# The drive runs the position setpoint on between profile cycles from the last setpoints (SINAMICS fine
# interpolation). Changes nothing while the cycles are equal.
fine_interpolation = true
# Friction feedforward from the characteristic drive.friction_feedforward_* (S120 p3820-p3839). Off: no shipped
# config has a recorded characteristic.
friction_feedforward = false
# The position loop closes on a load-side scale instead of the motor encoder, which stays for the speed loop.
load_encoder = false
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a.
drive_current_limit = true
# Off here: the drive's overload over time by its thermal image and the motor's three thermal nodes. On: field
# weakening of the d-q motor model (motor.pole_pairs, d_inductance_h).
field_weakening = true
drive_overload = false
motor_thermal_nodes = false
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
part_heating = false
thermal_feedback = false
# The cycle analysis measures its pass with the windings at the rises they settle at on the cycle.
thermal_warm_start = true
torque_saturation = true
drive_delay = true
dc_link = true
shared_dc_link = false
regenerative_supply = false
fieldbus_delay = false
fieldbus_jitter = false
sensor_noise = false
shaper_follows_pose = false
# Obstacles are rigid: a part moving into one stops dead there. Off by default.
crash = false
# The frame or stand under the machine gives way on springs ([base]). Off in the shipped configs: the stiffnesses are
# [estimate]s.
base_compliance = false
base_reaction = false
braking_resistor_heating = true
# The gearbox's no-load running torque at its input over speed and temperature (gearbox.no_load_*).
gearbox_drag = true
# The gearbox's flanks take the load over a band beyond the backlash (none here: a strain wave gear).
gearbox_lost_motion = true
# A strain wave gear's three-segment stiffness, K1 to T1, K2 to T2, K3 beyond (gearbox.stiffness_*). Off: one stiffness.
gearbox_stiffness_curve = false
# Motor electrical and thermal model: the stator's iron loss (motor.stall_current_a) and the braking resistor's
# temperature. Off: the magnets' flux over temperature.
iron_loss = true
magnet_temperature = false
# The motor shaft's seals and bearings break away above their sliding level along a Stribeck curve.
motor_stiction = true
# The drives watch their following error, their standstill and their torque limit ([drive] fault_reaction and the keys
# after it). Off by default.
drive_monitoring = false

# The arm's kinematics. [estimate] both: links of 320 mm reach the wafer centre 750 mm out with the upper arm 27
# degrees from the radial line (the condition number 2.2), 550 mm at the stations (1.23), and draw it back to 50 mm,
# the wrist 130 mm behind the column's axis.
[geometry]
# Both links' length, shoulder to elbow and elbow to wrist: the 2:1 and 1:2 bands keep the wrist on the radial line
# only with equal links.
link_m = 0.32
# The end effector's length from the wrist to the wafer centre (half the fork, a 300 mm wafer's radius and the gap).
effector_m = 0.18

# The working range of r, the wafer centre's distance from the column's axis. [estimate] r_max within the condition
# number below (the upper arm 20.4 degrees from the radial line at 0.78 m); r_min in front of the upper arm's stop (102.6
# degrees at 0.04 m).
[workspace]
min_reach_m = 0.04
max_reach_m = 0.78
# Targets where the condition number 1 / sin(phi) is above this are refused: near the full extension, where dr/dphi
# goes to zero. 5 keeps the upper arm 11.5 degrees from the radial line. [estimate]
max_condition_number = 5.0

# [estimate] all but the wafer: aluminium links with their bands and pulleys, a ceramic fork. Each body's inertia about
# its own centre (a link as a uniform bar, m L^2 / 12) and its centre's distance from its joint.
[mass]
# What turns with the column about its axis: the column's head, motor 2 and its gearbox, the shoulder pulley.
column_inertia_kgm2 = 0.05
upper_arm_kg = 1.5
upper_arm_inertia_kgm2 = 0.0128
upper_arm_centre_m = 0.16
forearm_kg = 1.2
forearm_inertia_kgm2 = 0.01024
forearm_centre_m = 0.16
# The fork with its pads and the wrist pulley; its centre 120 mm out from the wrist.
effector_kg = 0.4
effector_inertia_kgm2 = 0.004
effector_centre_m = 0.12
# [catalogue] SEMI M1: a 300 mm wafer, 775 um thick, of silicon (2329 kg/m3): pi 0.15^2 0.000775 2329 = 0.1276 kg; its
# inertia about its axis m r^2 / 2 = 1.4355e-3 kg m2.
payload_kg = 0.1276
payload_inertia_kgm2 = 1.4355e-3

# The band in the upper arm: from the shoulder pulley (fixed to the column, twice the elbow's radius) to the elbow
# pulley on the forearm, a loop of two spans of steel band. [estimate] 0.15 x 10 mm of spring steel (EA = 3e5 N) over
# the 320 mm link: 9.4e5 N/m a span; pretensioned to 150 N (100 MPa); its damping 750 N s/m a span, about 5 % of the
# critical damping of the forearm's mode on it (21 Hz).
[elbow_band]
pulley_radius_m = 0.03
span_stiffness_n_m = 9.4e5
span_damping_n_s_m = 750.0
pretension_n = 150.0

# The band in the forearm: from the elbow pulley (fixed to the upper arm, half the wrist's radius) to the wrist pulley
# on the effector. [estimate] as the elbow's.
[wrist_band]
pulley_radius_m = 0.035
span_stiffness_n_m = 9.4e5
span_damping_n_s_m = 750.0
pretension_n = 150.0

# How the effector holds the wafer, for the verdict "wafer-slip": "pads" (by friction, the wafer's weight on the pads;
# it slips when its in-plane acceleration passes mu (g + a_z)), "vacuum" (vacuum pads: mu (g + a_z + A p / m)) or "edge"
# (an edge grip, up to edge_grip_acceleration_m_s2). [estimate] perfluoroelastomer pads on bare silicon, mu 0.3;
# vacuum pads of 3 x 1 cm2 at 60 kPa; an edge grip to 1 g.
[wafer]
hold = "pads"
friction_coefficient = 0.3
vacuum_area_m2 = 3.0e-4
vacuum_pa = 6.0e4
edge_grip_acceleration_m_s2 = 9.81

# The column's turn (motor 1) at its gearbox's output.
[joint]
# [estimate] the cross roller bearing's friction.
friction_coulomb_nm = 0.1
friction_viscous_nm_s_rad = 0.02
friction_smoothing_rad_s = 0.005
# The column's stops, beyond the turn's range of +-190 degrees ([axis.theta]). [estimate]
min_angle_deg = -200.0
max_angle_deg = 200.0
# [estimate] a rubber buffer.
stop_stiffness_nm_rad = 2.0e4
stop_damping_nm_s_rad = 20.0

# The upper arm's joint on the column (motor 2): its own stops, the rest as [joint]. [estimate] 10 degrees from the
# radial line (the full extension's singularity at 0) and 110 degrees (the wafer behind the column's axis).
[joint.2]
min_angle_deg = 10.0
max_angle_deg = 110.0

# All three motors: [catalogue] 1FK2103-2AH at 400 V (catalog/siemens/motors_s210.csv, D 32): rotor 0.093 kg cm2,
# static torque 0.64 N m at 1.06 A, 1.95 N m at the maximum current 3.95 A, rated 1.05 A; thermal time constant 17 min.
[motor]
rotor_inertia_kgm2 = 9.3e-6
# [estimate]
friction_coulomb_nm = 0.01
friction_viscous_nm_s_rad = 4.0e-5
friction_smoothing_rad_s = 0.5
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.004
cogging_order = 24.0
torque_constant_nm_a = 0.6037736
# [estimate] Siemens publishes neither for the 1FK2: with the electrical time constant L / R = 5 ms.
resistance_ohm = 9.0
inductance_h = 0.045
# With effects.field_weakening [estimate]: pole pairs and the d-axis inductance (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.045
# With effects.motor_thermal_nodes [estimate].
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
rated_current_a = 1.05
thermal_time_constant_s = 1020.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 3.95
torque_constant_at_max_current_nm_a = 0.4936709
# With effects.holding_brake: while the drives are disabled, a brake holds each motor shaft up to this torque.
# [estimate] the D 32 gives no brake torque.
brake_torque_nm = 1.0
# With effects.motor_stiction [estimate]: 1.5 times the Coulomb level, falling to it over this speed.
friction_breakaway_nm = 0.015
friction_stribeck_rad_s = 2.0
# With effects.magnet_temperature [estimate]: NdFeB loses about 0.12 % of its remanence per kelvin.
magnet_temperature_coefficient_1_k = -0.0012
# The rated current (the motor is an estimate's), for effects.iron_loss.
stall_current_a = 1.06

# The gearbox of the column (motor 1) and of the upper arm (motor 2). [estimate] a strain wave gear of size 20, ratio 50,
# as such handlers have: no backlash, 2.5e4 N m/rad, 80 % at its rated 33 N m, 0.193 kg cm2 at the input; its ratings
# in [ratings]. Not from a maker's sheet: none in catalog/.
[gearbox]
ratio = 50.0
efficiency = 0.8
backlash_rad = 0.0
stiffness_nm_rad = 2.5e4
# [estimate]
damping_nm_s_rad = 2.0
inertia_at_input_kgm2 = 1.93e-5
efficiency_torque_nm = 33.0
hysteresis_rad = 0.0
lost_motion_band_rad = 0.0
no_load_speed_rpm = 2000.0
# With effects.gearbox_drag [estimate]: the no-load running torque at the input at 2000 r/min.
no_load_torque_nm = 0.05
# With effects.gearbox_stiffness_curve [estimate]: K1 to 7 N m, K2 to 25 N m, K3 beyond.
stiffness_k2_nm_rad = 2.5e4
stiffness_k3_nm_rad = 2.5e4
stiffness_t1_nm = 7.0
stiffness_t2_nm = 25.0

# The Z motor's coupling to the screw: ratio 1, no gearbox, nothing warms. [estimate] a small bellows coupling.
[gearbox.3]
ratio = 1.0
efficiency = 1.0
backlash_rad = 0.0
stiffness_nm_rad = 3000.0
damping_nm_s_rad = 0.2
inertia_at_input_kgm2 = 5.0e-6

# With effects.part_heating: each gearbox warms with its loss (power.gearbox_*). [estimate]
[thermal]
gearbox_resistance_k_w = 1.5
gearbox_time_constant_s = 1200.0
gearbox_max_rise_k = 50.0

# With effects.thermal_feedback (see mech::ThermalFeedback). [estimate] as for the other machines; the belt's
# coefficient is read but not used.
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
belt_stiffness_coefficient_1_k = 3.0e-4
# With effects.thermal_feedback [estimate]: the motor shaft's seal friction follows the gearbox's lubricant.
seal_viscosity_exponent = 0.33

# The wafer's reach: [estimate] 0.8 m/s and 1.5 m/s2 with 15 m/s3: the wafer on its pads holds 0.3 g / 1.2 = 2.45 m/s2
# ("wafer-slip"), 2.04 m/s2 at the low bound of the pads' friction (0.25); the rest is for the bands' ringing.
[axis.r]
max_velocity_m_s = 0.8
max_acceleration_m_s2 = 1.5
max_jerk_m_s3 = 15.0

# The turn, the wafer drawn back to r = 0.05 m, near the column's axis: [estimate] 4 rad/s and 36 rad/s2 with 360 rad/s3
# put the wafer at 0.05 * 4^2 = 0.8 m/s2 outwards and 0.05 * 36 = 1.8 m/s2 along: at most 1.97 m/s2 together. Its range
# +-190 degrees.
[axis.theta]
min_angle_deg = -190.0
max_angle_deg = 190.0
max_velocity_rad_s = 4.0
max_acceleration_rad_s2 = 36.0
max_jerk_rad_s3 = 360.0

# The lift: [estimate] 0.25 m/s (1500 r/min on the 10 mm lead), 2 m/s2 (the wafer on its pads keeps 0.8 g down), 40 m/s3.
[axis.z]
max_velocity_m_s = 0.25
max_acceleration_m_s2 = 2.0
max_jerk_m_s3 = 40.0

# The Z stroke (axis z, motor 3): the column on a ball screw behind a coupling ([slide], [screw], [gearbox.3],
# [drive.3]).
[z_axis]
# [estimate] what the screw lifts besides the links, the effector and the wafer: the column's head and housing, motors
# 1 and 2 with their gearboxes, the carriage: 8 kg.
carriage_kg = 8.0

# The Z carriage and its guide. [estimate] two profile rails.
[slide]
stroke_m = 0.3
friction_coulomb_n = 10.0
friction_viscous_n_s_m = 20.0
friction_smoothing_m_s = 0.002
stop_stiffness_n_m = 2.0e6
stop_damping_n_s_m = 2000.0

# The lift's ball screw. [estimate] 16 x 10.
[screw]
lead_m = 0.01
nominal_diameter_m = 0.016
root_diameter_m = 0.0135
length_m = 0.4
mounting = "fixed-free"
efficiency = 0.9
# With effects.screw_lead_efficiency: the balls' rolling friction coefficient. [estimate] THK's general value for
# ball screws, not this screw's.
friction_coefficient = 0.003
nut_stiffness_n_m = 2.0e8
bearing_stiffness_n_m = 4.0e8
preload_n = 200.0
dynamic_load_rating_n = 7000.0
static_load_rating_n = 12000.0
load_factor = 1.2
static_safety_factor = 2.0
critical_speed_factor = 0.8
buckling_safety_factor = 2.0
max_dn = 70000.0

# One drive per motor, all with the same settings but the velocity loop's. Cycle times must be whole multiples of
# sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# Velocity loop of the column's and the upper arm's drives, checked with `sim-cli margins wafer-handler --bands`.
velocity_kp_nm_s_rad = 0.035
velocity_tn_s = 0.03
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
torque_feedforward_model = "rigid"
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
friction_feedforward_model = "characteristic"
precontrol_balance_s = 0.0
load_encoder_step = 1.0e-6
# [catalogue] the 1FK2103-2AH at 400 V (D 32): 1.95 N m maximum, 0.59 N m rated at 4500 r/min; no-load speed
# sqrt(3/2) * 540 V / 0.6037736 N m/A. The current loop's gain for the winding's 45 mH.
current_kp_v_a = 180.0
current_tn_s = 5.0e-3
bus_voltage_v = 540.0
peak_torque_nm = 1.95
rated_torque_nm = 0.59
rated_speed_rad_s = 471.239
no_load_speed_rad_s = 1095.38
# [estimate] a 22-bit encoder
encoder_counts_per_rev = 4194304.0
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
encoder_noise_counts = 4.0
current_noise_a = 0.01
noise_seed = 1
braking_module = false
# [estimate] The highest speed the motor may turn at: its no-load speed.
max_speed_rad_s = 1095.38
blocked_speed_rad_s = 12.57
blocked_time_s = 3.0
# effects.drive_monitoring: how a drive stops when the drives trip, and what trips it. [estimate] as commissioned.
fault_reaction = "off3"
following_error_window_rad = 1.0
off1_ramp_s = 1.0
off3_ramp_s = 0.1
ss1_time_s = 0.5
pulse_off_speed_rad_s = 2.09
standstill_time_s = 1.0
standstill_window_rad = 0.1
torque_band = 0.0

# The Z motor's velocity loop. [estimate]
[drive.3]
velocity_kp_nm_s_rad = 0.0443

# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged.
[ratings]
# How far the wafer may be from its target in the second half of a dwell, when it is handed off: r and z, m, and the
# turn, rad (0.11 mm at the 0.55 m stations). [estimate] a handler's hand-off of +-0.15 mm.
settling_tolerance_m = 1.5e-4
settling_tolerance_rad = 2.0e-4
# How far the effector may turn out of the radial line through its wafer while it dwells at a station
# ("effector-direction"). [estimate] 0.5 mrad, 0.08 mm across the wafer's radius.
direction_tolerance_rad = 5.0e-4
# The wafer's hold over this ("wafer-slip"). [estimate] 1.2.
wafer_slip_safety_factor = 1.2
# The most a band's span may lose or gain of its pretension ("elbow-band-slack", "wrist-band-slack"). [estimate] half.
band_max_pretension_share = 0.5
# [estimate] a strain wave gear of size 20, ratio 50: 33 N m rated, 73 N m peak, 6500 r/min at the input.
gearbox_rated_torque_nm = 33.0
gearbox_max_torque_nm = 73.0
gearbox_max_input_speed_rpm = 6500.0
# The DC link of the S210 converter. [estimate] as for the other S210 machines.
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] the S210 6SL3210-5HE10-4UF0, which D 32 pairs with the 1FK2103-2AH at 400 V: 1.2 A rated, 4.2 A maximum;
# its internal braking resistor 50 W, 1.2 kW (braking_s210.csv); trip at 820 V.
braking_resistor_continuous_w = 50.0
braking_resistor_peak_w = 1200.0
dc_link_overvoltage_v = 820.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] S120 Active Line Module 6SL3130-7TE21-6AA4, for effects.regenerative_supply; its efficiency [estimate].
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
required_life_h = 20000.0
bearing_reliability_percent = 90.0
# The output speed at which the gearbox's bearings last 20000 h at the rated torque. [estimate] 2000 r/min / 50.
gearbox_reference_speed_rpm = 40.0
drive_rated_current_a = 1.2
drive_max_current_a = 4.2
# With effects.drive_overload [estimate]: 0.85 of the rated current, the image's time constant, the maximum's time.
drive_base_load_current_a = 1.02
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25
# The highest condition number the cycle may reach ("singularity"). [estimate] a design rule: 1.23 at the stations.
max_condition_number = 4.0
# With effects.braking_resistor_heating [estimate].
braking_resistor_rated_rise_k = 200.0
braking_resistor_time_constant_s = 60.0
# With effects.drive_overload [estimate].
drive_chip_share = 0.3
drive_chip_time_constant_s = 1.0

[profile]
cycle_s = 1.0e-3
fieldbus_delay_cycles = 1
fieldbus_jitter_cycles = 1
setpoint_interval_s = 10.0e-3
blend_time_s = 0.05
shaper_frequency_hz = 21.0
shaper_damping = 0.05
shaper2_frequency_hz = 0.0
shaper2_damping = 0.03
torque_reserve = 0.8
# Read but not used: the machine has no belt sections of the shared belt model.
tension_reserve = 0.8
tension_margin_n = 0.0
time_optimal_margin = 1.0
path_tolerance_m = 0.0
# For `sim-cli optimise`: the cycle's own 10 mm lift.
min_clearance_m = 0.01
corner_tolerance_m = 0.0
cycle_timing = "axis_limits"
deceleration_ratio = 1.0
shape = "s-curve"
shaper_axes = []
shaper_ei_tolerance = 0.05
shaper_modes = []
shaper_type = "zvd"
trajectory_spline = "c2"
up_acceleration_ratio = 1.0
vertical_axis = ""

# effects.brake_delay [estimate].
[brake]
engage_delay_s = 0.03
release_delay_s = 0.06

[base]
damping_ratio_rx = 0.02
damping_ratio_ry = 0.02
damping_ratio_rz = 0.02
damping_ratio_x = 0.02
damping_ratio_y = 0.02
damping_ratio_z = 0.02
inertia_x_kgm2 = 30.0
inertia_y_kgm2 = 30.0
inertia_z_kgm2 = 30.0
# Everything that sways with it, the machine on it included: its natural frequency is sqrt(k / M) / 2 pi.
mass_kg = 150.0
pivot_m = [0.0, 0.0, 0.0]
stiffness_x_n_m = 2.7e6
stiffness_y_n_m = 2.7e6
stiffness_z_n_m = 1.9e7
tilt_stiffness_x_nm_rad = 0.0
tilt_stiffness_y_nm_rad = 0.0
tilt_stiffness_z_nm_rad = 0.0

# Low and high bound of the values that are estimates.
