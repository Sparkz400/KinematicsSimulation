# Four-arm delta of the Quattro / H4 type (Pierrot's H4, Adept/Omron Quattro): four rotary arms on the base at 90
# degrees, each with a parallelogram of forearms down to a travelling plate in two parts. Arms 1 and 2 carry part A,
# arms 3 and 4 part B; the two parts slide against each other along one horizontal direction, and a pinion between a
# rack on each part, with a gear stage behind it, turns the tool by that slide. Tool: x, y, z and the turn c.
# Sized near the Omron Quattro s650H class: 1300 mm working diameter, 6 kg payload. Omron publishes no geometry, masses
# or drives, so this config follows the three-arm delta D3's section by section with its own estimates.
# Every value says where it comes from:
#   [catalogue]  read from a maker's document: Siemens catalogue D 32 and the planetary gearbox manual
#                (catalog/siemens/*.csv).
#   [estimate]   ours: generic proportions of a delta of this class, checked to reach all of the working range with
#                condition numbers below 3.7 (see [geometry]).
# Units are in the field names. The frame: origin at the centre of the shoulder axes' plane, z up, so the plate works
# below zero; arm 1 points along +x, arms 2, 3 and 4 at 90, 180 and 270 degrees. The tool's turn c is about +z.
format_version = 1
# Obstacles in the work area, boxes along the axes of the 3D view (see docs/config-reference.md), e.g.
# obstacles = [{ name = "fixture", centre_m = [0.0, 0.0, -1.05], size_m = [0.1, 0.1, 0.1] }]
# or as [[obstacles]] tables at the end of the file. None by default.
obstacles = []

[sim]
dt_s = 62.5e-6
substeps = 4

# Parts by name from the catalogue in catalog/, as for every machine (see docs/config-reference.md). Named here, they
# would replace the numbers below when the config is loaded; the numbers below are those parts' own, written out
# (motor 1FK2105-6AF at 400 V, gearbox NRB120-05-20, converter 6SL3210-5HE12-0UF0), so that the config reads as it
# runs. "" names none.
[parts]
motor = ""
motor_supply = "400v"
gearbox = ""
drive = ""
belt = ""
axis = ""

# One switch per effect.
[effects]
gravity = true
payload = true
# The gearboxes twist under load (stiffness, damping, backlash): motor and arm are two bodies per joint. Off, the
# machine is the rigid reference model, in which the motor turns with the arm times the ratio and backlash, gearbox
# stiffness and damping have no meaning.
joint_elasticity = true
# Each forearm pair a rigid rod with its mass and rotational inertia (a sixth of its mass at each end, two thirds at its
# middle: exact for a slender rod), and the rods' spin about their own axes as the pair's plane turns
# (mass.forearm_rod_spin_inertia_kgm2). Off: the lumped model of Codourey and Olsson, mass.forearm_elbow_share at the
# elbow and the rest at the plate, the rods' rotational inertia left out. On in the shipped config.
forearm_inertia = true
# The tool turns on the amplifier's spring ([plate] amplifier_stiffness_nm_rad and _damping_nm_s_rad): rack, pinion and
# gear stage twist between the plate's slide and the tool, which is a body of its own. Off: the tool turns with the
# slide times the ratio. On in the shipped config.
amplifier_compliance = true
# With amplifier_compliance: the amplifier's backlash ([plate] amplifier_backlash_rad, at the tool), a dead band in its
# spring. On in the shipped config.
amplifier_backlash = true
# Friction in the arms' bearings at the base (Coulomb and viscous, [joint]).
joint_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
torque_ripple = true
# Stops at both ends of each arm's angle range ([joint]).
hard_stops = true
holding_brake = true
velocity_feedforward = true
torque_feedforward = true
# The drive runs the position setpoint on between profile cycles from the last setpoints (pos + v t + a t^2 / 2),
# as its speed feedforward runs on: a SINAMICS drive's fine interpolation, which a position loop at the speed loop's
# cycle (DSC) needs once the profile cycle is longer than the position cycle. Changes nothing while they are equal.
fine_interpolation = true
# Friction feedforward from the characteristic drive.friction_feedforward_* (S120 p3820-p3839). Off: no shipped
# config has a recorded characteristic.
friction_feedforward = false
# The position loop closes on a load-side scale (S120 direct measuring system, drive.load_encoder_step) instead of
# the motor encoder, which stays for the speed loop.
load_encoder = false
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here: field weakening of the d-q motor model (motor.pole_pairs, d_inductance_h), the drive's overload over time
# by its thermal image (ratings.drive_base_load_current_a, drive_overload_time_constant_s, drive_max_current_time_s)
# and the motor's three thermal nodes (motor.winding_resistance_share, winding_time_constant_s).
field_weakening = false
drive_overload = false
motor_thermal_nodes = false
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
part_heating = false
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point, not from cold.
thermal_warm_start = true
torque_saturation = true
drive_delay = true
dc_link = true
shared_dc_link = false
regenerative_supply = false
fieldbus_delay = false
fieldbus_jitter = false
sensor_noise = false
shaper_follows_pose = false
# Obstacles are rigid: a part moving into one stops dead there, drives on or off, and drives that were on go off
# (see docs/model-reference.md). Off by default; without obstacles it changes nothing.
crash = false

# The kinematics. e = base_radius_m - plate_radius_m is what the equations use.
# [estimate] the three-arm D3's proportions scaled to the 650 mm working radius, the forearms longer
# for the deeper range: with these the whole working range is reachable at every turn of the tool, the arm angles stay
# between -45 and +83 degrees and the condition number of the Jacobian below 3.7 (checked over a grid of 27 x 27 x 9
# poses at the turn's ends and its middle, by a script after the crate's equations; the highest, 3.68, near the rim
# with the parts slid to an end).
[geometry]
base_radius_m = 0.25
# From a plate part's centre to each of its two forearm pairs (both parts alike).
plate_radius_m = 0.07
upper_arm_m = 0.5
forearm_m = 1.1
# Distance between the two rods of a forearm pair, for the 3D view only.
forearm_spacing_m = 0.1

# The working range: a cylinder with a spherical bottom.
# [estimate] 1300 mm across as the Quattro s650H; 250 mm high at the edge and 450 mm at the centre.
[workspace]
radius_m = 0.65
top_z_m = -0.75
height_edge_m = 0.25
height_centre_m = 0.45
# Targets where the Jacobian's condition number is above this are refused: near a singularity. Above anything in
# the working range (3.7). The cycle is judged against ratings.max_condition_number.
# [estimate]
max_condition_number = 10.0

# [estimate] all: a carbon tube arm with an aluminium elbow block, carbon rods with ball cups, two aluminium plate
# parts, the carriage with pinion, gear stage and ISO 9409-1-50 flange.
[mass]
upper_arm_kg = 1.4
# Centre of mass of the arm's tube from the shoulder axis, and its inertia about the shoulder axis (uniform tube:
# m L^2 / 3 = 1.4 * 0.5^2 / 3 = 0.117 kg m^2), without the elbow block.
upper_arm_cg_m = 0.25
upper_arm_inertia_kgm2 = 0.117
elbow_kg = 0.35
forearm_pair_kg = 0.7
# The share of a forearm pair's mass counted at the elbow (the rest at the plate): 2/3 matches the rod's inertia
# about its end, m L^2 / 3 (Codourey 1998, Olsson 2009). Only with effects.forearm_inertia off (the lumped model).
forearm_elbow_share = 0.6667
# With effects.forearm_inertia: each rod's inertia about its own axis. [estimate] a carbon tube 22 x 1.5 mm of 0.17 kg,
# m (r_o^2 + r_i^2) / 2 = 0.17 (0.011^2 + 0.0095^2) / 2 = 1.8e-5 kg m^2.
forearm_rod_spin_inertia_kgm2 = 1.8e-5
# Each of the two plate parts, without the forearms' share.
plate_part_kg = 0.7
# The carriage between the parts, at the tool's point: pinion, gear stage, tool flange (it slides with the tool).
carriage_kg = 1.0
# The rated payload of the class.
payload_kg = 6.0

# The plate's two parts and what turns the tool. Part A (arms 1 and 2) and part B (arms 3 and 4) slide against each
# other along (1, -1, 0) / sqrt 2, each by h from the tool's point the other way; the pinion between a rack on each
# part rolls by h / r and its centre stays at the tool's point, and the gear stage turns the tool by gear_ratio times
# that: c = gear_ratio h / pinion_radius_m. [estimate] all.
# With these, c = 1.2 h / 0.04 = 30 rad/m: the tool's +-180 degrees are a slide of h = +-104.7 mm (the parts 209 mm
# apart at either end). The ratio is a trade: the tool's inertia counts in the slide times its square (the tool and
# payload's 0.013 kg m^2 as 11.7 kg at 30 rad/m), and so do the arms' twist and backlash in the tool's turn. At 60 rad/m
# (pinion 25 mm, stage 1.5) the slide weighed 47 kg, and the drives' loops, tuned for the rotors, let a turn of 1.5 rad
# overshoot by 0.27 rad and ring at 6 Hz, growing.
[plate]
pinion_radius_m = 0.04
gear_ratio = 1.2
# With effects.amplifier_compliance: the twist of rack, pinion and gear stage, at the tool. The tool and payload ring
# at sqrt(3000 / 0.013) / 2 pi = 76 Hz on it (159 Hz without the payload); the damping about 2 % of critical at
# 76 Hz: 2 * 0.02 * sqrt(3000 * 0.013) = 0.25 N m s/rad.
amplifier_stiffness_nm_rad = 3000.0
amplifier_damping_nm_s_rad = 0.25
# With effects.amplifier_backlash: the play at the tool, 1 arcmin (a ground pinion and rack pressed together).
amplifier_backlash_rad = 2.909e-4

# The tool on the carriage: flange, gripper and the gear stage turned to the tool, and the payload's inertia about the
# tool's axis (6 kg, about 100 x 100 mm: m (a^2 + b^2) / 12 = 0.01 kg m^2). [estimate]
[tool]
inertia_kgm2 = 3.0e-3
payload_inertia_kgm2 = 1.0e-2

# Each arm's joint at the base.
[joint]
# [estimate] two angular contact bearings of the arm's shaft, about 1 % of the arm's holding torque.
friction_coulomb_nm = 0.4
friction_viscous_nm_s_rad = 0.06
friction_smoothing_rad_s = 0.01
# The stops. [estimate] beyond the -45 to +83 degrees the working range needs.
min_angle_deg = -55.0
max_angle_deg = 95.0
# [estimate] a rubber buffer.
stop_stiffness_nm_rad = 2.0e4
stop_damping_nm_s_rad = 20.0

[motor]
# [catalogue] 1FK2105-6AF, D 32: rotor 2.7 kg cm2
rotor_inertia_kgm2 = 2.7e-4
# [estimate]
friction_coulomb_nm = 0.06
friction_viscous_nm_s_rad = 2.5e-4
friction_smoothing_rad_s = 0.5
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.03
cogging_order = 24.0
# [catalogue] static torque 8 N m over stall current 6.7 A
torque_constant_nm_a = 1.19403
# [estimate] Siemens publishes neither for the 1FK2.
resistance_ohm = 1.4
inductance_h = 0.008
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.008
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] rated current 5.6 A at 400 V; thermal time constant 40 min (1FK2 configuration manual); 24 N m at the
# maximum current of 24 A. With effects.winding_heating the winding settles at the rated rise at the rated current.
rated_current_a = 5.6
thermal_time_constant_s = 2400.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 24.0
torque_constant_at_max_current_nm_a = 1.0
# With effects.holding_brake: while the drives are disabled, a brake holds each motor shaft up to this torque.
# [estimate] the D 32 gives no brake torque.
brake_torque_nm = 12.0

# The gearbox of each arm.
# [catalogue] Siemens NRB120-05-20 (catalog/siemens/gearbox_nrb.csv): ratio 20, 96 % at full load, 75630 N m/rad,
# 1.57 kg cm2 at the input; 260 N m rated, 416 N m maximum ([ratings]). Its backlash [estimate] 3 arcmin, a
# reduced-backlash planetary (catalogue: 9 arcmin), bounded 2 to 4 arcmin.
# The ratio is chosen: on the cycle the motors turn at most at 117 rad/s of the rated 314 and take at most 13.8 N m of
# the 24 (motor 1, along the cycle); the gearbox passes at most 243 N m of its 416. The NRB080 of the D3 (192 N m)
# would be too small for the 6 kg payload.
[gearbox]
ratio = 20.0
efficiency = 0.96
backlash_rad = 8.727e-4
stiffness_nm_rad = 75630.4
# [estimate]
damping_nm_s_rad = 8.0
inertia_at_input_kgm2 = 1.57e-4

# With effects.part_heating: each gearbox warms with its loss (power.gearbox_*). [estimate] as for the other machines'
# planetary gearboxes, a little lower for the larger size.
[thermal]
gearbox_resistance_k_w = 1.2
gearbox_time_constant_s = 1500.0
gearbox_max_rise_k = 50.0

# With effects.thermal_feedback (see mech::ThermalFeedback). [estimate] as for the other machines; the belt's
# coefficient is read but not used, as the delta has no belt.
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
belt_stiffness_coefficient_1_k = 3.0e-4

# The tool's limits along x, y and z. [estimate] Omron publishes the Quattro's cycle times, not its axis limits.
[axis.x]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 50.0
max_jerk_m_s3 = 2500.0

[axis.y]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 50.0
max_jerk_m_s3 = 2500.0

[axis.z]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 50.0
max_jerk_m_s3 = 2500.0

# The tool's turn, rad: the controller's limits, the stroke of the plate's slide (see [plate]). [estimate]
[axis.c]
min_angle_deg = -180.0
max_angle_deg = 180.0
max_velocity_rad_s = 30.0
max_acceleration_rad_s2 = 300.0
max_jerk_rad_s3 = 15000.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# Velocity loop gain, tuned with `sim-cli margins delta-h4 --bands` for a phase margin of at least 35 degrees and a gain
# margin of at least 6 dB in every run: the loop crosses over near 223 Hz, where the rotor and the gearbox's input are
# left (above the gearboxes' resonance), with 0.1 ms filters as the D3's. Found: at least 46.4 degrees and 8.88 dB
# (motor and joint friction off), 50.7 degrees and 9.35 dB (on). 0.7 left 42 degrees and 6.7 dB as configured; the
# slide's heavy turn (see [plate]) asks the other way.
velocity_kp_nm_s_rad = 0.5
velocity_tn_s = 0.03
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
# Torque feedforward: "rigid", the rigid model's inverse dynamics (inertia, gravity, speed terms), or "inertia", one
# moment of inertia per motor (the rigid model's at the start pose) times its acceleration setpoint, as a drive's
# speed/torque precontrol with the load inertia set (S120 p1498): no gravity, no coupling.
torque_feedforward_model = "rigid"
# With effects.friction_feedforward: the friction characteristic, torque over speed at rising speeds, linear between
# the points from 0 and held beyond the last (S120 p3820-p3839). [estimate] none recorded: no feedforward.
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
# The position setpoint passes a first-order lag of this time constant before the position loop compares it, so that
# it arrives with the motor the speed feedforward moves (S120 p1429 balancing). 0: off, as commissioned by default.
precontrol_balance_s = 0.0
# With effects.load_encoder: the step of the load-side scales, in the tool axes' units (m, rad). 1 um: a glass scale.
load_encoder_step = 1.0e-6
current_kp_v_a = 40.0
current_tn_s = 5.0e-3
# [catalogue] a 400 V line: 540 V DC link (as catalog.rs puts it for a 400 V motor)
bus_voltage_v = 540.0
# [catalogue] 1FK2105-6AF at 400 V: 24 N m maximum, 6.6 N m rated at 3000 r/min
peak_torque_nm = 24.0
rated_torque_nm = 6.6
rated_speed_rad_s = 314.159
# sqrt(3/2) * 540 V / 1.19403 N m/A
no_load_speed_rad_s = 553.9
# [estimate] a 22-bit encoder
encoder_counts_per_rev = 4194304.0
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
encoder_noise_counts = 4.0
current_noise_a = 0.01
noise_seed = 1
# The axes brake through one braking resistor for all, an S120 line-up's Braking Module: verdicts judges the
# sum of their braking power against ratings.braking_resistor_continuous_w and _peak_w. Off: each axis has a
# resistor of its own (an S210). A drive by name sets it.
braking_module = false

# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged.
[ratings]
# How far the tool may be from its target in the second half of a dwell, when the gripper acts. It counts the
# gearboxes' twist and backlash under the plate's weight, which the motors' encoders do not see, and the tool's turn
# off its target in rad (counted as m, as on every machine with a turning axis). [estimate] the positioning accuracy
# of a delta of this class, +-0.5 mm (Festo EXPT, catalogue 2024/12).
# The cycle fails it, 4.72 mm: the tool's turn is 30 times the plate's slide ([plate]), so the arms' twist and backlash
# and the slide's ringing after the traverse turn the tool by 4.7 mrad in the dwell. A finding about the type: with the
# catalogue's 9 arcmin 9.9 mm; with 1 arcmin and an input shaper at 12 Hz still 0.70 mm.
settling_tolerance_m = 0.0005
# [catalogue] NRB120-05-20: 260 N m rated, 416 N m maximum
gearbox_rated_torque_nm = 260.0
gearbox_max_torque_nm = 416.0
# [estimate] a gearbox of this size; not in the catalogue's files.
gearbox_max_input_speed_rpm = 5000.0
# The DC link of the S210 converter. [estimate] as for the D3: 66 uF, the chopper at 770 V.
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] its internal braking resistor and trip level (catalog/siemens/braking_s210.csv, operating instructions
# 09/2022): 100 W, 6 kW, 820 V.
braking_resistor_continuous_w = 100.0
braking_resistor_peak_w = 6000.0
dc_link_overvoltage_v = 820.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] S120 Active Line Module 6SL3130-7TE21-6AA4, for effects.regenerative_supply; its efficiency [estimate].
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
required_life_h = 20000.0
# Reliability of the bearing lives, %: the life factor a1 of ISO 281 (see docs/config-reference.md). 90 to 99.95.
bearing_reliability_percent = 90.0
# The output speed at which the planet bearings last 20000 h at the rated torque, for the gearbox life.
# [estimate] as the D3's, not printed for the NRB120-05-20.
gearbox_reference_speed_rpm = 100.0
# The fatigue of the gearbox's gearing above its rated torque, by Palmgren and Miner's damage sum over the cycle's
# output torque, on a Woehler line through gearbox_max_torque_nm (M2max) for at most 30000 output revolutions and no
# damage at or below gearbox_rated_torque_nm (M2N), as for the D3.
# [estimate] k = 8.7, the slope of the tooth root's S-N line of case-hardened gears in ISO 6336-3.
gearbox_gearing_wohler_exponent = 8.7
# [catalogue] S210 converter 6SL3210-5HE12-0UF0, which D 32 pairs with the 1FK2105-6AF at 400 V: 7 A rated, 24 A maximum
drive_rated_current_a = 7.0
drive_max_current_a = 24.0
# With effects.drive_overload [estimate]: the base load current the drive falls back to when its thermal image trips
# (0.85 of the rated current), the time constant of the image, and how long the drive gives its maximum current from
# the rated load.
drive_base_load_current_a = 5.95
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25
# The highest condition number of the Jacobian the cycle may reach ("singularity"). [estimate] a design rule: the
# working range has up to 3.7.
max_condition_number = 5.0

[profile]
cycle_s = 1.0e-3
fieldbus_delay_cycles = 1
fieldbus_jitter_cycles = 1
setpoint_interval_s = 10.0e-3
blend_time_s = 0.05
shaper_frequency_hz = 25.0
shaper_damping = 0.03
shaper2_frequency_hz = 0.0
shaper2_damping = 0.03
torque_reserve = 0.8
# Read but not used: the delta has no belt.
tension_reserve = 0.8
tension_margin_n = 0.0
# Not used on four axes (see docs/user-guide.md): paths run as given.
path_tolerance_m = 0.0
# For `sim-cli optimise`: the cycle's own 25 mm lift, as if something that high stood between pick and place. The
# same clearance is kept from every obstacle.
min_clearance_m = 0.025

# Low and high bound of the values that are estimates (see the other machines' configs).
[bounds]
motor.pole_pairs = [3.0, 5.0]
motor.d_inductance_h = [0.006, 0.010]
motor.winding_resistance_share = [0.2, 0.5]
motor.winding_time_constant_s = [20.0, 120.0]
ratings.drive_base_load_current_a = [5.6, 6.3]
ratings.drive_overload_time_constant_s = [2.0, 60.0]
ratings.drive_max_current_time_s = [0.1, 1.0]
geometry.base_radius_m = [0.23, 0.27]
geometry.plate_radius_m = [0.06, 0.08]
geometry.upper_arm_m = [0.48, 0.52]
geometry.forearm_m = [1.07, 1.13]
mass.upper_arm_kg = [1.0, 1.8]
mass.upper_arm_inertia_kgm2 = [0.08, 0.15]
mass.elbow_kg = [0.25, 0.5]
mass.forearm_pair_kg = [0.5, 0.9]
mass.forearm_elbow_share = [0.5, 0.667]
mass.forearm_rod_spin_inertia_kgm2 = [0.9e-5, 3.6e-5]
mass.plate_part_kg = [0.5, 1.0]
mass.carriage_kg = [0.7, 1.4]
plate.pinion_radius_m = [0.038, 0.042]
plate.gear_ratio = [1.1, 1.3]
plate.amplifier_stiffness_nm_rad = [1500.0, 6000.0]
plate.amplifier_damping_nm_s_rad = [0.1, 0.5]
plate.amplifier_backlash_rad = [1.454e-4, 5.818e-4]
tool.inertia_kgm2 = [1.5e-3, 6.0e-3]
tool.payload_inertia_kgm2 = [5.0e-3, 2.0e-2]
joint.friction_coulomb_nm = [0.15, 0.8]
joint.friction_viscous_nm_s_rad = [0.03, 0.12]
motor.friction_coulomb_nm = [0.03, 0.12]
motor.friction_viscous_nm_s_rad = [1.2e-4, 5.0e-4]
motor.ripple_fraction = [0.01, 0.04]
motor.cogging_nm = [0.015, 0.06]
motor.resistance_ohm = [1.0, 2.2]
gearbox.backlash_rad = [5.818e-4, 1.164e-3]
gearbox.damping_nm_s_rad = [4.0, 16.0]
thermal.gearbox_resistance_k_w = [0.6, 2.4]
thermal.gearbox_time_constant_s = [750.0, 3000.0]
ratings.dc_link_discharge_time_constant_s = [30.0, 300.0]
ratings.line_module_efficiency = [0.95, 0.99]
thermal_feedback.ambient_c = [10.0, 40.0]
thermal_feedback.viscosity_slope_k = [3470.0, 4730.0]
thermal_feedback.gearbox_viscous_loss_share = [0.25, 0.75]
ratings.gearbox_gearing_wohler_exponent = [6.6, 10.0]

# Above the place position of the cycle.
[start]
pose = [0.1525, 0.0, -0.85, 0.0]

# The Adept cycle 25/305/25 mm (Omron/Adept): up 25 mm, across 305 mm, down 25 mm, and back, the tool turning by 90
# degrees on each traverse. Each leg is a move of its own, stopping at the corners; at the bottom the gripper acts for
# 35 ms. It lies on y = 0, across the centre, 100 mm below the top of the working range. "payload" is the state of the
# gripper once the segment has arrived. One pass of the six segments is one Adept cycle: one place and one pick.
[[cycle.segment]]
target = [0.1525, 0.0, -0.875, 0.0]
dwell_s = 0.035
payload = false

[[cycle.segment]]
target = [0.1525, 0.0, -0.85, 0.0]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [-0.1525, 0.0, -0.85, 1.5707963267948966]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [-0.1525, 0.0, -0.875, 1.5707963267948966]
dwell_s = 0.035
payload = true

[[cycle.segment]]
target = [-0.1525, 0.0, -0.85, 1.5707963267948966]
dwell_s = 0.0
payload = true

[[cycle.segment]]
target = [0.1525, 0.0, -0.85, 0.0]
dwell_s = 0.0
payload = true
