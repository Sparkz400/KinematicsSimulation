# Where it tilts about, in the tool pose's frame (x, y, z), m.
pivot_m = [0.0, 0.0, 0.0]
# 0: rigid in that direction (no state).
stiffness_x_n_m = 2.7e6
stiffness_y_n_m = 2.7e6
stiffness_z_n_m = 1.9e7
tilt_stiffness_x_nm_rad = 0.0
tilt_stiffness_y_nm_rad = 0.0
tilt_stiffness_z_nm_rad = 0.0
