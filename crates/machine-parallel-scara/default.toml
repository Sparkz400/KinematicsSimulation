# Parallel SCARA: a five-bar with parallelogram forearms lying in the horizontal x-y plane, its two arms turning about
# vertical axes, as Mitsubishi's RP series or the parallel SCARAs with a five-bar; at the plate a Z stroke on a ball
# screw (motor 3) and a turn of the tool about z (motor 4). Gravity acts along -z, out of the plane: the arms' bearings
# carry the weight, the arms' motors only accelerate it; the Z motor holds the carriage and the payload.
# The five-bar, its range, masses, motors and gearboxes are the planar delta picker D2's laid flat (sized like the
# Codian Robotics D2-800-S020, with Siemens 1FK2105-4AF behind a ratio of 20); the Z stroke is the SCARA's quill on its
# ball screw, the tool turn the D4's motor and gearbox. A machine of this layout and size is not sold that we know of:
# the RP series are smaller (A6 to A4 working ranges, 1 to 5 kg).
# Every value says where it comes from:
#   [catalogue]  read from a maker's document: Codian's product listing (range, payload, picks a minute, 0.1 mm
#                repeatability), Siemens catalogue D 32 and the planetary gearbox manual (catalog/siemens/*.csv).
#   [estimate]   ours. Codian publishes no arm lengths, masses or the shape of the range's bottom; the geometry is
#                chosen to reach all of the range with condition numbers below 1.6 (a search over base radius, arm,
#                forearm and the range's depth in front of the shoulders).
# Units are in the field names. The frame: origin midway between the shoulder axes, x across, y in the plane, z up;
# the plate works at y below zero, in front of the shoulders; arm 1 points along +x, arm 2 along -x. The tool pose is
# (x, y, z, c): z the stroke from its bottom, c the tool's turn about +z from +x (rad).
format_version = 1
# Obstacles in the work area, boxes along the axes of the 3D view (see docs/config-reference.md), e.g.
# obstacles = [{ name = "fixture", centre_m = [0.0, -0.65, -0.4], size_m = [0.1, 0.1, 0.1] }]
# or as [[obstacles]] tables at the end of the file. None by default.
obstacles = []

[sim]
dt_s = 62.5e-6
substeps = 4

# Parts by name from the catalogue in catalog/, as for every machine (see docs/config-reference.md). Named here, they
# would replace the numbers below when the config is loaded; the numbers below are those parts' own, written out
# (motor 1FK2105-4AF at 400 V, gearbox NRB080-05-20, converter 6SL3210-5HE11-5UF0), so that the config reads as it
# runs. "" names none.
[parts]
motor = ""
motor_supply = "400v"
gearbox = ""
drive = ""
belt = ""
axis = ""

# One switch per effect.
# Motor options: the holding brake (its inertia and weight) and the encoder ("" keeps drive.encoder_counts_per_rev;
# "AS22DQC", "AM22DQC", for a 1FT2 also the 26-bit "AS26DQC", "AM26DQC").
motor_brake = false
motor_encoder = ""
[effects]
gravity = true
payload = true
# The gearboxes twist under load (stiffness, damping, backlash): motor and arm are two bodies per joint. Off, the
# machine is the rigid reference model, in which the motor turns with the arm times the ratio.
joint_elasticity = true
# Friction in the arms' bearings at the base (Coulomb and viscous, [joint]).
joint_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
torque_ripple = true
# Stops at both ends of each arm's angle range ([joint]).
hard_stops = true
holding_brake = true
velocity_feedforward = true
torque_feedforward = true
# The drive runs the position setpoint on between profile cycles from the last setpoints (pos + v t + a t^2 / 2),
# as its speed feedforward runs on: a SINAMICS drive's fine interpolation, which a position loop at the speed loop's
# cycle (DSC) needs once the profile cycle is longer than the position cycle. Changes nothing while they are equal.
fine_interpolation = true
# Friction feedforward from the characteristic drive.friction_feedforward_* (S120 p3820-p3839). Off: no shipped
# config has a recorded characteristic.
friction_feedforward = false
# The position loop closes on a load-side scale (S120 direct measuring system, drive.load_encoder_step) instead of
# the motor encoder, which stays for the speed loop.
load_encoder = false
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here (14 November 2026): field weakening of the d-q motor model (motor.pole_pairs, d_inductance_h), the drive's
# overload over time by its thermal image (ratings.drive_base_load_current_a, drive_overload_time_constant_s,
# drive_max_current_time_s) and the motor's three thermal nodes (motor.winding_resistance_share, winding_time_constant_s).
field_weakening = true
drive_overload = false
motor_thermal_nodes = false
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
part_heating = false
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point, not from cold. Nothing to do where nothing
# warms back on the run.
thermal_warm_start = true
torque_saturation = true
drive_delay = true
dc_link = true
shared_dc_link = false
regenerative_supply = false
fieldbus_delay = false
fieldbus_jitter = false
sensor_noise = false
shaper_follows_pose = false
# Obstacles are rigid: a part moving into one stops dead there (see docs/model-reference.md). Off by default.
crash = false

# The kinematics. e = base_radius_m - platform_radius_m is what the equations use.
# [estimate] all four: with them the whole working range is reachable, the arm angles stay between -49 and +70
# degrees and the condition number of the Jacobian below 1.56 (1.48 to 1.8 for the neighbours of the search).
# The frame or stand under the machine gives way on springs ([base]): it sways under the motors' reactions and the
# moving masses and takes the tool with it. Off in the shipped configs: the stiffnesses are [estimate]s.
base_compliance = false
braking_resistor_heating = true
# The gearbox's no-load running torque at its input, over speed and its lubricant's temperature (gearbox.no_load_*):
# gearbox.efficiency then holds at gearbox.efficiency_torque_nm and falls at part load. On here: the sizing of this
# delta was redone with them (14 November 2026).
gearbox_drag = true
# The gearbox's flanks take the load over a band beyond the backlash, with a hysteresis (gearbox.lost_motion_band_rad,
# hysteresis_rad).
gearbox_lost_motion = true
# A strain wave gear's three-segment stiffness, K1 to T1, K2 to T2, K3 beyond (gearbox.stiffness_*). Off in the shipped
# configs.
gearbox_stiffness_curve = false
# Motor electrical and thermal model (14 November 2026). On here: field weakening above (the d-q voltage limit), the
# stator's iron loss heating the motor (motor.stall_current_a) and the braking resistor's temperature
# (ratings.braking_resistor_time_constant_s, braking_resistor_rated_rise_k; with dc_link only). Off: the magnets' flux
# over temperature (motor.magnet_temperature_coefficient_1_k).
iron_loss = true
magnet_temperature = false
# The motor shaft's seals and bearings break away above their sliding level along a Stribeck curve
# (motor.friction_breakaway_nm, friction_stribeck_rad_s).
motor_stiction = true
# The drives watch their following error, their standstill and their torque limit ([drive] fault_reaction and the
# keys after it); one that trips stops all, each by its fault reaction. Off by default, so that earlier results
# stay as they were.
drive_monitoring = false
[geometry]
base_radius_m = 0.15
platform_radius_m = 0.05
upper_arm_m = 0.4
forearm_m = 0.7
# Distance between the two rods of a forearm pair, along the joints' axis (z), for the 3D view only.
forearm_spacing_m = 0.1

# The working range in the x-y plane: a band of half_width_m either side of the centre beyond near_y_m (y, in front
# of the shoulders), its far edge an arc through both edges at depth_edge_m and the centre at depth_centre_m beyond
# the near edge.
# [catalogue] Codian D2-800-S020: 800 mm wide, 477 mm high, the D2's range laid flat.
# [estimate] 250 mm deep at the edges (Codian draws the shape behind the listing), 400 mm in front of the shoulders.
[workspace]
half_width_m = 0.4
near_y_m = -0.4
depth_edge_m = 0.25
depth_centre_m = 0.477
# Targets where the Jacobian's condition number is above this are refused: near a singularity. Above anything in
# the working range (1.56). The cycle is judged against ratings.max_condition_number.
# [estimate]
max_condition_number = 10.0

# [estimate] all: a carbon tube arm with an aluminium elbow block, carbon rods with ball cups, an aluminium plate;
# heavier than the D3's for the 5 kg payload.
[mass]
# The arm's tube's inertia about the shoulder axis (uniform tube of 1.2 kg: m L^2 / 3 = 0.064 kg m^2), without the
# elbow block. Its weight, out of the plane, needs no figure.
upper_arm_inertia_kgm2 = 0.064
elbow_kg = 0.4
forearm_pair_kg = 0.6
# The share of a forearm pair's mass counted at the elbow (the rest at the plate): 2/3 matches the rod's inertia
# about its end, m L^2 / 3 (Codourey 1998, Olsson 2009). The rods' own rotational inertia is not modelled.
forearm_elbow_share = 0.6667
platform_kg = 1.0
# [catalogue] Codian D2-800-S020: payload 5 kg
payload_kg = 5.0

# Each arm's joint at the base.
[joint]
# [estimate] two angular contact bearings of the arm's shaft, about 1 % of the arm's holding torque.
friction_coulomb_nm = 0.3
friction_viscous_nm_s_rad = 0.05
friction_smoothing_rad_s = 0.01
# The stops. [estimate] beyond the -49 to +70 degrees the working range needs (+81 for the standard suite's range,
# 150 mm lower).
min_angle_deg = -60.0
max_angle_deg = 85.0
# [estimate] a rubber buffer.
stop_stiffness_nm_rad = 2.0e4
stop_damping_nm_s_rad = 20.0

[motor]
# [catalogue] 1FK2105-4AF, D 32: rotor 1.7 kg cm2
rotor_inertia_kgm2 = 1.7e-4
# [estimate]
friction_coulomb_nm = 0.05
friction_viscous_nm_s_rad = 2.0e-4
friction_smoothing_rad_s = 0.5
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.02
cogging_order = 24.0
# [catalogue] static torque 5 N m over stall current 4.65 A
torque_constant_nm_a = 1.07527
# [estimate] Siemens publishes neither for the 1FK2.
resistance_ohm = 2.0
inductance_h = 0.010
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.01
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] rated current 4.35 A at 400 V; thermal time constant 37 min (1FK2 configuration manual); 15 N m at the
# maximum current of 18 A.
rated_current_a = 4.35
thermal_time_constant_s = 2220.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 18.0
torque_constant_at_max_current_nm_a = 0.83333
# With effects.holding_brake: while the drives are disabled, a brake holds each motor shaft up to this torque.
# [estimate] the D 32 gives no brake torque.
brake_torque_nm = 8.0

# The gearbox of each arm. [catalogue] Siemens NRB080-05-20 (catalog/siemens/gearbox_nrb.csv): ratio 20, 96 % at full
# load, 10.4 N m/arcmin, 0.406 kg cm2 at the input, and its torque ratings below; but not its 9 arcmin backlash.
# [estimate] 1 arcmin, the reduced-backlash class of servo planetary gearboxes, as on the D2. Laid flat nothing holds
# the arms to one side of it at rest.
# With effects.motor_stiction [estimate]: the shaft's breakaway torque, 1.5 times its Coulomb level (lip seals and
# bearings break away at about 1.3 to 2 times their running torque), and the speed over which it falls to that level.
friction_breakaway_nm = 0.075
friction_stribeck_rad_s = 2.0
# With effects.magnet_temperature [estimate]: NdFeB loses about 0.12 % of its remanence per kelvin.
# [bounds] -0.0013 ... -0.0009
magnet_temperature_coefficient_1_k = -0.0012
# [catalogue] a motor named in [parts] brings its stall current (static torque over torque constant); here the rated
# current where the motor is an estimate. With effects.iron_loss the copper loss at it brings the winding to its rated
# rise, and the iron loss at the rated speed is the rest of that loss at the rated current; the S1 check ("motor-s1")
# starts at kt times it.
stall_current_a = 4.35
[gearbox]
ratio = 20.0
efficiency = 0.94
backlash_rad = 0.0006545
stiffness_nm_rad = 106570.15
# [estimate]
damping_nm_s_rad = 5.0
inertia_at_input_kgm2 = 7e-05

# The Z motor, motor 3: its own values over [motor] (the arms share [motor]; the keys left out are the shared ones,
# estimates as there). [catalogue] 1FK2103-2AH at 400 V (catalog/siemens/motors_s210.csv, D 32), as the D4's tool
# motor: rotor 0.093 kg cm2, static torque 0.64 N m at 1.06 A, 1.95 N m at the maximum current 3.95 A, rated 1.05 A;
# thermal time constant 17 min (motors_1fk2_s120.csv). It holds the carriage and the 5 kg payload with
# 6 kg * 9.80665 m/s2 * 0.02 m / (2 pi) = 0.187 N m at rest and lifts them at 15 m/s2 with about 0.5 N m more.
# The torque at which `efficiency` holds: [catalogue] WITTENSTEIN alpha SP+ 100 MF, two stages, ratio 20 (the SP100
# Siemens fits, chapter 6.5 of its manual): "efficiency at full load 94 %" at its nominal torque T2N = 259 N m.
efficiency_torque_nm = 259.0
hysteresis_rad = 0.0
# With effects.gearbox_lost_motion [estimate]: the band beyond the backlash over which the flanks' stiffness rises from
# 0 to stiffness_nm_rad, half an arcmin (WITTENSTEIN publishes none; it measures the backlash at 2 % of T2B, where the
# twist is 0.22 arcmin). The hysteresis loop's width at zero torque: 0 here. The model's hysteresis is a friction on
# the twist's rate (mech::Gearbox), which at the small amplitudes of a frequency response locks the flanks like a
# damper of hysteresis / 1e-3 rad/s: with half an arcmin the velocity loop's crossover fell from 225 to 19 Hz.
lost_motion_band_rad = 1.454e-4
no_load_speed_rpm = 3000.0
# With effects.gearbox_drag: [catalogue] the same sheet's mean no-load running torque T012 "at n1 = 3000 rpm and 20 degC
# gearbox temperature", ratio 20: 0.93 N m (an oil-lubricated precision gearbox churns more than a greased one: the
# NRB080 has 0.15 to 0.25 N m, Neugart PLE080). It is more than the 6 % at T2N (0.78 N m at the input), so the teeth
# come out loss-free and the gearbox passes 93.3 % at T2N and 20 degC; its efficiency falls at part load and in the
# cold through this drag (mech::GearDrag), and rises as it warms.
no_load_torque_nm = 0.93
stiffness_k2_nm_rad = 106570.15
stiffness_k3_nm_rad = 106570.15
# With effects.gearbox_stiffness_curve: a planetary gearbox has one stiffness, the knees at T2B and K2 = K3 = K1.
stiffness_t1_nm = 347.0
stiffness_t2_nm = 347.0
[motor.3]
rotor_inertia_kgm2 = 9.3e-6
torque_constant_nm_a = 0.6037736
rated_current_a = 1.05
thermal_time_constant_s = 1020.0
max_current_a = 3.95
torque_constant_at_max_current_nm_a = 0.4936709
# [estimate] Siemens publishes neither for the 1FK2: about a fifth of the copper of the arms' motor, with the same
# electrical time constant L / R = 5 ms; the current loop's gain drive.3.current_kp_v_a goes with L.
resistance_ohm = 9.0
inductance_h = 0.045
# [estimate] the D 32 gives no brake torque; above the 1.95 N m the motor has, as the arms' 8 N m above their 15 N m
# is not.
brake_torque_nm = 1.0

# The tool turn's motor, motor 4: the same 1FK2103-2AH ([catalogue], as above). The turn needs at most about 0.6 N m:
# 0.42 N m for the tool and payload (1.033e-2 kg m2) at 300 rad/s2 behind ratio 8 and 97 %, and the rotor's and
# gearbox's 1.6e-5 kg m2 at 2400 rad/s2, 0.04 N m.
[motor.4]
rotor_inertia_kgm2 = 9.3e-6
torque_constant_nm_a = 0.6037736
rated_current_a = 1.05
thermal_time_constant_s = 1020.0
max_current_a = 3.95
torque_constant_at_max_current_nm_a = 0.4936709
# [estimate] Siemens publishes neither for the 1FK2: about a fifth of the copper of the arms' motor, with the same
# electrical time constant L / R = 5 ms; the current loop's gain drive.4.current_kp_v_a goes with L.
resistance_ohm = 9.0
inductance_h = 0.045
# [estimate] the D 32 gives no brake torque; above the 1.95 N m the motor has, as the arms' 8 N m above their 15 N m
# is not.
brake_torque_nm = 1.0

# The Z motor's coupling to the screw: ratio 1, no gearbox, nothing warms. [estimate] a small bellows coupling.
[gearbox.3]
ratio = 1.0
efficiency = 1.0
backlash_rad = 0.0
stiffness_nm_rad = 3000.0
damping_nm_s_rad = 0.2
inertia_at_input_kgm2 = 5.0e-6

# The tool turn's gearbox, on motor 4, the D4's. [catalogue] Siemens NRB060-03-8 for the 1FK2103
# (catalog/siemens/gearbox_nrb.csv): ratio 8, 97 %, 8251 N m/rad, 0.067 kg cm2 at the input; 18 N m rated, 29 N m
# maximum ([ratings.4]). Its backlash [estimate] 1 arcmin (catalogue: 10 arcmin), unused: the turn is rigid.
[gearbox.4]
ratio = 8.0
efficiency = 0.97
backlash_rad = 2.909e-4
stiffness_nm_rad = 8250.592
# [estimate] as the arms' gearboxes.
damping_nm_s_rad = 5.0
inertia_at_input_kgm2 = 6.7e-6

# With effects.part_heating: each gearbox warms with its loss (power.gearbox_*). [estimate] as for the D3.
[thermal]
gearbox_resistance_k_w = 1.5
gearbox_time_constant_s = 1200.0
gearbox_max_rise_k = 50.0

# With effects.thermal_feedback (see mech::ThermalFeedback). [estimate] as for the other machines; the belt's
# coefficient is read but not used, as the delta has no belt.
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
belt_stiffness_coefficient_1_k = 3.0e-4

# The tool's limits along x and y. [estimate] the D2's 3 m/s and 2500 m/s3, but 30 m/s2 of its 50: the plate carries
# 12.8 kg here against the D2's 6.4 kg, and at 50 m/s2 the arms' gearboxes see 235 N m of their 192 N m maximum and
# the motors 19.2 N m of the drives' 15 N m (`sim-cli verdicts parallel-scara --set axis.x.max_acceleration_m_s2=50
# --set axis.y.max_acceleration_m_s2=50`).
# With effects.thermal_feedback [estimate]: the motor shaft's seal friction (motor.friction_coulomb_nm and
# friction_breakaway_nm) follows the gearbox's lubricant, (nu / nu_ref) to this power: a lip seal on its oil film.
seal_viscosity_exponent = 0.33
[axis.x]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2500.0

[axis.y]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2500.0

# The Z stroke's limits. [estimate] 0.9 m/s: the screw's 20 mm lead at 2700 r/min, of the motor's rated 4500 (and
# below the shared drive.rated_speed_rad_s, which `check_limits` takes for every motor); 15 m/s2 and 1000 m/s3, a
# SCARA's quill.
[axis.z]
max_velocity_m_s = 0.9
max_acceleration_m_s2 = 15.0
max_jerk_m_s3 = 1000.0

# The tool turn's range and limits: no stops, the turn is endless and the range the controller's. [estimate] the D4's.
[axis.c]
min_angle_deg = -360.0
max_angle_deg = 360.0
max_velocity_rad_s = 30.0
max_acceleration_rad_s2 = 600.0
max_jerk_rad_s3 = 30000.0

# The Z stroke at the plate (axis z, motor 3): a quill on a ball screw behind a coupling, its own motor, as the SCARA's
# joint 3 ([slide], [screw], [motor.3], [gearbox.3], [drive.3], [ratings.3]). Off, the tool hangs from the plate
# without a stroke; the tool pose loses z and the cycle's targets their third value.
[z_axis]
enabled = true
# [estimate] the unit on the plate: housing, screw and its bearings, 1.4 kg, and the Z motor with its brake 1.55 kg
# ([catalogue] 1FK2103-2AH, motors_1fk2_s120.csv).
unit_kg = 2.95
# [estimate] what the screw lifts: quill, flange and vacuum gripper.
carriage_kg = 1.0

# The tool's turn about z at the plate (axis c, motor 4), its own motor and gearbox as the D4's ([motor.4],
# [gearbox.4], [drive.4], [ratings.4]). Off, the tool does not turn; the tool pose loses c.
[tool_turn]
enabled = true
# [catalogue] the unit on the plate: the C motor with its brake, 1.55 kg (1FK2103-2AH), and its gearbox NRB060-03-8,
# 0.88 kg (gearbox_mass.csv).
unit_kg = 2.43
# [estimate] quill, flange and gripper about the tool's axis, as the D4's tool: 2e-3 kg m2.
inertia_kgm2 = 2.0e-3
# [estimate] the 5 kg payload as a box 100 x 100 mm turned about its middle: m (a^2 + b^2) / 12 = 5 * 0.02 / 12.
payload_inertia_kgm2 = 8.33e-3
# [estimate] the quill's ball spline and bearings (effects.joint_friction).
friction_coulomb_nm = 0.02
friction_viscous_nm_s_rad = 1.0e-4
friction_smoothing_rad_s = 0.01

# The Z carriage and its guide (the quill in its ball spline). [estimate] the SCARA's quill.
[slide]
stroke_m = 0.2
friction_coulomb_n = 10.0
friction_viscous_n_s_m = 20.0
friction_smoothing_m_s = 0.002
stop_stiffness_n_m = 2.0e6
stop_damping_n_s_m = 2000.0

# The quill's ball screw. [estimate] 16 x 20, as the SCARA's.
[screw]
lead_m = 0.02
nominal_diameter_m = 0.016
root_diameter_m = 0.0135
length_m = 0.3
mounting = "fixed-free"
efficiency = 0.9
nut_stiffness_n_m = 2.0e8
bearing_stiffness_n_m = 4.0e8
preload_n = 200.0
dynamic_load_rating_n = 7000.0
static_load_rating_n = 12000.0
load_factor = 1.2
static_safety_factor = 2.0
critical_speed_factor = 0.8
buckling_safety_factor = 2.0
max_dn = 70000.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# Velocity loop gain and integral time of the arms' drives: laid flat, the D2's 0.25 and 30 ms leave arm 2 at 31
# degrees of phase margin with the plate's 12.8 kg (`sim-cli margins parallel-scara`). 0.33 and 80 ms keep at least
# 39.8 degrees and 6.2 dB over every bound, friction on and off (`--bands`); gains from 0.18 to 0.3 put the loop's
# gain near 1 at the gearbox's resonance above 100 Hz, where the margins are lost.
velocity_kp_nm_s_rad = 0.33
velocity_tn_s = 0.08
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
# Torque feedforward: "rigid", the rigid model's inverse dynamics (inertia, gravity, speed terms), or "inertia", one
# moment of inertia per motor (the rigid model's at the start pose) times its acceleration setpoint, as a drive's
# speed/torque precontrol with the load inertia set (S120 p1498): no gravity, no coupling.
torque_feedforward_model = "rigid"
# With effects.friction_feedforward: the friction characteristic, torque over speed at rising speeds, linear between
# the points from 0 and held beyond the last (S120 p3820-p3839). [estimate] none recorded: no feedforward.
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
# The position setpoint passes a first-order lag of this time constant before the position loop compares it, so that
