# The Adept cycle 25/305/25 mm laid flat: down 25 mm on the Z stroke, up again, across 305 mm in the plane, down,
# up, and back, the tool turned by 90 degrees on each traverse (+90 to the pick, back to 0 to the place). The pick
# (a conveyor) lies 20 mm above the place (a tray), so each traverse also changes the height by 20 mm and every
# axis moves on it. Each leg is a move of its own, stopping at the corners; at the bottom the gripper acts for
# 35 ms. It lies across the centre, 100 mm in front of the working range's near edge. "payload" is the state of the
# gripper once the segment has arrived.
[[cycle.segment]]
