# The axes brake through one braking resistor for all, an S120 line-up's Braking Module. Off: each axis has a
# resistor of its own (an S210). A drive by name sets it.
braking_module = false

# The Z motor's and the tool turn motor's drives: their own values over [drive], the cycle times, filters, noise and
# DC link the shared ones. [catalogue] the 1FK2103-2AH at 400 V (D 32): 1.95 N m maximum, 0.59 N m rated at
# 4500 r/min; no-load speed sqrt(3/2) * 540 V / 0.6037736 N m/A. The current loop's gain for the winding's 45 mH, as
# the D4's tool motor. The velocity loops, checked with `sim-cli margins parallel-scara`: the Z motor's the D4's tool
# motor's 0.0443 (106 degrees, 19.6 dB); the turn's 0.1 with 10 ms (67 degrees, 15.9 dB), as with the D4's 0.0443 and
# the shared 30 ms the motor's friction (0.1 N m in a traverse, held by the integrator) leaves the turn 1.4 mrad off
# for 0.15 s after it stops, and settling, which counts the turn's rad as m, fails at 0.75 mm.
# [estimate] The highest speed the motor may turn at (its datasheet's maximum speed); here the no-load speed, where the
# torque-speed curve ends. The time-optimal plan turns the motor up to it along that curve; the verdict motor-speed
# judges the cycle's peak speed against it. A motor by name sets the catalogue's.
max_speed_rad_s = 615.07
blocked_speed_rad_s = 12.57
blocked_time_s = 3.0
# effects.drive_monitoring: how a drive stops when the drives trip. "off1" ramps the speed setpoint down in off1_ramp_s
# from the rated speed (S120 p1121), "off3" in off3_ramp_s (p1135), "sto" takes the torque off at once (the motor
# coasts), "current_limit" brakes at the torque limit; at standstill, below pulse_off_speed_rad_s (p1226), the pulses
# go off. [estimate] OFF3 in 0.1 s, as commissioned for a fast stop; OFF1 1 s.
fault_reaction = "off3"
# What trips it, at the motor (rad): the following error beyond its window (p2546); at standstill, after
# standstill_time_s of a resting setpoint, beyond the standstill window (p2542, p2543); held at the torque limit below
# blocked_speed_rad_s for blocked_time_s (F07900: p2175, p2177 3 s); the torque further from the model's expected
# torque than torque_band times the peak torque (0: off), as a robot controller detects a collision. [estimate]
following_error_window_rad = 1.0
off1_ramp_s = 1.0
off3_ramp_s = 0.1
pulse_off_speed_rad_s = 2.09
standstill_time_s = 1.0
standstill_window_rad = 0.1
torque_band = 0.0
