# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged.
[ratings]
# How far the tool may be from its target in the second half of a dwell, when the gripper acts. It counts the
# gearboxes' twist and backlash under the plate's weight, which the motors' encoders do not see.
# [estimate] the positioning accuracy of a delta of this class, +-0.5 mm (Festo EXPT, catalogue 2024/12); Codian's
# 0.1 mm is the repeatability, which a constant sag does not spoil.
