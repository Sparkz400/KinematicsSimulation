# Linear transport system with independent movers on a closed track, as Beckhoff XTS or B&R ACOPOStrak: six movers on a
# loop of two 1 m straights of 250 mm motor modules and two 180 degree clothoid curves, each mover driven by the coils
# under it with a position loop of its own. This is flying.toml: default.toml with track.cycle = "flying", cam.run = true
# and its start poses, nothing else changed (a test keeps it so): each mover in turn runs with a conveyor over 0.3 m of a
# straight.
#   [catalogue]  read from a maker's page (Beckhoff XTS AT2000 motor module, AT9014 mover, AT9001 magnet plate).
#   [estimate]   ours, where the makers publish nothing (force constant, resistance, attraction, rollers).
format_version = 1
# Obstacles the machine must not touch, as for every machine (see docs/config-reference.md): a list of
# { name, centre_m, size_m } boxes, or [[obstacles]] tables. None by default.
obstacles = []

# Parts by name from the catalogue in catalog/, as for every machine (see docs/config-reference.md). "" names none:
# the numbers in this file are used as written.
[parts]
motor = ""
motor_supply = "400v"
# Motor options: the holding brake (its inertia and weight) and the encoder ("" keeps drive.encoder_counts_per_rev;
# "AS22DQC", "AM22DQC", for a 1FT2 also the 26-bit "AS26DQC", "AM26DQC").
motor_brake = false
motor_encoder = ""
gearbox = ""
drive = ""
belt = ""
axis = ""

# One switch per effect.
[effects]
# The frame or stand under the machine gives way on springs ([base]): it sways under the motors' reactions and the
# moving masses and takes the tool with it. Off in the shipped configs: the stiffnesses are [estimate]s.
base_compliance = false
# With base_compliance, two-way: the machine feels its base's sway (its motors see it and hold against it) and
# the base's energy is in the budget. Off: one-way, the base sways under the machine.
base_reaction = false
# The URDF arms' links bend, each in its first Euler-Bernoulli mode in the plane its joint turns it in ([link_bending]):
# the tool rings with them. Not on the slides and the table, which have no links. Off in the shipped configs: the
# sections are [estimate]s.
link_bending = false
# The links' bending acts back on the joints (with link_bending): joints, gearboxes and links one coupled system, the
# bending's energy in the machine's. Off in the shipped configs.
link_bending_reaction = false
gravity = true
payload = true
# The arms' payload swings on a pivot at the flange (arm.payload_swing_*): two joints no motor drives. Off here; read
# by the arms only.
payload_swing = false
# Gearbox, coupling, screw or rack twist and stretch under load: motor and load are two bodies per joint. Off, the
# machine is the rigid reference model, in which the motor turns with the joint times the ratio.
joint_elasticity = true
# Friction in the joint: bearings, guides, the screw nut's preload.
joint_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
# The efficiency's loss as a friction in the gearbox's mesh: in proportion to the torque it passes, against the
# motion at any speed, and sticking at rest inside its band (a gear holding a load stands for anything between the
# torque that lowers it and the one that lifts it). Off: the loss fades in below 0.5 W, a gear at rest has none.
gearbox_mesh_friction = true
# The gearbox's no-load running torque at its input, over speed and its lubricant's temperature (gearbox.no_load_*):
# gearbox.efficiency then holds at gearbox.efficiency_torque_nm and falls at part load. Off here: on in the delta
# pickers D2 and D3, whose sizing was redone with them.
gearbox_drag = false
# The motor shaft's seals and bearings break away above their sliding level along a Stribeck curve
# (motor.friction_breakaway_nm, friction_stribeck_rad_s).
motor_stiction = false
# A slide's guides hold a load at rest within their breakaway force without creeping and turn over a presliding travel
# at a reversal: a presliding friction state (slide.presliding_stiffness_n_m, friction_breakaway_n, friction_stribeck_m_s)
# in place of the smoothed Coulomb step. Read by the slides only (screw, rack, linear motor, the SCARA's screw).
slide_presliding = false
# The gearbox's flanks take the load over a band beyond the backlash, with a hysteresis (gearbox.lost_motion_band_rad,
# hysteresis_rad).
gearbox_lost_motion = false
# A strain wave gear's three-segment stiffness, K1 to T1, K2 to T2, K3 beyond (gearbox.stiffness_*). Off in the shipped
# configs.
gearbox_stiffness_curve = false
torque_ripple = true
hard_stops = true
holding_brake = false
# The holding brakes engage brake.engage_delay_s after they are asked to hold (the torque off) and release
# brake.release_delay_s after they are asked to let go; a hanging axis sags while its brake engages. Off by default, so
# that earlier results stay as they were.
brake_delay = false
velocity_feedforward = true
torque_feedforward = true
# The drive runs the position setpoint on between profile cycles from the last setpoints (pos + v t + a t^2 / 2),
# as its speed feedforward runs on: a SINAMICS drive's fine interpolation, which a position loop at the speed loop's
# cycle (DSC) needs once the profile cycle is longer than the position cycle. Changes nothing while they are equal.
fine_interpolation = true
# Friction feedforward (S120 p3820-p3839): with drive.friction_feedforward_model = "machine" the friction of the
# machine's own model at the planned speed, else the characteristic drive.friction_feedforward_* (0 N m where none
# is recorded). On: each machine's file says which; "machine" where it cuts the following error and the settling.
friction_feedforward = true
# The position loop closes on a load-side scale (S120 direct measuring system, drive.load_encoder_step) instead of
# the motor encoder, which stays for the speed loop.
load_encoder = false
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here (14 November 2026): the drive's overload over time by its thermal image (ratings.drive_base_load_current_a,
# drive_overload_time_constant_s, drive_max_current_time_s) and the motor's three thermal nodes
# (motor.winding_resistance_share, winding_time_constant_s). On: field weakening of the d-q motor model
# (motor.pole_pairs, d_inductance_h).
field_weakening = true
drive_overload = false
motor_thermal_nodes = false
# Motor electrical and thermal model (14 November 2026). On here: field weakening above (the d-q voltage limit), the
# stator's iron loss heating the motor (motor.stall_current_a) and the braking resistor's temperature
# (ratings.braking_resistor_time_constant_s, braking_resistor_rated_rise_k; with dc_link only). Off: the magnets' flux
# over temperature (motor.magnet_temperature_coefficient_1_k).
iron_loss = true
magnet_temperature = false
braking_resistor_heating = true
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
part_heating = false
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point, not from cold. Nothing to do where nothing
# warms back on the run.
thermal_warm_start = true
torque_saturation = true
drive_delay = true
dc_link = true
shared_dc_link = true
regenerative_supply = false
fieldbus_delay = false
fieldbus_jitter = false
sensor_noise = false
shaper_follows_pose = false
# Obstacles push back on a part that goes into them with their contact stiffness and damping, so that the axes in
# contact are blocked (see docs/model-reference.md). Off by default; without obstacles it changes nothing.
crash = false
# The drives watch their following error, their standstill and their torque limit ([drive] fault_reaction and the
# keys after it); one that trips stops all, each by its fault reaction. Off by default, so that earlier results
# stay as they were.
drive_monitoring = false

# With effects.part_heating: each gearbox (with the screw or rack behind it) warms with its loss. [estimate] as for the
# delta picker's planetary gearboxes.
[thermal]
gearbox_resistance_k_w = 1.5
gearbox_time_constant_s = 1200.0
gearbox_max_rise_k = 50.0

# With effects.thermal_feedback (see mech::ThermalFeedback). [estimate] as for the other machines; the belt's
# coefficient is read but not used, as these machines have no belt.
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
# With effects.thermal_feedback [estimate]: the motor shaft's seal friction (motor.friction_coulomb_nm and
# friction_breakaway_nm) follows the gearbox's lubricant, (nu / nu_ref) to this power: a lip seal on its oil film.
seal_viscosity_exponent = 0.33
belt_stiffness_coefficient_1_k = 3.0e-4

[profile]
cycle_s = 1.0e-3
fieldbus_delay_cycles = 1
fieldbus_jitter_cycles = 1
setpoint_interval_s = 10.0e-3
blend_time_s = 0.05
shaper_frequency_hz = 25.0
shaper_damping = 0.03
shaper2_frequency_hz = 0.0
shaper2_damping = 0.03
# The shape of moves (see docs/config-reference.md): "s-curve" (seven segments), "sin2" (Bestehorn), "poly345" or
# "poly4567" (VDI 2143); a [[cycle.segment]] may name its own with shape = "...". Braking within deceleration_ratio of
# the acceleration limits (1: as fast as speeding up). vertical_axis: the axis that lifts against gravity ("z", "-z"
# where up is its minus direction, "" for none), which has up_acceleration_ratio of its acceleration limit upwards.
shape = "s-curve"
deceleration_ratio = 1.0
vertical_axis = ""
up_acceleration_ratio = 1.0
# The curve a trajectory runs through its poses: "c2" (a cubic spline, the acceleration continuous) or "hermite" (the
# slopes of the neighbours, as before 14 November 2026).
trajectory_spline = "c2"
# With effects.input_shaping: the shaper ("zv", "zvd", "zvdd", "ei", "ei2" the two-hump EI), the vibration the EI
# shapers allow, the axes the first and the second shaper act on ([] for all), and further modes, each convolved:
# { frequency_hz = 40.0, damping = 0.02, type = "ei", axes = ["z"] } (type and axes may be left out).
shaper_type = "zvd"
shaper_ei_tolerance = 0.05
shaper_axes = []
shaper_modes = []
torque_reserve = 0.8
# Read but not used: no belt.
tension_reserve = 0.8
tension_margin_n = 0.0
# The share of every limit the time-optimal plan may use, on top of the reserves above (1: all; 0.9 plans at 90 %).
time_optimal_margin = 1.0
path_tolerance_m = 0.0
# How far a planned path may leave a corner between two lines to round it instead of stopping there (as a CNC's
# G642 or a robot's zone): the corner curve starts and ends 16/3 of it from a right-angled corner. 0: stop.
corner_tolerance_m = 0.0
# How the cycle's segments are timed: "axis_limits" (the S-curves within the axis limits above) or "time_optimal"
# (each segment as fast as the motors, the gearbox and belt ratings and the jerk limits allow, rest to rest).
cycle_timing = "axis_limits"
min_clearance_m = 0.0

[sim]
dt_s = 62.5e-6
substeps = 4

# The track's centre line (the coils' middle): two straights of 250 mm modules and two 180 degree curves.
#   [catalogue] Beckhoff XTS AT2000-0250 motor module, 250 mm; its 180 degree curve, a clothoid, 267 mm across at the
#               motor's centre point (beckhoff.com, AT2000 product page). A test keeps the width at 267 mm within 0.5 mm.
#   [estimate]  how the 267 mm splits into the arc's radius and the clothoids (not published): a 100 mm clothoid at each
#               end and the radius that makes the width.
[track]
straight_m = 1.0
module_m = 0.25
curve_radius_m = 0.1303
clothoid_m = 0.1
# The cycle the cam runs: "index" (every mover one station on, then standing there) or "flying" (each mover in turn
# synchronous with a conveyor over the process, the rest of the loop back). flying.toml has "flying".
cycle = "flying"
# "index": indexes per second, the share of a period the index takes (the rest the movers stand at their stations), and
# its motion law (VDI 2143: "3-4-5", "4-5-6-7", "cycloid", "harmonic"). The station pitch is the loop over the movers.
index_rate_hz = 1.5
index_share = 0.6
index_law = "4-5-6-7"
# "flying": the conveyor (the master) and its products' pitch, how long the process runs synchronous with it, and the
# law that blends the return's speed into the synchronous run at both ends. Each mover goes once round per movers times
# pitch of conveyor: here 1.8 m of conveyor for the 3.02 m loop, so the movers close up to a product pitch over the
# process and run back at up to 2.8 m/s.
conveyor_speed_m_s = 1.0
product_pitch_m = 0.3
process_length_m = 0.3
return_law = "4-5-6-7"

# The electronic cam (sim_components::cam): the controller runs it as the cycle instead of [[cycle.segment]] where run is
# on; the master comes up to speed in ramp_s. Off in default.toml, as on the crank and cam machines, so that the generic
# tests and tools run its [[cycle.segment]]; on in flying.toml, and --set cam.run=true runs the index cycle.
[cam]
run = true
ramp_s = 0.5

[mass]
# [catalogue] AT9014-0070-x550 mover: 651 g with its magnet plate (beckhoff.com); the plate's share [estimate] is
# motor.rotor_inertia_kgm2, this the rest.
mover_kg = 0.451
# [catalogue] the 600 g the AT9014's life test carries (30,000 km at 1.5 m/s).
payload_kg = 0.6

[mover]
# [catalogue] AT9014-x070: 70 mm along the track; the gap judged is the free space between two bodies.
length_m = 0.07
# [estimate] the rollers' spread along the track, and the magnet plate's length over the coils.
wheelbase_m = 0.05
magnet_length_m = 0.06

# The rollers. [estimate] plastic rollers on a steel rail: a rolling resistance of some 0.5 % of what presses them (the
# attraction, see [linear_motor], is added) and a little viscous drag. The stroke and the stops are read, not used: a
# closed track has no ends.
[slide]
stroke_m = 1.0
friction_coulomb_n = 0.1
friction_viscous_n_s_m = 0.5
friction_smoothing_m_s = 0.002
friction_breakaway_n = 0.15
friction_stribeck_m_s = 0.001
presliding_stiffness_n_m = 1.0e6
stop_stiffness_n_m = 2.0e6
stop_damping_n_s_m = 2000.0

# [estimate] The magnet plate's attraction to the coils holds the mover on its rollers (and, in the curves, against
# the centrifugal force); the cogging repeats once per pole pitch. Neither is published.
[linear_motor]
attraction_force_n = 300.0
pole_pitch_m = 0.012
guide_friction_coefficient = 0.005

# The magnet plate's mount on the body, as the linear motor axis's coupling, in N/m. [estimate] A bolted plate; at
# 1.5e7 N/m the plate on the body (0.2 on 1.05 kg) rings at 1.5 kHz and the speed loop keeps 16 dB (sim-cli margins),
# at 1e7 N/m it is not stable with the current loop of [drive]: the bounds stop at 1.5e7.
[gearbox]
ratio = 1.0
efficiency = 1.0
backlash_rad = 0.0
stiffness_nm_rad = 2.0e7
damping_nm_s_rad = 100.0
inertia_at_input_kgm2 = 0.0
efficiency_torque_nm = 1.0
no_load_torque_nm = 0.0
no_load_speed_rpm = 3000.0
lost_motion_band_rad = 0.0
hysteresis_rad = 0.0
stiffness_t1_nm = 1.0
stiffness_t2_nm = 1.0
stiffness_k2_nm_rad = 20000000.0
stiffness_k3_nm_rad = 20000000.0

# The coils under one mover as its motor, read in N for N m and m for rad.
#   [catalogue] 100 N peak, 30 N continuous for the 5-pin magnet plate (AT9001-x550), 4 m/s, a 48 V DC supply.
#   [estimate]  the rest: force constant, resistance and inductance are not published.
[motor]
# The magnet plate's mass, kg.
rotor_inertia_kgm2 = 0.2
friction_coulomb_nm = 0.0
friction_viscous_nm_s_rad = 0.0
friction_smoothing_rad_s = 0.002
friction_breakaway_nm = 0.0
friction_stribeck_rad_s = 2.0
ripple_fraction = 0.02
# Six per electrical period of two pole pitches: 6 * 2 pi / 0.024 m.
ripple_order = 1570.8
cogging_nm = 1.0
# Replaced by 2 pi / linear_motor.pole_pitch_m.
cogging_order = 523.6
# Force constant, N/A: 30 N continuous at 3 A.
torque_constant_nm_a = 10.0
# The coil set under one mover: 9 W at the continuous force (a motor constant of 10 N per square root of a watt).
resistance_ohm = 1.0
inductance_h = 0.002
pole_pairs = 4.0
d_inductance_h = 0.002
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
stall_current_a = 3.0
magnet_temperature_coefficient_1_k = -0.0012
rated_current_a = 3.0
thermal_time_constant_s = 600.0
rated_temperature_rise_k = 60.0
start_temperature_rise_k = 0.0
max_current_a = 11.0
torque_constant_at_max_current_nm_a = 9.5
# No brake on a mover.
brake_torque_nm = 0.0

# Each segment (module or curve) warms with the copper loss of the coils that carry movers' currents in it.
# [estimate] a 250 mm module on an aluminium frame: 2 K/W to the surroundings, 10 minutes; not published.
[segment]
thermal_resistance_k_w = 2.0
thermal_time_constant_s = 600.0

# [catalogue] 4 m/s (AT20xx system), the motors' highest; [estimate] the axes at 3 m/s. Beckhoff gives 10 g, for a
# mover without load: with the 0.6 kg payload the 100 N peak moves 1.651 kg (the 0.2 kg plate with it) at 60.6 m/s^2
# (at 60 the jog asked 109 N). [estimate] The axes at half that, 30 m/s^2 and 2000 m/s^3 as the linear motor axis's, leave
# the loops and the optimiser their reserve; the cams (23.6 m/s^2 at most) are not held to them. One table per mover (s1
# to s6), as every machine's axes.
[axis.s1]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2000.0

[axis.s2]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2000.0

[axis.s3]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2000.0

[axis.s4]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2000.0

[axis.s5]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2000.0

[axis.s6]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 30.0
max_jerk_m_s3 = 2000.0

# One drive per mover: the power stages of the coils under it. [estimate] tuned as the linear motor axis, scaled to the
# mover's mass; the 48 V supply [catalogue].
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
# Below the linear motor axis's 100: at 100 the light mover's position loop reached 20.2 Hz with its feedforward, above
# the 20 Hz the position loops of the machines are held to.
kv_1_s = 80.0
velocity_kp_nm_s_rad = 800.0
velocity_tn_s = 0.02
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
torque_feedforward_model = "rigid"
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
friction_feedforward_model = "machine"
precontrol_balance_s = 0.0
load_encoder_step = 1.0e-6
# [estimate] 6 V/A on 2 mH: 3000 rad/s; across the inductance's bounds (1.5 to 4 mH) the speed loop keeps at least
# 42 degrees and 10 dB without friction (sim-cli margins); below 1.5 mH the 62.5 us current cycle leaves it unstable.
current_kp_v_a = 6.0
current_tn_s = 2.0e-3
bus_voltage_v = 48.0
peak_torque_nm = 100.0
rated_torque_nm = 30.0
rated_speed_rad_s = 4.0
# sqrt(3/2) * 48 V / 10 N/A.
no_load_speed_rad_s = 5.88
max_speed_rad_s = 4.0
# [estimate] a position measurement of 1 um: counts per 2 pi m.
encoder_counts_per_rev = 6283185.3
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
# [estimate] A count of noise on the 1 um scale: at 4 the stiff loop of the light mover took the jog from 0.45 to 0.86 of
# its peak force with effects.sensor_noise.
encoder_noise_counts = 1.0
current_noise_a = 0.01
noise_seed = 1
fault_reaction = "off3"
off1_ramp_s = 1.0
off3_ramp_s = 0.1
ss1_time_s = 0.5
pulse_off_speed_rad_s = 0.02
following_error_window_rad = 0.005
standstill_window_rad = 0.0005
standstill_time_s = 1.0
blocked_speed_rad_s = 0.05
blocked_time_s = 3.0
torque_band = 0.0
braking_module = false

[ratings]
settling_tolerance_m = 0.00003
# [catalogue] repeatability better than +-0.01 mm at standstill (AT20xx): how far off its station a standing mover may be.
station_tolerance_m = 0.00001
# [catalogue] 2 mm least distance between movers (AT20xx).
min_gap_m = 0.002
# [catalogue] AT2000: 16 A rated, below 48 A peak per module; the peak is judged here, the heat by the rise below.
segment_max_current_a = 48.0
# [estimate] the rise a module may settle at.
segment_max_rise_k = 40.0
# [estimate] what a mover's rollers may carry, and the share of the attraction the centrifugal force may take in a curve.
mover_guide_max_load_n = 500.0
mover_max_liftoff_ratio = 0.7
# [estimate] the movers' 48 V supply as one DC link they share (effects.shared_dc_link); its chopper and its trip at the
# ratios to its bus of the shipped S210 belt axes (224.65 V and 257.6 V on 155.13 V): 70 V and 80 V.
dc_link_capacitance_uf = 4700.0
braking_threshold_v = 70.0
braking_resistor_continuous_w = 100.0
braking_resistor_peak_w = 1000.0
braking_resistor_time_constant_s = 60.0
braking_resistor_rated_rise_k = 200.0
dc_link_overvoltage_v = 80.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] AT2000: 768 W rated per module.
line_module_rated_power_w = 768.0
line_module_max_power_w = 2300.0
line_module_efficiency = 0.98
required_life_h = 20000.0
bearing_reliability_percent = 90.0
# [estimate] the power stage of the coils under one mover.
drive_rated_current_a = 3.0
drive_max_current_a = 11.0
drive_base_load_current_a = 2.55
drive_chip_share = 0.3
drive_chip_time_constant_s = 1.0
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25

# Six movers a product pitch of the cam apart (0.3 m plus the cam at k times the pitch), the first at the process start.
[start]
pose = [0.3, 0.6, 0.940636, 1.553169, 2.36553, 2.978063]

# With cam.run = false: every mover on to take its product (0.3 m the odd ones, 0.25 m the even), and back with it
# through a point it passes without stopping (0.1 m and 0.2 m from the start), so that the jog has a corner to blend, to
# hand it over at the start.
[[cycle.segment]]
target = [0.425, 0.878116, 1.431233, 1.884349, 2.437465, 2.890582]
dwell_s = 0.4
payload = true

[[cycle.segment]]
target = [0.225, 0.828116, 1.231233, 1.834349, 2.237465, 2.840582]
dwell_s = 0.0
payload = true

[[cycle.segment]]
target = [0.125, 0.628116, 1.131233, 1.634349, 2.137465, 2.640582]
dwell_s = 0.2
payload = false

[base]
pivot_m = [0.0, 0.0, 0.0]
mass_kg = 100.0
inertia_x_kgm2 = 10.0
inertia_y_kgm2 = 10.0
inertia_z_kgm2 = 10.0
stiffness_x_n_m = 2.5e6
stiffness_y_n_m = 0.0
stiffness_z_n_m = 0.0
tilt_stiffness_x_nm_rad = 0.0
tilt_stiffness_y_nm_rad = 0.0
tilt_stiffness_z_nm_rad = 0.0
damping_ratio_x = 0.02
