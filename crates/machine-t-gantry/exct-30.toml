# Festo EXCT-30 T-gantry, Y stroke 1000 mm, Z stroke 250 mm, driven directly (no gearbox) by two
# Siemens SIMOTICS S-1FK2205-4AF motors on SINAMICS S210 converters 6SL3210-5HE11-5UF0 at 400 V.
# Use with `--config`. The X axis of the simulator is Festo's Y axis.
#
# Where a value comes from:
#   [catalogue]  taken or derived from catalog/festo/belt_axes.csv or catalog/siemens/*.csv; the test
#                `exct_30_config_agrees_with_the_catalogue` holds these in place
#   [estimate]   not published; a guess of the right order, with a low and a high bound in [bounds]
format_version = 1
# Obstacles in the work area, boxes along the axes of the 3D view (see docs/config-reference.md), e.g.
# obstacles = [{ name = "fixture", centre_m = [0.677, -0.05, -0.65], size_m = [0.1, 0.2, 0.1] }]
# (under the middle of the traverse, 221 mm below the payload: `collision` passes at profile.min_clearance_m 0.17)
# or as [[obstacles]] tables at the end of the file. None by default.
obstacles = []

[sim]
dt_s = 62.5e-6
substeps = 4

# Parts by name from the catalogue in catalog/: a motor by its article number, with the supply its data
# is for ("230v" or "400v" for the S210 data, "s120" for the motor on a SINAMICS S120), and a gearbox as
# size-frame-ratio, e.g. "NRK070-04-5". A drive (S210 converter or S120 Motor Module) by its article number
# sets ratings.drive_rated_current_a and drive_max_current_a; a belt as profile-width, e.g. "AT5-25" (Megadyne
# MEGALINEAR, steel cords); an axis by name, e.g. "EXCT-30" or "ELZI-40" (Festo, Bahr), sets pulley, belt,
# moved masses and the pulley rating, and keeps the strokes. The catalogue values of a named part replace the
# numbers this file has for it when the config is loaded. "" names none.
# The motor and drive values further down are what the catalogue gives for them; they document them and
# are what is used if the names are taken out. The axis is not named: this file's numbers are those
# `axis = "EXCT-30"` gives (the test `an_axis_by_name_gives_the_numbers_of_the_hand_written_exct_30` holds them),
# and naming it would set the carriage to the mass fitted to Festo's torque formula once more, to a few grams.
[parts]
motor = "1FK2205-4AF"
motor_supply = "400v"
gearbox = ""
drive = "6SL3210-5HE11-5UF0"
belt = ""
axis = ""

[effects]
gravity = true
payload = true
belt_stretch = true
belt_damping = true
belt_slack = true
belt_mass = true
belt_tooth_stiffness = false
belt_material_damping = false
guide_friction = true
load_dependent_friction = true
motor_friction = true
# Direct drive: the "gearbox" is the coupling, with ratio 1, no backlash and no loss.
gearbox_backlash = false
gearbox_efficiency = false
# The gearbox's no-load running torque at its input, over speed and its lubricant's temperature (gearbox.no_load_*):
# gearbox.efficiency then holds at gearbox.efficiency_torque_nm and falls at part load. Off here: on in the delta
# pickers D2 and D3, whose sizing was redone with them.
gearbox_drag = false
# The motor shaft's seals and bearings break away above their sliding level along a Stribeck curve
# (motor.friction_breakaway_nm, friction_stribeck_rad_s).
motor_stiction = false
# The gearbox's flanks take the load over a band beyond the backlash, with a hysteresis (gearbox.lost_motion_band_rad,
# hysteresis_rad).
gearbox_lost_motion = false
# A strain wave gear's three-segment stiffness, K1 to T1, K2 to T2, K3 beyond (gearbox.stiffness_*). Off in the shipped
# configs.
gearbox_stiffness_curve = false
torque_ripple = true
tooth_meshing = true
frame_compliance = true
tool_flex = true
idlers = false
cable_chain = false
process_force = false
hard_stops = true
holding_brake = true
temperature = false
velocity_feedforward = true
torque_feedforward = true
# The drive runs the position setpoint on between profile cycles from the last setpoints (pos + v t + a t^2 / 2),
# as its speed feedforward runs on: a SINAMICS drive's fine interpolation, which a position loop at the speed loop's
# cycle (DSC) needs once the profile cycle is longer than the position cycle. Changes nothing while they are equal.
fine_interpolation = true
# Friction feedforward from the characteristic drive.friction_feedforward_* (S120 p3820-p3839). Off: no shipped
# config has a recorded characteristic.
friction_feedforward = false
# The position loop closes on a load-side scale (S120 direct measuring system, drive.load_encoder_step) instead of
# the motor encoder, which stays for the speed loop.
load_encoder = false
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here (14 November 2026): field weakening of the d-q motor model (motor.pole_pairs, d_inductance_h), the drive's
# overload over time by its thermal image (ratings.drive_base_load_current_a, drive_overload_time_constant_s,
# drive_max_current_time_s) and the motor's three thermal nodes (motor.winding_resistance_share, winding_time_constant_s).
field_weakening = false
drive_overload = false
motor_thermal_nodes = false
# Both on by choice, see [profile] and [axis.x].
corner_blending = true
input_shaping = true
back_emf = true
voltage_limit = true
winding_heating = true
# Gearboxes and guides warm with their losses (see [thermal]). Only computed and shown, unless thermal_feedback is on.
part_heating = false
# Guide friction and gearbox losses follow the temperatures part_heating computes, the belt's stiffness the ambient
# temperature (see [thermal_feedback]). Replaces effects.temperature: its hand-set factors are not used while this is
# on. Without part_heating the parts stay at ambient. Off by default, so that earlier results stay as they were.
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point, not from cold. Nothing to do where nothing
# warms back on the run.
thermal_warm_start = true
# The belt's teeth jump over a driven pulley when the effective pull there exceeds what the slack side's tension holds
# in mesh (see belt.tooth_jump_factor); elastic model only. Off by default, so that earlier results stay as they were.
belt_tooth_jump = false
# The first sideways mode of each free belt span, a string at its live tension, against the frequencies the drive
# excites (tooth mesh, torque ripple, cogging); judged at steady speed against ratings.belt_span_resonance_band.
# Signals and a check only, nothing acts back on the motion. Off by default.
belt_span_vibration = false
# The teeth in mesh on each driven pulley from the angle the belt wraps it at the pose, found from the places of pulleys
# and idlers: wrap r / tooth pitch, in place of ratings.belt_teeth_in_mesh, in the tooth-jump law and the belt's tooth
# load. Off by default, so that earlier results stay as they were
# (half a turn on both pulleys at every pose here, pi r / p = 10.0 of the 20 teeth, as configured).
belt_wrap = false
torque_saturation = true
drive_delay = true
# The DC link voltage rises with what the motors feed back; a chopper and a braking resistor hold it down.
# On here, where the DC link values in [ratings] are meant for this drive and its 540 V.
dc_link = true
# With dc_link: the drives of the machine share one DC link (one Line Module, as on a SINAMICS S120). What a
# braking motor feeds back, a motoring one draws. The link has the capacitance of all drives together, one
# chopper with one braking resistor of the [ratings] powers, and one trip.
shared_dc_link = false
# With dc_link: a regenerative supply (an Active Line Module, as on a SINAMICS S120) holds the DC link at the bus
# level from above too and feeds what the motors give back into the mains, up to its maximum power, instead of
# the braking resistor. Its values are in [ratings]. Off by default, so that earlier results stay as they were.
regenerative_supply = false
# Off by default, so that earlier results stay as they were.
# The motor setpoints reach the drives some profile cycles late.
fieldbus_delay = false
# Each frame of motor setpoints takes up to profile.fieldbus_jitter_cycles more than the delay, pseudo-random from
# drive.noise_seed (every run the same); a late frame leaves the drives the one before. Off by default, so that
# earlier results stay as they were.
fieldbus_jitter = false
# Noise on the measured position and current.
sensor_noise = false
# With input_shaping: the shaper is set to the resonance the machine reports for the planned pose.
shaper_follows_pose = false
# Obstacles are rigid: a part moving into one stops dead there, drives on or off, and drives that were on go off
# (see docs/model-reference.md). Off by default; without obstacles it changes nothing.
crash = false

[geometry]
# [catalogue] half the effective diameter of 31.82 mm
pulley_radius_m = 0.01591
# [catalogue] strokes within the EXCT-30 range
stroke_x_m = 1.0
stroke_z_m = 0.25
# [CAD] Festo's model of this gantry (8026576): its drive heads are 1354 mm apart, the stroke and twice this
span_min_m = 0.177
z_com_drop_m = 0.2
guide_spacing_m = 0.12
# Tool tip below the carriage at z = 0; it rises with z.
z_tool_drop_m = 0.45

[mass]
# [catalogue] Festo's torque formula for 250 mm Z stroke fixes the total: with this carriage, the
# Z axis below and the pulley and belt inertia, the simulator needs the torque the formula gives.
carriage_kg = 7.16
# [catalogue] the mass Festo's formula holds against gravity at 250 mm Z stroke
z_axis_kg = 4.7
# [catalogue] rated load at maximum dynamic response
payload_kg = 3.0

[belt]
# [catalogue] 0.045 % elongation at 300 N
stiffness_ea_n = 6.667e5
# A choice of the designer, set on the machine with a tension meter: [estimate] of how well, +-100 N.
# 450 N, because the cycle takes about 240 N off a section in the worst case found. With the belt held at
# 450 N in 200 sampled runs,
#   sim-cli verdicts t-gantry --config crates/machine-t-gantry/exct-30.toml --bands --samples 200
#     --set "bounds.belt.pretension_n=[450.0,450.0]"
# the row belt-slack says that the slackest section keeps about 210 to 250 N (about 240 N off at worst;
# about 210 N off and 240 N kept with every value as written here). With the belt set 100 N low, the same
# command with --set belt.pretension_n=350.0 and both bounds at 350.0, about 110 N are left. Other seeds
# move these figures by a few newtons. With the pretension sampled along with the rest (the command without
# --set) the lowest found is about 120 N. And because both sections together then pull a pulley shaft with
# about 1215 N at most (belt set 100 N high), inside the lowest shaft rating this file allows for (1500 N).
# With the 300 N this file had, a belt set to 200 N went slack. The highest tension (558 N, 658 N with the
# belt set 100 N high, about 670 N at most in the sampled runs) is judged against
# ratings.belt_max_tension_n, an estimate of 2140 N.
pretension_n = 450.0
# [estimate]
damping_n_s_m = 100.0
mass_kg_m = 0.1
# [catalogue]
tooth_pitch_m = 0.005
# [estimate]
tooth_force_n = 2.0
# With effects.belt_tooth_stiffness: the teeth in mesh on a driven pulley give way, in series with the belt.
# [estimate]
tooth_mesh_stiffness_n_m = 5.0e6
# With effects.belt_material_damping: a section damps with its stiffness times this time (so a short
# section damps more), instead of with damping_n_s_m whatever its length.
# [estimate]
damping_time_s = 2.5e-4
# With effects.belt_tooth_jump: the teeth climb out of a driven pulley's grooves when the effective pull there exceeds
# this times the teeth in mesh (ratings.belt_teeth_in_mesh) times pitch / pulley radius times the slack side's tension:
# each tooth in mesh is held in its groove by the tension's radial pull over one pitch and pushed out by its share of
# the pull times the tangent of an effective flank angle; this is 1 / that tangent (flank, friction and the tooth's
# give together). 2.4 makes a pulley drive with 10 of 25 teeth in mesh (both sides at the pretension P plus and minus
# half the pull) jump at an effective pull of 1.5 P, between the belt makers' rule of a pretension at least the
# effective pull (which keeps the slack side at P / 2) and the slack side going slack at 2 P; with the EXCT's 10 of 20
# teeth it is 1.58 P.
# [estimate]
tooth_jump_factor = 2.4

# [estimate] Festo gives the friction torque only as a graph over speed.
[friction_x]
coulomb_n = 20.0
stiction_n = 26.0
viscous_n_s_m = 20.0
stribeck_m_s = 0.01
bristle_stiffness_n_m = 5.0e5
bristle_damping_n_s_m = 1500.0
preload_n = 200.0

[friction_z]
coulomb_n = 15.0
stiction_n = 20.0
viscous_n_s_m = 15.0
stribeck_m_s = 0.01
bristle_stiffness_n_m = 5.0e5
bristle_damping_n_s_m = 1500.0
preload_n = 200.0

[motor]
# [catalogue] 1FK2205-4AF: rotor 5.1 kg cm2
rotor_inertia_kgm2 = 5.1e-4
# [estimate]
friction_coulomb_nm = 0.05
friction_viscous_nm_s_rad = 2.0e-4
friction_smoothing_rad_s = 0.5
# With effects.motor_stiction [estimate]: the shaft's breakaway torque, 1.5 times its Coulomb level (lip seals and
# bearings break away at about 1.3 to 2 times their running torque), and the speed over which it falls to that level.
friction_breakaway_nm = 0.075
friction_stribeck_rad_s = 2.0
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.02
cogging_order = 24.0
# [catalogue] static torque 6 N m over stall current 4.7 A
torque_constant_nm_a = 1.277
# [estimate] Siemens publishes neither for the 1FK2.
resistance_ohm = 2.0
inductance_h = 0.010
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.01
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] 1FK2205-4AF: rated current 3.75 A at 400 V; thermal time constant 31 min; 18 N m at the
# maximum current of 15.1 A
# With effects.winding_heating: the winding warms with its copper loss and its resistance rises with it. At
# the rated current it settles at the rated temperature rise.
rated_current_a = 3.75
thermal_time_constant_s = 1860.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
# With effects.torque_saturation: at high current the iron saturates and a motor gives less torque per
# ampere. The torque constant falls with the square of the current to this value at the maximum current.
max_current_a = 15.1
torque_constant_at_max_current_nm_a = 1.192
# With effects.holding_brake: while the drives are disabled, a brake holds each motor shaft up to this
# torque and slips with it beyond.
# [estimate]
brake_torque_nm = 8.0

# The coupling between motor shaft and belt pulley.
[gearbox]
ratio = 1.0
efficiency = 1.0
backlash_rad = 0.0
# [estimate]
stiffness_nm_rad = 3.0e3
damping_nm_s_rad = 0.2
# The gearbox's own inertia at its input, which turns with the rotor. A gearbox named in [parts] brings it.
inertia_at_input_kgm2 = 0.0
# A coupling (ratio 1): it has no no-load torque (effects.gearbox_drag leaves a coupling out), no lost motion and one
# stiffness; these keys are there for a gearbox put in.
efficiency_torque_nm = 1.0
no_load_torque_nm = 0.0
no_load_speed_rpm = 3000.0
lost_motion_band_rad = 0.0
hysteresis_rad = 0.0
stiffness_t1_nm = 1.0
stiffness_t2_nm = 1.0
stiffness_k2_nm_rad = 3000.0
stiffness_k3_nm_rad = 3000.0

[pulley]
# [estimate]
inertia_kgm2 = 2.0e-5

# [estimate]
[frame]
mass_kg = 30.0
stiffness_n_m = 7.4e5
damping_n_s_m = 190.0

# With effects.tool_flex: the Z axis leans against the carriage when X accelerates. The guide gives way
# sideways and in tilt; the tilt counts with the distance of the Z axis's centre of mass from the carriage.
# [estimate]
[tool_flex]
lateral_stiffness_n_m = 2.0e7
tilt_stiffness_nm_rad = 1.2e4
damping_n_s_m = 80.0

# With effects.idlers: the four carriage idlers and the one at the bottom of the Z axis, all alike, turn
# with the belt that passes them. Their inertia adds to what the belt accelerates, their bearings drag.
# [estimate]
[idler]
inertia_kgm2 = 2.0e-6
radius_m = 0.012
friction_nm = 0.002

# With effects.cable_chain: the chain is fixed at the x = 0 end, so half of every metre the carriage
# travels joins the run that moves with it. It drags with a constant force.
# [estimate]
[cable_chain]
mass_kg_m = 0.5
length_at_zero_m = 0.3
drag_n = 3.0

# With effects.process_force: a force on the tool while the cycle dwells, e.g. the reaction to pressing a part in.
# [estimate]
[process]
force_x_n = 0.0
force_z_n = 20.0

# With effects.hard_stops: a spring and damper at both ends of each stroke that act only beyond it.
# [estimate]
[hard_stop]
stiffness_n_m = 1.0e6
damping_n_s_m = 5.0e3

[temperature]
friction_scale = 1.5
belt_stiffness_scale = 1.1

# With effects.part_heating: each gearbox and guide is one thermal mass that warms with its loss power (the signals
# power.gearbox_*, power.guide_*) through a thermal resistance to the air: its rise settles at resistance times the
# mean loss, with the time constant. The rated rises are the limits the 3D view colours up to. Friction and losses
# follow them only with effects.thermal_feedback (see [thermal_feedback]).
# The EXCT has no gearbox (ratio 1: the [gearbox] table is the coupling), so no gearbox warms; the gearbox values
# are there for a gearbox put in. Its guides' heat goes into the rails and the aluminium profiles, over the stroke:
# about 0.35 m2 at 10 W/(m2 K) with a fin efficiency of about 0.6 gives 0.5 K/W, about 5 kJ/K gives 40 minutes.
[thermal]
gearbox_resistance_k_w = 1.5      # [estimate]
gearbox_time_constant_s = 1200.0  # [estimate]
gearbox_max_rise_k = 50.0         # [estimate] a limit, not bounded: 90 degC housing at 40 degC around
guide_resistance_k_w = 0.5        # [estimate] rail and profile of the EXCT
guide_time_constant_s = 2400.0    # [estimate]
guide_max_rise_k = 40.0           # [estimate] a limit, not bounded: 80 degC at 40 degC around

# With effects.thermal_feedback (see mech::ThermalFeedback): the config's friction, efficiency and belt stiffness hold
# at the reference temperature, 20 °C as gearbox makers quote their no-load torque; the machine stands at the ambient
# temperature, and each gearbox and guide is warmer by its rise. A lubricant's viscosity follows
# exp(B (1/T - 1/T_ref)): B from a mineral oil's viscosities at 40 and 100 °C, 3470 K for ISO VG 32 to 4730 K for
# VG 220, 4000 K for VG 68. The guide's viscous friction follows the viscosity (its Coulomb and stiction levels stay),
# and so does the share of the gearbox's loss that is churning and bearing drag (an estimate; the rest is tooth
# friction). The belt's EA falls by the coefficient per kelvin above the reference: the polyurethane softens, but the
# steel cords carry the load (an estimate; steel's own modulus falls by about 2.5e-4 per K).
[thermal_feedback]
ambient_c = 20.0                          # [estimate]
reference_c = 20.0                        # [catalogue] the temperature gearbox makers quote their no-load torque at
viscosity_slope_k = 4000.0                # [estimate] ISO VG 68
gearbox_viscous_loss_share = 0.5          # [estimate] for a gearbox put in; the EXCT has none
# With effects.thermal_feedback [estimate]: the motor shaft's seal friction (motor.friction_coulomb_nm and
# friction_breakaway_nm) follows the gearbox's lubricant, (nu / nu_ref) to this power: a lip seal on its oil film.
seal_viscosity_exponent = 0.33
belt_stiffness_coefficient_1_k = 3.0e-4   # [estimate]

# Below Festo's limits of 5 m/s and 50 m/s2, which hold "under ideal conditions".
[axis.x]
max_velocity_m_s = 2.5
max_acceleration_m_s2 = 25.0
# A choice, for settling. With 500 m/s3 the tool was up to 0.47 mm off its target in the second half of a
# dwell when the frame and guide estimates were off together (0.16 mm with one of them at a bound), against
# a tolerance of 0.1 mm: the traverse left frame and Z axis swinging. 150 m/s3 with the input shaper of
# [profile] leaves 0.055 mm in the worst case found (`sim-cli verdicts --bands`, and `--samples 200` with
# seeds 1 to 3). Neither alone is enough: without corner blending, 150 m/s3 without the shaper leaves
# 0.099 mm and the shaper with 500 m/s3 0.22 mm.
max_jerk_m_s3 = 150.0

[axis.z]
max_velocity_m_s = 1.5
max_acceleration_m_s2 = 15.0
max_jerk_m_s3 = 500.0

[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
# With effects.drive_delay: a drive computes during one cycle what acts in the next. Whole cycles of
# the current loop for the voltage, of the velocity loop for the torque setpoint.
current_delay_cycles = 1
velocity_delay_cycles = 1
# [estimate] untuned for a real machine
kv_1_s = 50.0
# The sensitivity run shows the loop going unstable near 1.4 when rotor inertia, belt stiffness or
# inductance are 20 % off, so the gain stays well below that. Tuned with `sim-cli margins t-gantry --config
# crates/machine-t-gantry/exct-30.toml --bands` to the target of the default configs: at least 35 degrees of phase
# margin and 6 dB of gain margin in every bounds run, with friction as configured and with effects.motor_friction
# and effects.guide_friction off. 0.6 had 34.9 degrees and 6.6 dB, friction off 29.6 degrees and 5.8 dB (inductance
# at its upper bound); 0.45 has at least 47.3 degrees and 9.1 dB, friction off 38.6 degrees (belt damping at its
# lower bound) and 8.3 dB (inductance at its upper bound). 0.5 would leave 35.6 degrees friction off. (The figures
# for 0.45 are those of the margins since 13 November, the phase unwrapped; those for 0.6 and 0.5 are from before.)
velocity_kp_nm_s_rad = 0.45
velocity_tn_s = 0.01
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
# Torque feedforward: "rigid", the rigid model's inverse dynamics (inertia, gravity, speed terms), or "inertia", one
# moment of inertia per motor (the rigid model's at the start pose) times its acceleration setpoint, as a drive's
# speed/torque precontrol with the load inertia set (S120 p1498): no gravity, no coupling.
torque_feedforward_model = "rigid"
# With effects.friction_feedforward: the friction characteristic, torque over speed at rising speeds, linear between
# the points from 0 and held beyond the last (S120 p3820-p3839). [estimate] none recorded: no feedforward.
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
# The position setpoint passes a first-order lag of this time constant before the position loop compares it, so that
# it arrives with the motor the speed feedforward moves (S120 p1429 balancing). 0: off, as commissioned by default.
precontrol_balance_s = 0.0
# With effects.load_encoder: the step of the load-side scales, in the tool axes' units (m, rad). 1 um: a glass scale.
load_encoder_step = 1.0e-6
# Kp = L / T and Tn = L / R for a current loop time constant of 0.25 ms.
current_kp_v_a = 40.0
current_tn_s = 5.0e-3
# The DC link voltage, here that of a 400 V line. The winding gets sqrt(3/2) times it at most, 661 V: the
# model's one winding carries the RMS phase current, and its voltage times that current is the power of
# all three phases.
bus_voltage_v = 540.0
# [catalogue] the EXCT-30 allows 12.5 N m at the pulley; the motor could give 18 N m.
peak_torque_nm = 12.5
# [catalogue] rated torque of the 1FK2205-4AF at 400 V; the RMS torque of a cycle is judged against it.
rated_torque_nm = 4.6
# [catalogue] rated speed 3000 r/min at 400 V; the voltage is used up where the back-EMF meets what the
# DC link gives the winding, 661 V / 1.277 N m/A.
rated_speed_rad_s = 314.0
no_load_speed_rad_s = 518.0
# [catalogue] maximum speed of the 1FK2205-4AF, 6000 r/min (mechanical). The time-optimal plan turns the motor up to it
# along its torque-speed curve; the verdict motor-speed judges the cycle's peak speed against it.
max_speed_rad_s = 628.3185307179587
# [catalogue] 22-bit encoder
encoder_counts_per_rev = 4194304.0

velocity_filter_s = 0.2e-3
torque_filter_s = 0.2e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
# With effects.sensor_noise: standard deviation of the noise on the measured position, in encoder counts,
# and on the measured current. Pseudo-random from the seed, so every run is the same; each motor has a stream of its own.
# [estimate]
encoder_noise_counts = 4.0
current_noise_a = 0.02
# The seed also draws the fieldbus jitter (effects.fieldbus_jitter), from a stream of its own.
noise_seed = 1
# The axes brake through one braking resistor for all, an S120 line-up's Braking Module: verdicts judges the
# sum of their braking power against ratings.braking_resistor_continuous_w and _peak_w. Off: each axis has a
# resistor of its own (an S210). A drive by name sets it.
braking_module = false

# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged.
# Left out here: the highest gearbox input speed, because there is no gearbox.
[ratings]
# The allowable belt tension. Festo publishes no allowable belt tension for the EXCT. It states the 5 mm pitch,
# the steel cords, the 30 mm width and the stretch of the belt: 0.045 % at 300 N, which is 667 kN per unit
# strain. Megadyne's Megalinear handbook lists for 5 mm pitch steel-cord polyurethane belts, at 4 mm/m stretch:
# T5 840 N at 25 mm and 1060 N at 32 mm (about 250 kN per unit strain at 30 mm), AT5 1805 N at 25 mm and 2275 N
# at 32 mm (about 535 kN). Festo's belt is somewhat stiffer than AT5 with standard steel cords and far stiffer
# than T5, so the limit is the AT5 figure between the two widths: 2140 N at 30 mm. Read from the handbook itself
# (megadynegroup.com, md_manu_en_megalinear_web.pdf, pages 30 and 52; average values for open-ended belts, a
# quarter of the breaking strength); that Festo's belt has cords of that class is concluded from the stretch,
# not stated by Festo. This is the cords' limit. The teeth at a pulley give way before the cords do: that is
# pulley_max_torque_nm below (12.5 N m is 786 N of force difference at the 15.91 mm radius).
# [estimate]
belt_max_tension_n = 2140.0
# Below this the teeth can jump.
belt_min_tension_n = 0.0
# How far the tool may be from its target in the second half of a dwell, when the gripper acts.
settling_tolerance_m = 0.0001
# [catalogue] the EXCT-30 allows 12.5 N m at its pulleys
pulley_max_torque_nm = 12.5
# The DC link and the braking resistor of the S210. Siemens publishes neither its DC link capacitance nor its
# chopper's switch-on threshold, so these two are estimates by the SINAMICS S120 data in
# catalog/siemens/line_modules_s120.csv and braking_s120.csv: a DC link of 540 V on a 400 V line; about 44 uF per
# kW of rated power (220 uF at 5 kW, 710 uF at 16 kW), so 66 uF for this 1.5 kW converter; the chopper switching
# on at 770 V (Braking Module; 774 V in the Basic Line Modules).
# With effects.dc_link these are also what the simulated DC link is built from.
# [estimate]
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] the converter named in [parts] brings these from catalog/siemens/braking_s210.csv (its operating
# instructions): the internal braking resistor's 100 W and 5.7 kW, and the trip at 820 V.
braking_resistor_continuous_w = 100.0
braking_resistor_peak_w = 5700.0
dc_link_overvoltage_v = 820.0
# With effects.dc_link: a disabled drive's DC link discharges through its bleeder and the drive's own consumption
# with this time constant, down to the bus level the rectifier holds. Siemens asks to wait 5 minutes after
# switching off for the DC link to discharge; taken as 600 V falling to 60 V, 300 s / ln 10.
# [estimate]
dc_link_discharge_time_constant_s = 130.0
# With effects.regenerative_supply: an S210 has no line module of its own; this is what an S120 drive line-up would
# feed back through, the smallest Active Line Module 6SL3130-7TE21-6AA4 of catalog/siemens/line_modules_s120.csv.
# [catalogue] rated power 16 kW, maximum power 35 kW
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
# 0.28 kW loss at rated power in the catalogue, 98 %; at the small powers of this machine a guess.
# [estimate]
line_module_efficiency = 0.98
# The radial load the belt may put on a pulley shaft. Festo does not publish it.
# [estimate]
shaft_max_radial_load_n = 2000.0
# The highest load on a guide, and the dynamic load rating C of the life estimate L10 = (C / P)^3 * 50 km.
# Festo publishes neither for the guides inside the EXCT.
# [estimate]
guide_max_load_n = 2000.0
guide_dynamic_load_rating_n = 8000.0
# The life the parts are to last, against which the lives below are judged: 20000 h, the life Siemens rates its
# planetary gearboxes' planet bearings for (the 1FK2's own bearings: about 25000 h at medium load).
required_life_h = 20000.0
# Reliability of the two bearing lives (pulley shaft, gearbox planets), %: the life factor a1 of ISO 281 turns their
# L10, which 90 % of bearings reach, into the life this share reaches (0.64 at 95 %, 0.25 at 99 %). 90 to 99.95.
bearing_reliability_percent = 90.0
# Dynamic load rating C of the bearing that takes the belt's pull on a pulley shaft (in Festo's drive head),
# for its rating life (C / P)^3 * 10^6 / (60 n) h. Festo publishes neither the bearings nor a rating. Taken as
# two deep-groove ball bearings of 12 to 15 mm bore beside the pulley, C about 5 to 7.5 kN each, sharing the
# pull: each lasts (2 C / P)^3, the pair 2^(-1/1.1) of that (two bearings, Weibull slope 1.1), so the pair is one
# bearing of 4.26^(1/3) C = 1.62 C: 9500 N for 5.85 kN each, 8000 to 12000 N for the range.
# [estimate]
pulley_bearing_load_rating_n = 9500.0
# The life modification factor a_ISO of ISO 281:2007 on that bearing's life, L_nm = a1 * a_ISO * L10, from the viscosity
# ratio kappa = nu / nu1 (nu1 from the mean diameter and the pulley's mean speed by the standard's formula), the
# contamination factor e_C and the fatigue load limit C_u. Without all four a_ISO is 1.
# [estimate] the lubricant's kinematic viscosity at operating temperature, mm^2/s: a grease of ISO VG 100 base oil at
# about 50 degC; and e_C of a bearing sealed and greased for life (ISO 281:2007, Table 13: 0.8 to 0.6).
bearing_lubricant_viscosity_mm2_s = 60.0
bearing_contamination_factor = 0.7
# [estimate] the two bearings taken as 6002 (15 x 32 mm, C 5.85 kN, C0 2.85 kN): C_u = C0 / 22 = 129.5 N each by the
# standard's approximation for ball bearings below 100 mm mean diameter, 259 N for the pair that shares the pull, and
# the mean diameter (15 + 32) / 2 = 23.5 mm.
pulley_bearing_fatigue_limit_n = 259.0
pulley_bearing_mean_diameter_mm = 23.5
# The output speed at which a planetary gearbox's planet bearings last 20000 h at the rated torque. Not used:
# there is no gearbox, and no gearbox_rated_torque_nm, so the gearbox life is not judged. The value is that of the
# Siemens NRB060 with ratio 5 (Table 7-15 of the planetary gearbox configuration manual, 01/2023).
gearbox_reference_speed_rpm = 175.0
# The fatigue of the gearbox's gearing above its rated torque, by Palmgren and Miner's damage sum over the cycle's
# output torque (Siemens' own method is in its gearbox manual, which is not in this repository), on a Woehler line
# through Siemens' two figures: gearbox_max_torque_nm (M2max) for at most 30000 output revolutions (equipment manual
# 04/2025, chapter 6), and no damage at or below gearbox_rated_torque_nm (M2N). A torque M between allows
# 30000 * (M2max / M)^k output revolutions.
# [estimate] k = 8.7, the slope of the tooth root's S-N line of case-hardened gears in ISO 6336-3 (life factor 2.5 at
# 10^3 load cycles, 1 from 3 * 10^6: ln(3000) / ln(2.5)), the root stress in proportion to the torque.
# Not used: there is no gearbox and no gearbox_rated_torque_nm. The value is that of the default config.
gearbox_gearing_wohler_exponent = 8.7
# The belt's teeth, by Megadyne's MEGALINEAR handbook (02.2026, page 9): the effective pull at a pulley times a
# service factor against the specific tooth load the teeth allow at the pulley's speed, times the width and the
# teeth in mesh. [catalogue] the handbook's table for open-ended AT5 (page 52, N/cm per tooth at the pulley's
# r/min; the belt is of the AT5 class by its stretch, see belt_max_tension_n) and Festo's 30 mm width. The factor
# is the handbook's for low shock loads (1.4, its Table 4), a choice. With 10 teeth in mesh at standstill the
# teeth carry 35 * 3 * 10 / 1.4 = 750 N, close to the 786 N of Festo's 12.5 N m at the pulley.
belt_tooth_load_rpm = [0.0, 20.0, 40.0, 60.0, 80.0, 100.0, 200.0, 300.0, 400.0, 500.0, 750.0, 1000.0, 1500.0, 2000.0, 3000.0, 4000.0, 5000.0, 8000.0]
belt_tooth_load_n_cm = [35.0, 35.0, 35.0, 34.0, 34.0, 34.0, 32.0, 31.0, 30.0, 29.0, 27.0, 26.0, 24.0, 22.0, 19.0, 18.0, 16.0, 13.0]
belt_width_mm = 30.0
belt_service_factor = 1.4
# Of the pulley's 20 teeth, the half the belt wraps.
# [estimate]
belt_teeth_in_mesh = 10.0
# [estimate] With effects.belt_span_vibration: how close a span's first sideways mode may come to what the drive excites, as a
# share of the mode, at steady speed. An estimate: belt makers ask to keep the two apart without a figure; 10 % is the
# separation usually kept from a resonance.
belt_span_resonance_band = 0.1
# [catalogue] the converter 6SL3210-5HE11-5UF0 named in [parts]: rated output current 5 A, maximum 19 A
# (catalog/siemens/converters_s210.csv). The cycle's RMS and peak motor current are judged against them.
drive_rated_current_a = 5.0
drive_max_current_a = 19.0
# With effects.drive_overload [estimate]: the base load current the drive falls back to when its thermal image trips
# (0.85 of the rated current, as the S120 Motor Modules up to 30 A have it; a drive by name sets it), the time constant
# of the image, and how long the drive gives its maximum current from the rated load.
drive_base_load_current_a = 4.25
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25

[profile]
cycle_s = 1.0e-3
# With effects.fieldbus_delay: whole profile cycles between the controller computing the motor setpoints
# (position, speed, torque feedforward) and the drives using them.
fieldbus_delay_cycles = 1
# With effects.fieldbus_jitter: the most whole profile cycles a frame can take beyond the delay, evenly from 0 to it.
fieldbus_jitter_cycles = 1
setpoint_interval_s = 10.0e-3
# With effects.corner_blending. On: lifting, traversing and lowering run into one another, which takes back
# more time than the lower X jerk and the shaper cost (cycle 1.934 s with the first shaper alone, 2.048 s with
# the second one below; 2.434 s without blending, 2.136 s with
# this file's earlier 300 N, 500 m/s3, no shaper and no blending), and passes every check in the worst case.
blend_time_s = 0.15
# With effects.input_shaping: every setpoint is spread over three steps half a vibration period apart,
# so that the swings they start cancel. Tuned to one resonance; each move takes one period longer.
# On, at one fixed frequency. The tool's response to the setpoint, with the loops closed, peaks at 17.5 Hz
# and has a notch at 25 Hz. The exact frequency matters little: every check passes in 200 sampled runs with
# the shaper at 17.5, 25 or 35 Hz (tool off target by 0.050, 0.055 and 0.065 mm at most), and settling
# fails with it off (0.119 mm, in 3 of the runs). The shaper that follows the pose (effects.shaper_follows_pose) did worse here, 0.079 mm
# against 0.045 mm without blending: the frequency the machine reports is the Z axis's, and it is the
# frame's that the estimates move most.
shaper_frequency_hz = 25.0
shaper_damping = 0.03
# With effects.input_shaping: a second ZVD shaper, convolved with the first, for a second resonance (nine copies of
# the plan; each move takes the periods of both longer). 0: none.
# On, at the 17.5 Hz peak of the tool's response named above. With the 25 Hz shaper alone the worst corner of the
# bounds (`sim-cli verdicts --bands --worst`) left the tool 0.115 mm off its target in the dwell, against 0.1 mm:
# the 25 Hz shaper cancels the notch's side, the 17.5 Hz peak still rang. With both: 0.095 mm at the worst corner,
# 0.044 mm one at a time, 0.051 mm in 200 samples; the cycle takes 2.048 s instead of 1.934 s (each stop waits
# 57 ms more). Tried and not taken: the first shaper at 17.5 or 20 Hz alone (0.114, 0.110 mm), Z jerk 300 m/s3
# (0.099 mm), X jerk 100 m/s3 or a velocity gain of 0.4 or 0.5 at that corner (worse or not enough).
shaper2_frequency_hz = 17.5
shaper2_damping = 0.03
# For a path timed as fast as the motors allow: the share of the torque-speed curve the plan may use (the
# rest is for friction and elasticity, which the plan leaves out).
torque_reserve = 0.8
# For a path timed as fast as the motors allow: the share of the room between the tension that holds the tool and the
# belt's tension ratings (less tension_margin_n) that the plan's rigid model may use. 0.5, because the belt's vibration
# adds up to as much again: a change of acceleration that is quick against the belt's period (a ramp shorter than about
# a third of it) makes a lightly damped belt overshoot by up to the change itself. [estimate]
tension_reserve = 0.5
# For a path timed as fast as the motors allow: taken off both tension ratings before the share above, for what the
# rigid model leaves out whatever the room: the guides' friction, which the loss-free rigid model does not carry:
# the x guide's 20 N coulomb plus 20 N s/m at the axis' 2.5 m/s. [estimate]
tension_margin_n = 70.0
# For a path of lines and arcs: how far the planned path may leave them, so that transition curves
# (clothoids) can take it from a line into an arc at speed. 0: the path as given, and a crawl into every arc.
path_tolerance_m = 0.0
# For `sim-cli optimise`: how far the tool has to stay beyond the farther of pick and place while it traverses
# between them (an obstacle there). The optimiser lowers each lift, traverse and lower of the cycle to this and
# rounds its corners only where the path keeps it. [estimate] The lift as configured: 0.17 m above pick and place. No obstacle is known.
# The same clearance is kept from every obstacle (check "collision", and a time-optimal path that comes nearer is refused).
min_clearance_m = 0.17

# Low and high bound of every [estimate] above, in the tables and units they have there.
# `sim-cli verdicts --bands` runs the cycle with each at its low and at its high bound, one at a time,
# and `sim-cli sensitivity` uses the bounds in place of its flat percentage.
# Not bounded: the ripple and cogging orders (a count of poles and slots, not a quantity that is a little
# off) and the loop gains (settings, not properties of the machine).
[bounds]
motor.pole_pairs = [3.0, 5.0]
motor.d_inductance_h = [0.008, 0.012]
motor.winding_resistance_share = [0.2, 0.5]
motor.winding_time_constant_s = [20.0, 120.0]
ratings.drive_base_load_current_a = [4.0, 4.5]
ratings.drive_overload_time_constant_s = [2.0, 60.0]
ratings.drive_max_current_time_s = [0.1, 1.0]
geometry.span_min_m = [0.10, 0.20]
geometry.z_com_drop_m = [0.15, 0.25]
geometry.guide_spacing_m = [0.09, 0.15]
geometry.z_tool_drop_m = [0.40, 0.50]
belt.pretension_n = [350.0, 550.0]
belt.damping_n_s_m = [50.0, 200.0]
