[start]
pose = [0.1, 0.2]

# Pick-and-place cycle: lower, grip, lift, traverse, lower, release, lift, traverse.
[[cycle.segment]]
target = [0.1, 0.03]
dwell_s = 0.1
payload = true

[[cycle.segment]]
target = [0.1, 0.2]
dwell_s = 0.0
payload = true

[[cycle.segment]]
target = [0.9, 0.2]
dwell_s = 0.0
payload = true

[[cycle.segment]]
target = [0.9, 0.03]
dwell_s = 0.1
payload = false

[[cycle.segment]]
target = [0.9, 0.2]
dwell_s = 0.0
