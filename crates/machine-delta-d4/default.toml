[start]
pose = [0.1525, 0.0, -0.75, 0.0]

# The Adept cycle 25/305/25 (Omron/Adept, ABB) with a turn of the tool by 90 degrees on each traverse (ABB's cycle
# times for the four-axis IRB 360 are with a turn): up 25 mm, across 305 mm turning +90 degrees, down 25 mm, and back
# turning -90 degrees. Each leg is a move of its own, stopping at the corners; at the bottom the gripper acts for 35 ms.
# It lies on y = 0, across the centre, 100 mm below the top of the working range. "payload" is the state of the gripper
# once the segment has arrived. One pass of the six segments is one Adept cycle: one place and one pick.
[[cycle.segment]]
target = [0.1525, 0.0, -0.775, 0.0]
dwell_s = 0.035
payload = false

[[cycle.segment]]
target = [0.1525, 0.0, -0.75, 0.0]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [-0.1525, 0.0, -0.75, 1.5707963267948966]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [-0.1525, 0.0, -0.775, 1.5707963267948966]
dwell_s = 0.035
payload = true

[[cycle.segment]]
target = [-0.1525, 0.0, -0.75, 1.5707963267948966]
dwell_s = 0.0
payload = true

[[cycle.segment]]
target = [0.1525, 0.0, -0.75, 0.0]
dwell_s = 0.0
payload = true
