# Tripod (3-RPS): a platform on three electric cylinders, each a ball screw 20 x 10 behind a bellows coupling on its own
# servo motor, with a revolute joint (a trunnion) at the base and a spherical joint at the platform. A tilting table of
# 20 kg carrying 40 kg off its centre. Generic proportions; every value says where it comes from:
#   [catalogue]  read from a maker's document (catalog/siemens/*.csv, Siemens D 32; catalog/hiwin/ball_screws.csv).
#   [estimate]   ours: proportions and parts of this size as the makers' catalogues list them, not one maker's article.
# The tool pose is the platform centre's height z (m, above the base joints' plane) and the platform's tilts rx about x
# and ry about y (rad: R = Rx(rx) Ry(ry) Rz(g), the turn g about the platform's normal following from the legs'
# constraints, as do the centre's x and y).
format_version = 1
# Obstacles the machine must not touch, as for every machine (see docs/config-reference.md): a list of
# { name, centre_m, size_m } boxes, or [[obstacles]] tables. None by default.
obstacles = []

# Parts by name from the catalogue in catalog/, as for every machine (see docs/config-reference.md). "" names none:
# the numbers in this file are used as written.
[parts]
motor = ""
motor_supply = "400v"
gearbox = ""
drive = ""
belt = ""
axis = ""

# One switch per effect.
# Motor options: the holding brake (its inertia and weight) and the encoder ("" keeps drive.encoder_counts_per_rev;
# "AS22DQC", "AM22DQC", for a 1FT2 also the 26-bit "AS26DQC", "AM26DQC").
motor_brake = false
motor_encoder = ""
[effects]
gravity = true
payload = true
# Each leg's coupling, screw shaft, nut and bearings stretch under load: motor and platform are bodies of their own
# behind each leg's spring. Off, the machine is the rigid reference model, in which the motor turns with its leg's
# extension times the ratio.
joint_elasticity = true
# Friction in each leg: the rod's guide and seal, the screw nut's preload.
joint_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
# The gearbox's no-load running torque at its input, over speed and its lubricant's temperature (gearbox.no_load_*):
# gearbox.efficiency then holds at gearbox.efficiency_torque_nm and falls at part load. Off here: a coupling has none.
gearbox_drag = false
# The motor shaft's seals and bearings break away above their sliding level along a Stribeck curve
# (motor.friction_breakaway_nm, friction_stribeck_rad_s).
motor_stiction = false
# The gearbox's flanks take the load over a band beyond the backlash, with a hysteresis (gearbox.lost_motion_band_rad,
# hysteresis_rad).
gearbox_lost_motion = false
# A strain wave gear's three-segment stiffness, K1 to T1, K2 to T2, K3 beyond (gearbox.stiffness_*). Off in the shipped
# configs.
gearbox_stiffness_curve = false
torque_ripple = true
hard_stops = true
holding_brake = true
# The holding brakes engage brake.engage_delay_s after they are asked to hold (the torque off) and release
# brake.release_delay_s after they are asked to let go; a hanging axis sags while its brake engages. Off by default.
brake_delay = false
velocity_feedforward = true
torque_feedforward = true
# The drive runs the position setpoint on between profile cycles from the last setpoints (pos + v t + a t^2 / 2),
# as its speed feedforward runs on: a SINAMICS drive's fine interpolation. Changes nothing while the cycles are equal.
fine_interpolation = true
# Friction feedforward (S120 p3820-p3839): with drive.friction_feedforward_model = "machine" the friction of the
# machine's own model at the planned speed, else the characteristic drive.friction_feedforward_*.
friction_feedforward = true
# The position loop closes on a load-side scale (S120 direct measuring system, drive.load_encoder_step) instead of
# the motor encoder, which stays for the speed loop.
load_encoder = false
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here: field weakening of the d-q motor model (motor.pole_pairs, d_inductance_h), the drive's overload over time
# by its thermal image (ratings.drive_base_load_current_a, drive_overload_time_constant_s, drive_max_current_time_s)
# and the motor's three thermal nodes (motor.winding_resistance_share, winding_time_constant_s).
field_weakening = false
drive_overload = false
motor_thermal_nodes = false
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
part_heating = false
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point.
thermal_warm_start = true
torque_saturation = true
drive_delay = true
dc_link = true
shared_dc_link = false
regenerative_supply = false
fieldbus_delay = false
fieldbus_jitter = false
sensor_noise = false
shaper_follows_pose = false
# Obstacles are rigid: touching one stops the machine and takes the drives off. Without obstacles it changes nothing.
crash = false
# The frame or stand under the machine gives way on springs ([base]): it sways under the motors' reactions and the
# moving masses and takes the tool with it. Off in the shipped configs: the stiffnesses are [estimate]s.
base_compliance = false
# With base_compliance, two-way: the machine feels its base's sway and the base's energy is in the budget.
base_reaction = false
braking_resistor_heating = true
# The drives watch their following error, their standstill and their torque limit ([drive] fault_reaction and the
# keys after it); one that trips stops all, each by its fault reaction. Off by default.
drive_monitoring = false
# Motor electrical and thermal model. On here: the stator's iron loss heating the motor (motor.stall_current_a) and
# the braking resistor's temperature (ratings.braking_resistor_time_constant_s, braking_resistor_rated_rise_k). Off:
# the magnets' flux over temperature (motor.magnet_temperature_coefficient_1_k).
iron_loss = true
magnet_temperature = false

# With effects.part_heating: each gearbox (with the screw behind it) warms with its loss; the legs have couplings, so
# nothing warms but the motors. [estimate] as for the other machines' gearboxes of this size.
[thermal]
gearbox_resistance_k_w = 1.5
gearbox_time_constant_s = 1200.0
gearbox_max_rise_k = 50.0

# With effects.thermal_feedback (see mech::ThermalFeedback). [estimate] as for the other machines; the belt's
# coefficient is read but not used, as this machine has no belt.
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
# With effects.thermal_feedback [estimate]: the motor shaft's seal friction follows the gearbox's lubricant,
# (nu / nu_ref) to this power: a lip seal on its oil film.
seal_viscosity_exponent = 0.33
belt_stiffness_coefficient_1_k = 3.0e-4

[profile]
cycle_s = 1.0e-3
fieldbus_delay_cycles = 1
fieldbus_jitter_cycles = 1
setpoint_interval_s = 10.0e-3
blend_time_s = 0.05
shaper_frequency_hz = 25.0
shaper_damping = 0.03
shaper2_frequency_hz = 0.0
shaper2_damping = 0.03
# The shape of moves (see docs/config-reference.md): "s-curve" (seven segments), "sin2" (Bestehorn), "poly345" or
# "poly4567" (VDI 2143); a [[cycle.segment]] may name its own with shape = "...". Braking within deceleration_ratio of
# the acceleration limits (1: as fast as speeding up). vertical_axis: the axis that lifts against gravity ("z", "-z"
# where up is its minus direction, "" for none), which has up_acceleration_ratio of its acceleration limit upwards.
shape = "s-curve"
deceleration_ratio = 1.0
vertical_axis = "z"
up_acceleration_ratio = 1.0
# The curve a trajectory runs through its poses: "c2" (a cubic spline, the acceleration continuous) or "hermite".
trajectory_spline = "c2"
# With effects.input_shaping: the shaper ("zv", "zvd", "zvdd", "ei", "ei2"), the vibration the EI shapers allow, the
# axes the first and the second shaper act on ([] for all), and further modes, each convolved.
shaper_type = "zvd"
shaper_ei_tolerance = 0.05
shaper_axes = []
shaper_modes = []
torque_reserve = 0.8
# Read but not used: no belt.
tension_reserve = 0.8
tension_margin_n = 0.0
# The share of every limit the time-optimal plan may use, on top of the reserves above (1: all; 0.9 plans at 90 %).
time_optimal_margin = 1.0
path_tolerance_m = 0.0
min_clearance_m = 0.0
# How far a planned path may leave a corner between two lines to round it instead of stopping there. 0: stop.
corner_tolerance_m = 0.0
# How the cycle's segments are timed: "axis_limits" (the S-curves within the axis limits above) or "time_optimal"
# (each segment as fast as the motors, the gearbox and belt ratings and the jerk limits allow, rest to rest).
cycle_timing = "axis_limits"

[sim]
dt_s = 62.5e-6
substeps = 4

# [estimate] The joints: base joints on a circle of base_radius_m at 0, 120 and 240 degrees, each a revolute joint
# about the circle's tangent; platform joints (spherical) on a circle of platform_radius_m at the same angles.
[tripod]
base_radius_m = 0.3
platform_radius_m = 0.2

# [estimate] Each electric cylinder: joint to joint 450 mm retracted, 200 mm stroke; its rod's guide and seal; rubber
# buffers at the stroke's ends; the feed force its maker allows (an electric cylinder of this screw size). Its moving
# parts (rod, nut) and its body with the motor weigh mass_kg together, of which platform_share moves with the platform
# joint; the rest sits at the base joint.
[leg]
closed_length_m = 0.45
stroke_m = 0.2
friction_coulomb_n = 15.0
friction_viscous_n_s_m = 40.0
friction_smoothing_m_s = 0.002
stop_stiffness_n_m = 2.0e6
stop_damping_n_s_m = 2000.0
mass_kg = 3.0
platform_share = 0.3
max_force_n = 1500.0

# [estimate] A welded aluminium table of 500 mm across, its inertia about its centre (x, y, z, platform frame); the
# payload a body of its own: its mass, its centre in the platform frame (m, from the platform centre) and its inertia
# about that centre (a fixture with its part, some 300 mm across).
[mass]
platform_kg = 20.0
platform_inertia_kgm2 = [0.35, 0.35, 0.65]
payload_kg = 40.0
payload_offset_m = [0.05, 0.0, 0.1]
payload_inertia_kgm2 = [0.6, 0.6, 0.6]

# The box the tool may move in (z in m; rx, ry in rad), the joints' angles ([estimate] trunnions that swing +-30
# degrees, ball joints with a cone of 35 degrees) and the condition number of the Jacobian refused above.
[workspace]
tool_min = [0.5, -0.2, -0.2]
tool_max = [0.58, 0.2, 0.2]
max_revolute_angle_deg = 30.0
max_cone_angle_deg = 35.0
max_condition_number = 5.0

# The ball screw in each leg (transmission::BallScrew). [catalogue] Hiwin 20-10K3-FDC (catalog/hiwin/ball_screws.csv):
# diameters, lead, load ratings, the nut's stiffness, its d n; [estimate] the rest, fixed at the motor and supported at
# the rod end.
[screw]
lead_m = 0.01
nominal_diameter_m = 0.02
root_diameter_m = 0.017324
# [estimate] Between the bearings: the stroke, the nut's length and the run-outs.
length_m = 0.35
mounting = "fixed-supported"
efficiency = 0.9
nut_stiffness_n_m = 4.118793e8
bearing_stiffness_n_m = 5.0e8
preload_n = 400.0
dynamic_load_rating_n = 11081.5145
static_load_rating_n = 26085.689
# fw: smooth running without shocks, 1.0 to 1.2 in the makers' tables.
load_factor = 1.2
static_safety_factor = 2.0
critical_speed_factor = 0.8
buckling_safety_factor = 2.0
max_dn = 220000.0

# No gearbox: the ratio 1 is the coupling between each motor and its screw. [estimate] a bellows coupling of this size.
[gearbox]
ratio = 1.0
efficiency = 1.0
backlash_rad = 0.0
stiffness_nm_rad = 6000.0
damping_nm_s_rad = 0.3
inertia_at_input_kgm2 = 1.0e-5
# A coupling (ratio 1): it has no no-load torque, no lost motion and one stiffness; these keys are there for a gearbox
# put in.
efficiency_torque_nm = 1.0
no_load_torque_nm = 0.0
no_load_speed_rpm = 3000.0
lost_motion_band_rad = 0.0
hysteresis_rad = 0.0
stiffness_t1_nm = 1.0
stiffness_t2_nm = 1.0
stiffness_k2_nm_rad = 6000.0
stiffness_k3_nm_rad = 6000.0

[motor]
# [catalogue] 1FK2104-4AF, D 32 (catalog/siemens/motors_s210.csv): rotor 0.35 kg cm2, as is everything in [motor]
# and [drive] marked so.
rotor_inertia_kgm2 = 3.5e-5
# [estimate]
friction_coulomb_nm = 0.03
friction_viscous_nm_s_rad = 1.0e-4
friction_smoothing_rad_s = 0.5
# With effects.motor_stiction [estimate]: the shaft's breakaway torque, 1.5 times its Coulomb level, and the speed over
# which it falls to that level.
friction_breakaway_nm = 0.045
friction_stribeck_rad_s = 2.0
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.01
cogging_order = 24.0
# [catalogue] static torque 1.27 N m over stall current 1.19 A
torque_constant_nm_a = 1.06723
# [estimate] Siemens publishes no resistance for the 1FK2. The inductance as the catalogue derives it from the
# armature short-circuit braking table (catalog/siemens/dynamic_braking_1fk2.csv, 1.35 N m at most):
# kt^2 / (2 p M) = 1.06723^2 / (2 x 4 x 1.35).
resistance_ohm = 12.0
inductance_h = 0.10546
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.10546
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings, and
# its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] rated current 1.19 A at 400 V; thermal time constant 33 min; 3.75 N m at the maximum current of 4.2 A.
rated_current_a = 1.19
thermal_time_constant_s = 1980.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 4.2
torque_constant_at_max_current_nm_a = 0.89286
# [estimate]
brake_torque_nm = 3.2
# With effects.magnet_temperature [estimate]: NdFeB loses about 0.12 % of its remanence per kelvin.
# [bounds] -0.0013 ... -0.0009
magnet_temperature_coefficient_1_k = -0.0012
# [catalogue] stall current: static torque over torque constant. With effects.iron_loss the copper loss at it brings
# the winding to its rated rise, and the iron loss at the rated speed is the rest of that loss at the rated current.
stall_current_a = 1.19

# [estimate] The platform's speeds: 0.2 m/s and 0.5 rad/s take a leg to at most some 0.3 m/s, 1800 r/min of its screw.
[axis.z]
max_velocity_m_s = 0.2
max_acceleration_m_s2 = 2.0
max_jerk_m_s3 = 50.0

[axis.rx]
max_velocity_rad_s = 0.5
max_acceleration_rad_s2 = 5.0
max_jerk_rad_s3 = 200.0

[axis.ry]
max_velocity_rad_s = 0.5
max_acceleration_rad_s2 = 5.0
max_jerk_rad_s3 = 200.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# [estimate] tuned with `sim-cli margins tripod`: at least 128.9 degrees of phase and 11.35 dB of gain margin, and
# across the bounds (--bands) at least 110.1 degrees and 9.35 dB.
velocity_kp_nm_s_rad = 0.15
velocity_tn_s = 0.03
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
# Torque feedforward: "rigid", the rigid model's inverse dynamics (inertia, gravity, speed terms), or "inertia", one
# moment of inertia per motor times its acceleration setpoint.
torque_feedforward_model = "rigid"
# With effects.friction_feedforward: the friction characteristic, torque over speed at rising speeds (S120
# p3820-p3839). [estimate] none recorded: no feedforward.
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
# With effects.friction_feedforward: "characteristic" adds the characteristic above; "machine" adds in its place the
# friction of the machine's own model at the planned speed.
friction_feedforward_model = "machine"
# The position setpoint passes a first-order lag of this time constant before the position loop compares it (S120
# p1429 balancing). 0: off, as commissioned by default.
precontrol_balance_s = 0.0
# With effects.load_encoder: the step of the load-side scales, in the tool axes' units (m, rad). 1 um: a glass scale.
load_encoder_step = 1.0e-6
# Current controller: Kp = L / T and Tn = L / R give the current loop the time constant T = 0.25 ms.
current_kp_v_a = 421.84
current_tn_s = 8.788e-3
# [catalogue] a 400 V line: 540 V DC link
bus_voltage_v = 540.0
# [catalogue] 1FK2104-4AF at 400 V: 3.75 N m maximum, 1.27 N m rated at 3000 r/min
peak_torque_nm = 3.75
rated_torque_nm = 1.27
rated_speed_rad_s = 314.159
# sqrt(3/2) * 540 V / 1.06723 N m/A
no_load_speed_rad_s = 619.70
# [estimate] The highest speed the motor may turn at; here the no-load speed, where the torque-speed curve ends (the
# catalogue's 754 rad/s is beyond it).
max_speed_rad_s = 619.70
# [estimate] a 22-bit encoder
encoder_counts_per_rev = 4194304.0
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
encoder_noise_counts = 4.0
current_noise_a = 0.01
noise_seed = 1
# Off: each axis brakes into a resistor of its own (an S210); on: one S120 Braking Module for all.
braking_module = false

# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged. The
# screws' own checks (speed, d n, buckling and static load under the leg's force, life) come from [screw] and
# ratings.required_life_h, for each leg; the legs' force, stroke and joint angles from [leg] and [workspace].
blocked_speed_rad_s = 12.57
blocked_time_s = 3.0
# effects.drive_monitoring: how a drive stops when the drives trip. [estimate] OFF3 in 0.1 s, as commissioned for a
# fast stop; OFF1 1 s.
fault_reaction = "off3"
# What trips it, at the motor (rad). [estimate]
following_error_window_rad = 1.0
off1_ramp_s = 1.0
off3_ramp_s = 0.1
# A category 1 stop takes the torque off after this time at the latest, as SS1's timer (p9652) does. [estimate] five
# times the OFF3 ramp.
ss1_time_s = 0.5
pulse_off_speed_rad_s = 2.09
standstill_time_s = 1.0
standstill_window_rad = 0.1
torque_band = 0.0
[ratings]
settling_tolerance_m = 0.00005
# The pose's error against the pure tilt (the farthest point of the joint circle from where the pure tilt puts it, the
# parasitic x, y and turn together) the cycle may reach, m. [estimate] what a tilting table's user allows; leave it out
# to judge none.
parasitic_tolerance_m = 0.005
# The DC link of the S210 converter. [estimate] as for the other machines' S210.
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] internal braking resistor and trip level of the S210 6SL3210-5HE10-4UF0 (catalog/siemens/braking_s210.csv)
braking_resistor_continuous_w = 50.0
braking_resistor_peak_w = 1200.0
dc_link_overvoltage_v = 820.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] S120 Active Line Module 6SL3130-7TE21-6AA4, for effects.regenerative_supply; its efficiency [estimate].
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
required_life_h = 20000.0
bearing_reliability_percent = 90.0
# [catalogue] S210 converter 6SL3210-5HE10-4UF0 (catalog/siemens/converters_s210.csv): 1.2 A rated, 4.2 A maximum
drive_rated_current_a = 1.2
drive_max_current_a = 4.2
# With effects.drive_overload [estimate]: the base load current (0.85 of the rated current), the time constant of the
# thermal image, and how long the drive gives its maximum current from the rated load.
drive_base_load_current_a = 1.02
# With effects.drive_overload [estimate]: the chips' share of the power unit's rise and their time constant.
drive_chip_share = 0.3
drive_chip_time_constant_s = 1.0
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25
# With effects.braking_resistor_heating [estimate]: the braking resistor's time constant and its rise at its continuous
# power.
# [bounds] time constant 20 ... 300 s, rise 100 ... 300 K
braking_resistor_time_constant_s = 60.0
braking_resistor_rated_rise_k = 200.0

[start]
pose = [0.54, 0.0, 0.0]

# A tilting table's cycle: with the part on it a tilt about x, a tilt about y raised, both tilts lowered; back level
# without it (the part taken off and the next put on there).
[[cycle.segment]]
target = [0.54, 0.15, 0.0]
dwell_s = 0.2
payload = true

[[cycle.segment]]
target = [0.56, 0.0, 0.15]
dwell_s = 0.2
payload = true

[[cycle.segment]]
target = [0.52, -0.12, -0.12]
dwell_s = 0.2
payload = true

[[cycle.segment]]
target = [0.54, 0.0, 0.0]
dwell_s = 0.2
payload = false

# effects.brake_delay: how long the holding brakes take to engage once asked to hold, and to release once asked to let
# go. [estimate] a servo motor's spring-applied brake closes in some 10 to 60 ms and opens in some 30 to 150 ms.
[brake]
engage_delay_s = 0.03
release_delay_s = 0.06

# Low and high bound of the values that are estimates (see docs/config-reference.md): error bands, sensitivity.
[bounds]
brake.engage_delay_s = [0.01, 0.06]
brake.release_delay_s = [0.03, 0.15]
motor.pole_pairs = [3.0, 5.0]
motor.d_inductance_h = [0.08, 0.13]
motor.winding_resistance_share = [0.2, 0.5]
motor.winding_time_constant_s = [20.0, 120.0]
ratings.drive_base_load_current_a = [0.96, 1.08]
ratings.drive_overload_time_constant_s = [2.0, 60.0]
ratings.drive_max_current_time_s = [0.1, 1.0]
mass.platform_kg = [16.0, 24.0]
leg.mass_kg = [2.5, 4.0]
leg.platform_share = [0.2, 0.4]
leg.friction_coulomb_n = [8.0, 30.0]
leg.friction_viscous_n_s_m = [20.0, 80.0]
leg.max_force_n = [1200.0, 2000.0]
screw.efficiency = [0.85, 0.95]
screw.bearing_stiffness_n_m = [3.0e8, 8.0e8]
screw.preload_n = [200.0, 600.0]
gearbox.stiffness_nm_rad = [4000.0, 9000.0]
gearbox.damping_nm_s_rad = [0.1, 0.6]
motor.friction_coulomb_nm = [0.015, 0.06]
motor.friction_viscous_nm_s_rad = [0.5e-4, 2.0e-4]
motor.ripple_fraction = [0.01, 0.04]
motor.cogging_nm = [0.005, 0.02]
motor.resistance_ohm = [8.0, 16.0]
motor.inductance_h = [0.08, 0.13]
ratings.dc_link_discharge_time_constant_s = [30.0, 300.0]
ratings.line_module_efficiency = [0.95, 0.99]
thermal_feedback.ambient_c = [10.0, 40.0]
