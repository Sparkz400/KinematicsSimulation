# Serial six-axis arm: bodies, joints, masses and inertias from a URDF file, here the example in urdf/six-axis.urdf
# (6 kg payload, 1.4 m reach), each joint driven by the same motor through a strain wave gear.
#   [estimate]   all but the motor and drive (as the delta picker's).
# The tool pose is the six joint angles, rad. With kinematics.tool_space it is the flange's x, y, z (m) and its
# orientation as a rotation vector (rad) instead: see config/arm-tool.toml.

[sim]
dt_s = 62.5e-6
# Two sub-steps of the integrator, not the belt machines' four: the stiffest mode, the wrist on its gear, is near
# 530 Hz, which RK4 resolves at 31 us. Measured on the default cycle: no verdict differs from 8 sub-steps by more than
# 0.05 % (motor peak), at half the computing time.
substeps = 2

[arm]
# A path to a URDF file (no xacro), or "builtin:six-axis" / "builtin:scara".
urdf_file = "builtin:six-axis"
gear_ratios = [120.0, 120.0, 120.0, 80.0, 80.0, 80.0]
payload_kg = 6.0
# From the URDF's flange frame.
payload_offset_m = [0.05, 0.0, 0.0]
# About its centre in the flange frame: xx, yy, zz, xy, xz, yz. [estimate] a 6 kg box of 0.1 m along the flange's x
# (the tool's axis), 0.2 m along y and 0.15 m along z: m (0.2^2 + 0.15^2) / 12 = 0.03125, m (0.1^2 + 0.15^2) / 12 =
# 0.01625, m (0.1^2 + 0.2^2) / 12 = 0.025.
payload_inertia_kgm2 = [0.03125, 0.01625, 0.025, 0.0, 0.0, 0.0]
# The URDF's joints as sums of the motors' joints, one row per URDF joint (a parallelogram: see config/palletiser.toml);
# [] for one motor per joint.
joint_coupling = []
# With effects.payload_swing: the payload hangs on a pivot at the flange, its centre payload_offset_m from it, about two
# axes across that line, with this spring and damper per axis. [estimate] a carton in a soft gripper.
payload_swing_stiffness_nm_rad = 20.0
payload_swing_damping_nm_s_rad = 0.5

# Off (as shipped): the axes are the joints, [axis.j1] to [axis.j6]. On: the axes are the flange's x, y, z (m) and its
# orientation rx, ry, rz (rad: the rotation from the base frame as axis times angle), [axis.x] to [axis.rz], each piece
# of a path a straight line of the tool with its orientation held (or turned about a fixed axis). The joints by damped
# least squares, followed from home_joints along the line to the target: the solution stays on the home's branch
# (shoulder, elbow, wrist). The home: the flange 0.99 m out, 0.83 m up, pointing down (ry = pi/2), wrist bent.
[kinematics]
tool_space = false
home_joints = [0.0, 0.4, 0.2, 0.0, 0.97, 0.0]
# The tool's axes in tool space, of x, y, z, rx, ry, rz: as many as joints (one fewer on a redundant arm).
tool_axes = ["x", "y", "z", "rx", "ry", "rz"]

# In tool space: the range of x, y, z (m) and rx, ry, rz (rad, the turn from the flange's orientation at zero joints,
# which on this URDF is the base frame's), here around the flange pointing down (ry = pi/2) by up to 0.6 rad each way;
# poses in it out of reach, beyond a joint's stop or with the flange turned near half a turn from its orientation at
# zero joints (where the rotation vector jumps) are refused, and those where the condition number of the Jacobian (its
# turn rows times the flange's distance from joint 2 at the home, 0.86 m) is above max_condition_number: near the
# stretched arm or the wrist's axes 4 and 6 in line. [estimate]
[workspace]
tool_min = [0.5, -0.6, 0.3, -0.6, 0.97, -0.6]
tool_max = [1.2, 0.6, 1.1, 0.6, 2.17, 0.6]
max_condition_number = 30.0

# The tool's limits in tool space. [estimate] below what the motors' rated 314 rad/s allows with every axis at its
# limit at once at the middle of the ranges (0.9 m/s and 1.5 rad/s: 1 m/s and 2 rad/s asked 373 rad/s of motor 2).
[axis.x]
max_velocity_m_s = 0.9
max_acceleration_m_s2 = 4.0
max_jerk_m_s3 = 80.0

[axis.y]
max_velocity_m_s = 0.9
max_acceleration_m_s2 = 4.0
max_jerk_m_s3 = 80.0

[axis.z]
max_velocity_m_s = 0.9
max_acceleration_m_s2 = 4.0
max_jerk_m_s3 = 80.0

[axis.rx]
max_velocity_rad_s = 1.5
max_acceleration_rad_s2 = 8.0
max_jerk_rad_s3 = 150.0

[axis.ry]
max_velocity_rad_s = 1.5
max_acceleration_rad_s2 = 8.0
max_jerk_rad_s3 = 150.0

[axis.rz]
max_velocity_rad_s = 1.5
max_acceleration_rad_s2 = 8.0
max_jerk_rad_s3 = 150.0

# Each joint's bearings and stops. [estimate]
# The joints' limits ([estimate]: about 2000 r/min of the motors at the highest speeds).
[axis.j1]
max_velocity_rad_s = 2.0
max_acceleration_rad_s2 = 6.0
max_jerk_rad_s3 = 100.0

[axis.j2]
max_velocity_rad_s = 2.0
max_acceleration_rad_s2 = 6.0
max_jerk_rad_s3 = 100.0

[axis.j3]
max_velocity_rad_s = 2.0
max_acceleration_rad_s2 = 8.0
max_jerk_rad_s3 = 120.0

[axis.j4]
max_velocity_rad_s = 3.0
max_acceleration_rad_s2 = 15.0
max_jerk_rad_s3 = 300.0

[axis.j5]
max_velocity_rad_s = 3.0
max_acceleration_rad_s2 = 15.0
max_jerk_rad_s3 = 300.0

[axis.j6]
max_velocity_rad_s = 3.0
max_acceleration_rad_s2 = 20.0
max_jerk_rad_s3 = 400.0

# Read only where the URDF has a seventh joint (config/arm7-tool.toml).
[axis.j7]
max_velocity_rad_s = 3.0
max_acceleration_rad_s2 = 20.0
max_jerk_rad_s3 = 400.0

[joint]
friction_coulomb_nm = 1.0
friction_viscous_nm_s_rad = 0.5
friction_smoothing_rad_s = 0.01
# Where the URDF gives no limits (a continuous joint), and for the table.
min_angle_deg = -360.0
max_angle_deg = 360.0
stop_stiffness_nm_rad = 100000.0
stop_damping_nm_s_rad = 50.0

# [estimate] a strain wave gear of size 32, its ratio per joint from arm.gear_ratios.
[gearbox]
ratio = 120.0
efficiency = 0.75
backlash_rad = 0.0
stiffness_nm_rad = 67000.0
damping_nm_s_rad = 30.0
inertia_at_input_kgm2 = 1.4e-4

# The life of each joint's strain wave gear (transmission::StrainWave). [estimate] size 32.
[strain_wave]
rated_torque_nm = 137.0
rated_input_speed_rpm = 2000.0
rated_life_h = 10000.0

[motor]
# [catalogue] 1FK2105-4AF, D 32: rotor 1.7 kg cm2 (as on the delta picker, as is everything in [motor] and [drive])
rotor_inertia_kgm2 = 1.7e-4
# [estimate]
friction_coulomb_nm = 0.05
friction_viscous_nm_s_rad = 2.0e-4
friction_smoothing_rad_s = 0.5
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.02
cogging_order = 24.0
# [catalogue] static torque 5 N m over stall current 4.65 A
torque_constant_nm_a = 1.07527
# [estimate] Siemens publishes neither for the 1FK2.
resistance_ohm = 2.0
inductance_h = 0.010
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.01
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] rated current 4.35 A at 400 V; thermal time constant 37 min; 15 N m at the maximum current of 18 A.
rated_current_a = 4.35
thermal_time_constant_s = 2220.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 18.0
torque_constant_at_max_current_nm_a = 0.83333
# [estimate]
brake_torque_nm = 8.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# [estimate] scaled from the delta picker's 0.25 by the inertia at the motors.
velocity_kp_nm_s_rad = 0.15
velocity_tn_s = 0.03
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
current_kp_v_a = 40.0
current_tn_s = 5.0e-3
# [catalogue] a 400 V line: 540 V DC link
bus_voltage_v = 540.0
# [catalogue] 1FK2105-4AF at 400 V: 15 N m maximum, 4.6 N m rated at 3000 r/min
peak_torque_nm = 15.0
rated_torque_nm = 4.6
rated_speed_rad_s = 314.159
# sqrt(3/2) * 540 V / 1.07527 N m/A
no_load_speed_rad_s = 615.07
# [estimate] a 22-bit encoder
encoder_counts_per_rev = 4194304.0
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
encoder_noise_counts = 4.0
current_noise_a = 0.01
noise_seed = 1
# Off: each axis brakes into a resistor of its own (an S210); on: one S120 Braking Module for all.
braking_module = false

# The wrist's joints 4 to 6 have smaller motors and gears than the arm's 1 to 3, as a real arm has (their own tables over
# the shared ones above, catalog::motor_config). [catalogue] 1FK2104-5AF, 2.4 N m static, 7.5 N m maximum, rotor 0.56
# kg cm2, on an S210 6SL3210-5HE10-8UF0 (2.3 A rated, 7.6 A maximum): the catalogue's motor and drive. [estimate] a
# strain wave gear of size 20, its brake and the velocity gain scaled by the inertia at the motor (0.15 x 0.97 / 3.1
# kg cm2 with the gear's input).
[parts.4]
motor = "1FK2104-5AF"
drive = "6SL3210-5HE10-8UF0"

[parts.5]
motor = "1FK2104-5AF"
drive = "6SL3210-5HE10-8UF0"

[parts.6]
motor = "1FK2104-5AF"
drive = "6SL3210-5HE10-8UF0"

[motor.4]
brake_torque_nm = 3.2

[motor.5]
brake_torque_nm = 3.2

[motor.6]
brake_torque_nm = 3.2

[drive.4]
velocity_kp_nm_s_rad = 0.05

[drive.5]
velocity_kp_nm_s_rad = 0.05

[drive.6]
velocity_kp_nm_s_rad = 0.05

[gearbox.4]
stiffness_nm_rad = 25000.0
inertia_at_input_kgm2 = 4.1e-5

[gearbox.5]
stiffness_nm_rad = 25000.0
inertia_at_input_kgm2 = 4.1e-5

[gearbox.6]
stiffness_nm_rad = 25000.0
inertia_at_input_kgm2 = 4.1e-5

[strain_wave.4]
rated_torque_nm = 40.0

[strain_wave.5]
rated_torque_nm = 40.0

[strain_wave.6]
rated_torque_nm = 40.0

[ratings.4]
gearbox_rated_torque_nm = 49.0
gearbox_max_torque_nm = 76.0

[ratings.5]
gearbox_rated_torque_nm = 49.0
gearbox_max_torque_nm = 76.0

[ratings.6]
gearbox_rated_torque_nm = 49.0
gearbox_max_torque_nm = 76.0

[ratings]
# How far the tool may be off its target in the second half of a dwell: its place (m) and its turn (rad) apart. Here in
# joints, all in rad: settling_tolerance_rad judges them (the axes in m, none here, settling_tolerance_m: it is the
# flange's place in tool space, see config/arm-tool.toml). The gears' twist under the arm's weight, which the motors'
# encoders do not see, is part of it: 177 N m at joint 2 reaching out, over 67000 N m/rad, 2.6 mrad. [estimate] 3 mrad.
settling_tolerance_m = 0.005
settling_tolerance_rad = 0.003
# [estimate] size 32: limit for the average torque, repeated peak torque.
gearbox_rated_torque_nm = 216.0
gearbox_max_torque_nm = 333.0
gearbox_max_input_speed_rpm = 7000.0
# The DC link of the S210 converter. [estimate] as for the delta picker.
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] internal braking resistor and trip level of the S210 (catalog/siemens/braking_s210.csv)
braking_resistor_continuous_w = 100.0
braking_resistor_peak_w = 5700.0
dc_link_overvoltage_v = 820.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] S120 Active Line Module 6SL3130-7TE21-6AA4, for effects.regenerative_supply; its efficiency [estimate].
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
required_life_h = 20000.0
bearing_reliability_percent = 90.0
# [catalogue] S210 converter 6SL3210-5HE11-5UF0: 5 A rated, 19 A maximum
drive_rated_current_a = 5.0
drive_max_current_a = 19.0
# With effects.drive_overload [estimate]: the base load current the drive falls back to when its thermal image trips
# (0.85 of the rated current, as the S120 Motor Modules up to 30 A have it; a drive by name sets it), the time constant
# of the image, and how long the drive gives its maximum current from the rated load.
drive_base_load_current_a = 4.25
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25

[start]
pose = [-0.5, 0.2, -1.0, -0.3, -0.5, -1.0]

# A pick and place in joints: swing 75 degrees, reach out and turn the wrist, and back. Each joint passes the middle
# of its range on the way (so that a via point there is a corner corner blending can round).
[[cycle.segment]]
target = [0.8, 0.45, -0.55, 0.3, 0.5, 1.0]
dwell_s = 0.1
payload = false

[[cycle.segment]]
target = [-0.5, 0.2, -1.0, -0.3, -0.5, -1.0]
dwell_s = 0.1
payload = true

# Low and high bound of the values that are estimates (see docs/config-reference.md): error bands, sensitivity.
[bounds]
motor.pole_pairs = [3.0, 5.0]
motor.d_inductance_h = [0.008, 0.012]
motor.winding_resistance_share = [0.2, 0.5]
motor.winding_time_constant_s = [20.0, 120.0]
ratings.drive_base_load_current_a = [4.0, 4.5]
ratings.drive_overload_time_constant_s = [2.0, 60.0]
ratings.drive_max_current_time_s = [0.1, 1.0]
joint.friction_coulomb_nm = [0.5, 2.0]
joint.friction_viscous_nm_s_rad = [0.25, 1.0]
gearbox.efficiency = [0.65, 0.85]
gearbox.stiffness_nm_rad = [50000.0, 80000.0]
gearbox.damping_nm_s_rad = [15.0, 60.0]
gearbox.inertia_at_input_kgm2 = [1.0e-4, 1.8e-4]
gearbox.backlash_rad = [0.0, 2.909e-4]
motor.friction_coulomb_nm = [0.025, 0.1]
motor.friction_viscous_nm_s_rad = [1.0e-4, 4.0e-4]
motor.ripple_fraction = [0.01, 0.04]
motor.cogging_nm = [0.01, 0.04]
motor.resistance_ohm = [1.5, 3.0]
motor.inductance_h = [0.008, 0.012]
strain_wave.rated_torque_nm = [120.0, 150.0]
thermal.gearbox_resistance_k_w = [0.8, 3.0]
thermal.gearbox_time_constant_s = [600.0, 2400.0]
ratings.dc_link_discharge_time_constant_s = [30.0, 300.0]
ratings.line_module_efficiency = [0.95, 0.99]
thermal_feedback.ambient_c = [10.0, 40.0]
thermal_feedback.viscosity_slope_k = [3470.0, 4730.0]
thermal_feedback.gearbox_viscous_loss_share = [0.25, 0.75]
arm.payload_swing_stiffness_nm_rad = [10.0, 40.0]
arm.payload_swing_damping_nm_s_rad = [0.2, 1.0]
