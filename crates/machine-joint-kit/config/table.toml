# Rotary indexing table: a table and fixture of 3 kg m^2 with up to 1.5 kg m^2 of work on it, turning about a vertical
# axis by 90 degrees and back, behind a strain wave gear of ratio 100.
#   [estimate]   all but the motor and drive (as the delta picker's): a gear of this size as the makers' catalogues
#                list them, not one maker's article.

[sim]
dt_s = 62.5e-6
substeps = 4

[table]
inertia_kgm2 = 3.0
payload_inertia_kgm2 = 1.5
# For the 3D view.
radius_m = 0.4
# "strain-wave", "worm" or "planetary" (see the machine's doc).
gear = "strain-wave"

# Each joint's bearings and stops. [estimate]
[joint]
friction_coulomb_nm = 2.0
friction_viscous_nm_s_rad = 0.5
friction_smoothing_rad_s = 0.01
# The table's stops (an indexer may turn endlessly; these leave the cycle's 0 to 180 degrees room).
min_angle_deg = -150.0
max_angle_deg = 240.0
stop_stiffness_nm_rad = 1000000.0
stop_damping_nm_s_rad = 100.0

# The gear's stiffness, backlash, efficiency and inertia, as for every gearbox. [estimate] a strain wave gear of size 32,
# as the arm's: with size 25 (40000 N m/rad) the table twisted 0.57 mrad behind its setpoint while indexing.
[gearbox]
ratio = 100.0
efficiency = 0.75
backlash_rad = 0.0
stiffness_nm_rad = 67000.0
damping_nm_s_rad = 30.0
inertia_at_input_kgm2 = 1.4e-4

# With gear = "strain-wave": the life by Harmonic Drive's method (transmission::StrainWave). [estimate]
[strain_wave]
rated_torque_nm = 137.0
rated_input_speed_rpm = 2000.0
rated_life_h = 10000.0

# With gear = "worm": the efficiency from lead angle and friction (transmission::WormGear). [estimate]
[worm]
lead_angle_deg = 8.0
friction_coefficient = 0.04
pressure_angle_deg = 20.0

[motor]
# [catalogue] 1FK2105-4AF, D 32: rotor 1.7 kg cm2 (as on the delta picker, as is everything in [motor] and [drive])
rotor_inertia_kgm2 = 1.7e-4
# [estimate]
friction_coulomb_nm = 0.05
friction_viscous_nm_s_rad = 2.0e-4
friction_smoothing_rad_s = 0.5
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.02
cogging_order = 24.0
# [catalogue] static torque 5 N m over stall current 4.65 A
torque_constant_nm_a = 1.07527
# [estimate] Siemens publishes neither for the 1FK2.
resistance_ohm = 2.0
inductance_h = 0.010
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.01
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] rated current 4.35 A at 400 V; thermal time constant 37 min; 15 N m at the maximum current of 18 A.
rated_current_a = 4.35
thermal_time_constant_s = 2220.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 18.0
torque_constant_at_max_current_nm_a = 0.83333
# [estimate]
brake_torque_nm = 8.0

# [estimate] 3 rad/s is 2865 r/min of the motor.
[axis.c]
max_velocity_rad_s = 3.0
max_acceleration_rad_s2 = 15.0
max_jerk_rad_s3 = 1000.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# [estimate] scaled from the delta picker's 0.25 by the inertia at the motor.
velocity_kp_nm_s_rad = 0.15
velocity_tn_s = 0.03
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
# Torque feedforward: "rigid", the rigid model's inverse dynamics (inertia, gravity, speed terms), or "inertia", one
# moment of inertia per motor (the rigid model's at the start pose) times its acceleration setpoint, as a drive's
# speed/torque precontrol with the load inertia set (S120 p1498): no gravity, no coupling.
torque_feedforward_model = "rigid"
# With effects.friction_feedforward: the friction characteristic, torque over speed at rising speeds, linear between
# the points from 0 and held beyond the last (S120 p3820-p3839). [estimate] none recorded: no feedforward.
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
# The position setpoint passes a first-order lag of this time constant before the position loop compares it, so that
# it arrives with the motor the speed feedforward moves (S120 p1429 balancing). 0: off, as commissioned by default.
precontrol_balance_s = 0.0
# With effects.load_encoder: the step of the load-side scales, in the tool axes' units (m, rad). 1 um: a glass scale.
load_encoder_step = 1.0e-6
current_kp_v_a = 40.0
current_tn_s = 5.0e-3
# [catalogue] a 400 V line: 540 V DC link
bus_voltage_v = 540.0
# [catalogue] 1FK2105-4AF at 400 V: 15 N m maximum, 4.6 N m rated at 3000 r/min
peak_torque_nm = 15.0
rated_torque_nm = 4.6
rated_speed_rad_s = 314.159
# sqrt(3/2) * 540 V / 1.07527 N m/A
no_load_speed_rad_s = 615.07
# [estimate] a 22-bit encoder
encoder_counts_per_rev = 4194304.0
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
encoder_noise_counts = 4.0
current_noise_a = 0.01
noise_seed = 1
# effects.drive_monitoring: how a drive stops when the drives trip. "off1" ramps the speed setpoint down in off1_ramp_s
# from the rated speed (S120 p1121), "off3" in off3_ramp_s (p1135), "sto" takes the torque off at once (the motor
# coasts), "current_limit" brakes at the torque limit; at standstill, below pulse_off_speed_rad_s (p1226), the pulses
# go off. [estimate] OFF3 in 0.1 s, as commissioned for a fast stop; OFF1 1 s.
fault_reaction = "off3"
off1_ramp_s = 1.0
off3_ramp_s = 0.1
pulse_off_speed_rad_s = 2.09
# What trips it, at the motor (rad): the following error beyond its window (p2546); at standstill, after
# standstill_time_s of a resting setpoint, beyond the standstill window (p2542, p2543); held at the torque limit below
# blocked_speed_rad_s for blocked_time_s (F07900: p2175, p2177 3 s); the torque further from the model's expected
# torque than torque_band times the peak torque (0: off), as a robot controller detects a collision. [estimate]
following_error_window_rad = 1.0
standstill_window_rad = 0.1
standstill_time_s = 1.0
blocked_speed_rad_s = 12.57
blocked_time_s = 3.0
torque_band = 0.0
# Off: each axis brakes into a resistor of its own (an S210); on: one S120 Braking Module for all.
braking_module = false

[ratings]
settling_tolerance_m = 0.0002
# [estimate] the gear's limit for the average torque, its repeated peak torque and its input speed (size 32).
gearbox_rated_torque_nm = 216.0
gearbox_max_torque_nm = 333.0
gearbox_max_input_speed_rpm = 7000.0
# The DC link of the S210 converter. [estimate] as for the delta picker.
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] internal braking resistor and trip level of the S210 (catalog/siemens/braking_s210.csv)
braking_resistor_continuous_w = 100.0
braking_resistor_peak_w = 5700.0
dc_link_overvoltage_v = 820.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] S120 Active Line Module 6SL3130-7TE21-6AA4, for effects.regenerative_supply; its efficiency [estimate].
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
required_life_h = 20000.0
bearing_reliability_percent = 90.0
# [catalogue] S210 converter 6SL3210-5HE11-5UF0: 5 A rated, 19 A maximum
drive_rated_current_a = 5.0
drive_max_current_a = 19.0
# With effects.drive_overload [estimate]: the base load current the drive falls back to when its thermal image trips
# (0.85 of the rated current, as the S120 Motor Modules up to 30 A have it; a drive by name sets it), the time constant
# of the image, and how long the drive gives its maximum current from the rated load.
drive_base_load_current_a = 4.25
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25

[start]
pose = [0.0]

[[cycle.segment]]
target = [1.5707963]
dwell_s = 0.2
payload = false

[[cycle.segment]]
target = [0.0]
dwell_s = 0.2
payload = true

# Low and high bound of the values that are estimates (see docs/config-reference.md): error bands, sensitivity.
[bounds]
motor.pole_pairs = [3.0, 5.0]
motor.d_inductance_h = [0.008, 0.012]
motor.winding_resistance_share = [0.2, 0.5]
motor.winding_time_constant_s = [20.0, 120.0]
ratings.drive_base_load_current_a = [4.0, 4.5]
ratings.drive_overload_time_constant_s = [2.0, 60.0]
ratings.drive_max_current_time_s = [0.1, 1.0]
table.inertia_kgm2 = [2.5, 3.5]
joint.friction_coulomb_nm = [1.0, 4.0]
joint.friction_viscous_nm_s_rad = [0.25, 1.0]
gearbox.efficiency = [0.65, 0.85]
gearbox.stiffness_nm_rad = [50000.0, 80000.0]
gearbox.damping_nm_s_rad = [15.0, 60.0]
gearbox.inertia_at_input_kgm2 = [1.0e-4, 1.8e-4]
gearbox.backlash_rad = [0.0, 2.909e-4]
motor.friction_coulomb_nm = [0.025, 0.1]
motor.friction_viscous_nm_s_rad = [1.0e-4, 4.0e-4]
motor.ripple_fraction = [0.01, 0.04]
motor.cogging_nm = [0.01, 0.04]
motor.resistance_ohm = [1.5, 3.0]
strain_wave.rated_torque_nm = [120.0, 150.0]
thermal.gearbox_resistance_k_w = [0.8, 3.0]
thermal.gearbox_time_constant_s = [600.0, 2400.0]
ratings.dc_link_discharge_time_constant_s = [30.0, 300.0]
ratings.line_module_efficiency = [0.95, 0.99]
thermal_feedback.ambient_c = [10.0, 40.0]
thermal_feedback.viscosity_slope_k = [3470.0, 4730.0]
thermal_feedback.gearbox_viscous_loss_share = [0.25, 0.75]
