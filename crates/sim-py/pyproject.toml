[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "kinematics-sim"
description = "Physics of belt-driven gantries and parallel pickers: runs, analyses, sizing verdicts and catalogue sizing, from Python."
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Nico Schuermann" }]
keywords = ["simulation", "kinematics", "servo", "motor sizing", "gantry", "delta robot", "physics"]
requires-python = ">=3.10"
# The arrays are NumPy's; pandas is optional (pandas.DataFrame(result) takes every table as it is).
dependencies = ["numpy>=1.23"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Sparkz400/KinematicsSimulation"
Documentation = "https://sparkz400.github.io/KinematicsSimulation/docs/python.html"
Repository = "https://github.com/Sparkz400/KinematicsSimulation"
Issues = "https://github.com/Sparkz400/KinematicsSimulation/issues"
Changelog = "https://github.com/Sparkz400/KinematicsSimulation/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==9.2.0", "pandas>=2.0", "matplotlib>=3.7", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29", "mcp==2.3.0"]
notebook = ["pandas>=2.0", "matplotlib>=3.7", "jupyter"]
# The MCP server for LLM clients (docs/mcp.md): uvx --from "kinematics-sim[mcp]" kinematics-sim-mcp
mcp = ["mcp>=2.3,<3"]

[project.scripts]
kinematics-sim-mcp = "kinematics_sim.mcp:main"

[tool.maturin]
# A mixed package: python/kinematics_sim (the MCP server, the stubs kinematics_sim.pyi and py.typed) with the native
# module inside it as kinematics_sim.kinematics_sim, re-exported by __init__.py.
python-source = "python"
module-name = "kinematics_sim"
# What a local run leaves there (maturin develop's native module is replaced by the build's own).
exclude = ["python/kinematics_sim/__pycache__/*", "python/kinematics_sim/*.pdb"]
