[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "kinematics-sim"
description = "Physics of belt-driven gantries and parallel pickers: runs, analyses, sizing verdicts and catalogue sizing, from Python."
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Nico Schuermann" }]
keywords = ["simulation", "kinematics", "servo", "motor sizing", "gantry", "delta robot", "physics"]
requires-python = ">=3.10"
# The arrays are NumPy's; pandas is optional (pandas.DataFrame(result) takes every table as it is).
dependencies = ["numpy>=1.23"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Sparkz400/KinematicsSimulation"
Documentation = "https://sparkz400.github.io/KinematicsSimulation/docs/python.html"
Repository = "https://github.com/Sparkz400/KinematicsSimulation"
Issues = "https://github.com/Sparkz400/KinematicsSimulation/issues"
Changelog = "https://github.com/Sparkz400/KinematicsSimulation/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==9.2.0", "pandas>=2.0", "matplotlib>=3.7", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
notebook = ["pandas>=2.0", "matplotlib>=3.7", "jupyter"]

[tool.maturin]
# The stubs kinematics_sim.pyi beside this file go into the wheel with a py.typed marker.
module-name = "kinematics_sim"
