schema_version = 1
class = "ball_screw"
key = ["part_number"]
default_source = "hiwin-ballscrew"
notes = '''
Source: HIWIN Technologies, "Ballscrew Technical Information", FORM S99TE22-2009 (printed 2020), precision ground
ballscrew dimension tables of three preloaded nut types. Extracted by catalog/tools/extract_hiwin_screws.py; the
numbers are HIWIN's, the layout is ours. One row per model with a nominal diameter of 12 to 50 mm (larger ones are
left out).
series (nut type, page 42 and 3.2):
  FDW: (F) flange end, (D) double nut, (W) return tube within the nut diameter; tables "FDW Type", pages 65 to 67
    (from 16 mm). Stiffness note: "preload is 10% of dynamic load rating". 83 rows.
  FDC: (F) flange end, (D) double nut, (C) Super S return units; tables "FDC Type", pages 46 and 47 (14 to 50 mm,
    leads 5 to 50 mm). Stiffness note: "Rigidity with preload: the axial load is calculated by 10% of dynamic load".
    104 rows.
  FSH: high lead, (F) flange, (S) single nut, (H) end cap return; table "FSH Type High Lead", page 87 (15 to 50 mm,
    lead = nominal diameter or 16 / 20 mm). Stiffness note: "preload is 5% of dynamic load rating". 16 rows.
  Not taken: the single nuts without preload (FSC, FSW, FSV ...), DFSV (double start high lead, page 88, no preload
  stated), the other nut types.
part_number: HIWIN's model code as printed (nominal diameter - lead, then the circuit code: A = 1.5, B = 2.5, C = 3.5
  turns per circuit times the number of circuits; K2..K5 = Super S with 2..5 turns; S2/S4 = 1.8 x 2 / 1.8 x 4), then
  "-" and the nut type as in HIWIN's order codes ("R40-10K4-FSC-..."). Example: 32-10B2-FDW, 40-40K2-FDC.
  HIWIN prints some model codes more than once in one table, with another ball size (e.g. FDC 32-8K5 with 3.969 and
  4.763 mm balls) or another nut flange (FSH 16-16S2 with D 32 and 33 mm): those get "-<ball diameter in mm>"
  (32-8K5-FDC-4.763) and, where the ball is the same, "-D<nut outer diameter in mm>" (16-16S2-FSH-D32,
  36-20K4-FDC-D65, 32-8K5-FDC-3.969-D53).
nominal_diameter, lead, root_diameter (RD), ball_diameter: mm as printed. The pitch circle diameter (P.C.D.) is
  not a schema column and is left out.
dynamic_load_rating: C in kgf (1e6 revolutions, surface hardness HRC 60, chapter 4.4 page 37), times 9.80665.
static_load_rating: Co in kgf, times 9.80665.
axial_stiffness: nut stiffness K in kgf/um, times 9.80665e6, at the preload of each table's note (10 % C for FDW
  and FDC, 5 % C for FSH). At a lower preload P, Kn = 0.8 K (P / 0.1 C)^(1/3) (M38, page 34). The preload itself is
  not printed per model; preload_n is empty.
nut_length: FDW L (+/- 1.5), FDC L2 (whole nut, flange included), FSH L; mm.
max_dn: HIWIN's Dm-N limit, Dm being the PITCH CIRCLE diameter, not the nominal diameter of the schema's d n (with
  the nominal diameter the limit is up to 4 % less strict than HIWIN's own rule).
  FDW and FSH: 70000, the general rule "For HIWIN ballscrew, Dm x N <= 70,000" (M33, page 34; 70,000 to 180,000 with
    "structure enhancement" on request). The catalogue gives no own value for the end cap nut FSH.
  FDC: 220000, Super S series "Dm-N value up to 220,000" (chapter 3.2.1 (1), page 6).
Left empty (not printed for these types): nut_mass, preload_drag_torque (only the formula M2, Td = Kp P l / 2 pi
  with Kp = 0.05 / tan alpha as the text layer gives it (a root sign over tan alpha may be lost), page 23),
  efficiency (formulas M3/M4 only), inertia_per_length and mass_per_length of the shaft, max_length (depends on the
  accuracy grade, Table 4.10 page 37), accuracy_grade (to order, C0 to C7), backlash, lead_accuracy.
Kept as printed: FDW 40-5B1 prints "~" as its fit length S (not extracted); FDW 36-12B1 has P.C.D. 37.4 and RD 30.91
  with 6.350 mm balls while 36-12A2 has 37 / 32.132 with 4.763 mm balls; FDW 45-16B2 has RD 39.299 with 7.144 mm
  balls (P.C.D. 46.6). FDC 32-20K4 with 6.35 mm balls has K 71 kgf/um, below the 96 of 32-16K4 with the same balls
  and turns (the FSC table prints 70 and 73). FSH 32-32S4 prints flange diameter F 74 mm where 32-32S2 has 92 (not
  extracted).
'''

[[sources]]
id = "hiwin-ballscrew"
document = "HIWIN Technologies, Ballscrew Technical Information, FORM S99TE22-2009"
date = "2020-09"
locator = "chapter 6.2: FDC Type pages 46 and 47, FDW Type pages 65 to 67, FSH Type page 87; chapter 3.2.1 page 6 (Super S Dm-N); formulas M33 and M38, page 34"
method = "script:tools/extract_hiwin_screws.py"
url = "https://hiwin.com/wp-content/uploads/2026/08/HIWIN-Ballscrew-Catalog-1.pdf"
retrieved = "2026-11-14"
