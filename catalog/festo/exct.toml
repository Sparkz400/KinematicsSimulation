# Festo linear gantry EXCT: a T-gantry. Two fixed servo motors drive one toothed belt arranged in
# a T; the belt moves the slide of the Y axis (horizontal) and the Z axis (vertical).
#
# Source: Festo catalogue "Linear gantries EXCT", 2023/01.
# The numbers are the catalogue's; the layout and the field names are ours. Units are in the names.
#
# The motors couple directly onto the belt pulleys through an axial kit; the catalogue lists no
# gear unit. Motors are not part of the gantry. "max_torque_nm" and "max_no_load_torque_nm" are
# at the pulley and also apply to third-party motors.
#
# Required motor torque and speed for travel at 45 degrees, the heaviest case (one motor does
# all the work), from the catalogue's "Load values":
#
#   M = a (load_factor m_L + motor_inertia_factor J_m + constant) 1e-3
#       + gravity_factor (gravity_mass_kg + m_L) + M_R                         [N m]
#   n = v 60000 / feed_constant_mm_rev sqrt(2)                                [1/min]
#
#   a: acceleration along the path [m/s2], v: speed along the path [m/s],
#   m_L: attachment on the Z axis with payload [kg], J_m: motor inertia [kg cm2],
#   M_R: friction torque [N m], which the catalogue gives only as a graph over speed.
#
# Not extracted, because the catalogue gives them only as graphs or drawings: maximum
# acceleration over rated load and Z position, friction torque over speed, permissible support
# span, dimensions. The catalogue's sample calculation uses a constant of 39.2 and a gravity mass
# of 2.14 kg for the EXCT-15 with 200 mm Z stroke, which differs from its own formula table
# (47.5 and 2.6); the values below are the formula table's.

format_version = 1
source = "Festo, Linear gantries EXCT, catalogue 2023/01"

["EXCT-15"]
stroke_y_min_mm = 100
stroke_y_max_mm = 1000
strokes_z_mm = [100, 200]
# Tool load plus payload, at maximum dynamic response.
rated_load_kg = 1.5
max_process_force_z_n = 100
max_torque_nm = 7.75
# At 0.2 m/s and travel at 45 degrees.
max_no_load_torque_nm = 0.51
max_acceleration_m_s2 = 50
# "Under ideal conditions."
max_speed_m_s = 4.8
repetition_accuracy_mm = 0.1
# Without rated load, motors, axial kits and mounting kits.
weight_at_zero_stroke_kg = 12.1
weight_per_100_mm_stroke_y_kg = 0.95
weight_per_100_mm_stroke_z_kg = 0.32
servo_motor = "EMMT-AS-80"
axial_kit = "EAMM-A-L48-80P-G2"
coupling = "EAMD-42-40-19-16X25"
coupling_housing_third_party_motor = "EAMK-A-E17-15"

["EXCT-15".belt]
material = "PU with steel cord"
pitch_mm = 3
width_mm = 20
# The belt stretches by this much at the reference force.
elongation_percent = 0.05
elongation_reference_force_n = 100
effective_diameter_mm = 28.65
# "At 45 degrees travel."
feed_constant_mm_rev = 90

[["EXCT-15".torque_formula]]
stroke_z_mm = 100
load_factor = 10.1
motor_inertia_factor = 9.87
constant = 44.4
gravity_factor = 0.07
gravity_mass_kg = 2.3

[["EXCT-15".torque_formula]]
stroke_z_mm = 200
load_factor = 10.1
motor_inertia_factor = 9.87
constant = 47.5
gravity_factor = 0.07
gravity_mass_kg = 2.6

["EXCT-30"]
stroke_y_min_mm = 100
stroke_y_max_mm = 1500
strokes_z_mm = [250, 500]
rated_load_kg = 3
max_process_force_z_n = 300
max_torque_nm = 12.5
max_no_load_torque_nm = 1.28
max_acceleration_m_s2 = 50
max_speed_m_s = 5
repetition_accuracy_mm = 0.1
weight_at_zero_stroke_kg = 25.38
weight_per_100_mm_stroke_y_kg = 1.48
weight_per_100_mm_stroke_z_kg = 0.37
servo_motor = "EMMT-AS-100"
axial_kit = "EAMM-A-Y62-100A"
coupling = "EAMD-42-40-19-16X25"
