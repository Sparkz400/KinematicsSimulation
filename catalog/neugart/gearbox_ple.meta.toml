schema_version = 1
class = "gearbox"
key = ["size", "motor_frame", "ratio"]
default_source = "neugart-ple"
notes = '''
Source: Neugart, product catalogue chapter "PLE" (Economy Line, output shaft), edition 05.2026, English, "Technical data" pages
20 to 23. Extracted by catalog/tools/extract_neugart.py; the numbers are Neugart's, the layout is ours. Definitions
from the glossary of Neugart's Complete gearbox catalog 05.2026 (100324320), pages 206 and 207.
Sizes: PLE040, PLE060, PLE080, PLE120, PLE160; one to three stages, ratios 3 to 512 (PLE160 one and two stages only). The stage of a ratio is the "p" column of the tables.
rated_output_torque: Continuous torque T2D per size and ratio (S1, 20,000 h with n1D; glossary of the complete
  catalogue 05.2026, page 206). This edition no longer prints a nominal torque T2N: the 05.2025 edition's T2N values
  are now (mostly) printed as the Cyclic torque T2Z, which lies between T2D and T2max; the schema has no column for
  T2Z, so it is not taken.
max_output_torque: Maximum torque T2max ("highest permissible torque in the regular application cycle").
emergency_stop_output_torque: Emergency stop torque T2Stop, permitted 1,000 times.
All torques per ratio are "based on reference clamping system diameter" (footnote 4).
rated_input_speed: Continuous input speed n1D per size and ratio (S1 with T2D, thermal boundary conditions of the
  glossary: 20 degC ambient, no heat exchange with the motor); max_input_speed: Max. mechanical input speed n1max,
  one value per size. r/min to rad/s.
motor_frame: the reference clamping system bore D26 in mm (the bore marked with footnote 5, "Reference clamping
  system diameter"); clamping_hub_diameter_m is the same bore in m. One row per size and ratio with that bore; the
  other bores of the table are left out (no per-ratio values printed for them).
backlash: Standard backlash per size and stage, printed as "< x arcmin", a maximum; to rad.
max_radial_force / max_axial_force / max_tilting_moment: Fr max, Fa max, MK max per size. Fr max refers to the
  center of the output shaft (or the end of a flange output shaft; glossary).
efficiency_full_load: Efficiency per stage, all sizes; determined at the cyclic torque, n1 = 1000 r/min and 70 degC
  gearbox temperature (glossary); percent to 1.
mass_kg, no_load_torque_nm (T0 at n1 = 3,000 r/min and 20 degC gearbox temperature, glossary; so
  no_load_torque_speed is 3000 r/min), torsional_stiffness (C2t, N m/arcmin to N m/rad) and inertia_at_input (J1 at
  the reference bore, kg cm2 to kg m2): the chapter prints one value or one range per size and stage; the
  ratio-dependent values are only in Neugart's online Tec Data Finder (a configurator, not a document, not read).
  A single printed number is taken as printed (source of the table). For a range the script takes the conservative
  end, an ESTIMATE with its own source "neugart-range-estimate" and [[provenance]] entries naming exactly those
  values: the LOWER end of the stiffness range, the UPPER end of the inertia, weight and idle torque ranges.
Left out: T2Z, running noise, bending moment Mb1, service life, dimensions.

Single numbers per size and stage, taken as printed for every ratio: PLE040 idle torque 0.05 N m (all
  stages), PLE060 0.10 N m (two and three stages; one stage is a range), masses PLE040 0.4 kg (one stage) and 0.5 kg
  (three stages), PLE060 0.9 kg (one stage).
No misprints found.
'''

[[sources]]
