document = "Neugart, product catalogue chapter PLE, 05.2026, English"
date = "2026-05"
locator = "Technical data, printed pages 20 to 23: Gearbox characteristics, Output shaft loads, Input characteristics, Output torques (T2Z, T2max, T2D, T2Stop), Input speeds (n1D, n1max)"
method = "script:tools/extract_neugart.py"
url = "https://cdn.neugart.com/fileadmin/user_upload/Downloads/Catalog_Chapters/05_2026/PLE/PLE_2026_05_EN.pdf"
