document = "Neugart, Complete gearbox catalog 05.2026 (100324320), English"
date = "2026-05"
locator = "Glossary, pages 206 and 207 (definitions of T0 and its 3000 r/min reference speed, T2D, n1D, T2max, T2Stop, efficiency)"
method = "manual: definitions read from the glossary; only no_load_torque_speed_rad_s (3000 r/min) is a number from it, set in the script"
url = "https://cdn.neugart.com/fileadmin/user_upload/Downloads/Product_Catalogs/05_2026/Complete_Gearbox_Catalog_2026_05_EN.pdf"
retrieved = "2026-11-14"

