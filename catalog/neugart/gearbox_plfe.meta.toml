method = "[estimate] the conservative end of the range the chapter prints per size and stage (lower stiffness, higher inertia, mass and idle torque); the per-ratio values are only in Neugart's Tec Data Finder"
url = "https://cdn.neugart.com/fileadmin/user_upload/Downloads/Catalog_Chapters/05_2026/PLFE/PLFE_2026_05_EN.pdf"
