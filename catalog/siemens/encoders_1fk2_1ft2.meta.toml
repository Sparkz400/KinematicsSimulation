table = "encoder"
key = ["part_number"]
default_source = "1ft2-s120"
notes = '''
Source: Siemens, 1FT2 Synchronous Motors for SINAMICS S120, Configuration Manual, 02/2022, A5E50645584B AC, Table 4-1
"The 1FT2 is available with the following encoders", and for the 1FK2 Table 4-1 of the 1FK2 manual (02/2022,
A5E46927724B AD), which lists the AS22DQC and AM22DQC alone.
Typed in from the manuals; the numbers are the manuals', the layout is ours.
One row per encoder. series: the motor series that can be ordered with it. resolution_counts: 4,194,304 = 22 bit and
67,108,864 = 26 bit per revolution. multiturn_revolutions: 4096 (12 bit) for the multiturn encoders, 0 for singleturn.
The encoder is the 14th character of the article number (S, M, B, C). The manuals give no weight or inertia per encoder.
'''

