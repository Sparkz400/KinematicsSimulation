schema_version = 1
class = "drive"
table = "parameters"
key = ["config_key", "parameter"]
notes = '''
Which parameter of a SINAMICS S120 servo drive object (rotary motor; the entries tagged SERVO, SERVO_AC and SERVO_I_AC of the
List Manual, not the linear (Lin), VECTOR or HLA ones, whose units differ) takes the value of a simulator config key.
One row per config key and parameter; a key with no parameter found in the document is not in the table.
factor: the parameter's value per unit of the config key (the config's unit is the simulator's own: s, rad/s, N m s/rad ...),
  with the unit column the parameter's printed unit. rule: empty = value x factor; notch_damping = factor x
  notch_bandwidth_hz / (2 x notch_frequency_hz); zero = 0; constant = factor whatever the config has; ramp_time =
  factor x value x p1082 / rated speed (the ramps' times run from the maximum speed there, from the rated speed here).
basis: printed = the parameter's quantity and unit as the manual prints them, the factor only converts units; derived = a
  relation worked out here from what the manual prints (the Kv unit, the notch damping, a sign, a reference speed).
Text fields hold no commas (the simulator reads the table as plain CSV). The page is the printed page of the List Manual,
which is the PDF page.
The list is an aid for commissioning: parameter numbers and units can differ between firmware versions.
'''

