schema_version = 1
class = "servo_motor"
table = "shaft"
key = ["part_number_prefix"]
default_source = "d32"
notes = '''
Shaft end and mounting flange of the Siemens servomotors in siemens/motors_s210.csv, motors_1fk2_s120.csv,
motors_1ft2_s120.csv and motors_s120.csv: what a gearbox's clamping hub (bore) and adapter plate must take.
A row holds for every motor whose part_number starts with part_number_prefix (the longest matching prefix wins).
The catalogues give these dimensions per shaft height (frame), so a prefix is a frame of a series, e.g. 1FK2104
(1FK2 High Dynamic, shaft height 40) or 1FK703 (1FK7, shaft height 36); for 1FT7 the prefix also carries the cooling
letters (5A natural, 5W/7W water, 5S/7S forced ventilation), because the 1FT7 tables are headed by them.
Columns (all in mm as printed, here in m):
  shaft_diameter_m: D (1FK2/1FT2 drawings "d", "Ø d k6/h6"), the plain shaft of the standard version;
  shaft_length_m: E (1FK2/1FT2 "l"), the shaft extension from the flange face;
  centering_diameter_m: N (the "Ø ... j6" spigot);
  flange_square_m: AB (the "□" edge length of the flange);
  bolt_circle_diameter_m: M (the "Ø" of the bolt circle).
1FK2/1FT2 (catalogue D 32, the S210 chapter; the S120 motors of the same frame are the same motor: the S120
  configuration manuals list the same shaft d x l per frame and refer to the catalogue for further dimensions):
  shaft heights 20 (1F.2102), 30 (1F.2.03), 40 (1F.2.04), 48 (1F.2205), 52 (1F.2105), 63 (1F.2.06), 80 (1F.2.08) and
  100 (1F.2210). For shaft heights 30 and 40 the drawings also give an alternative smaller shaft (SH 30: 11 k6 x 23,
  SH 40: 14 k6 x 30), chosen by the shaft option of the full article number, which the motor tables do not carry;
  the standard shaft (SH 30: 14 h6 x 30, SH 40: 19 k6 x 40) is in the table.
  1FK2210-5AC and 1FT2210-5A. (S120 only) are not in the D 32 drawing of shaft height 100 (it lists -2A, -3A, -4A);
  the prefix 1FK2210 / 1FT2210 covers them as the same frame (the 1FK2 S120 configuration manual, section 9.7, draws
  1F.2210-3 to -5 in one drawing).
1FK7 and 1FT7 (catalogue D 21.4, 2017, dimensional drawings): the dimensions are the same for the versions with and
  without DRIVE-CLiQ, with resolver, with and without brake, and for the 1FT7 "flange compatible with 1FT6/1FK7" and
  "recessed flange" versions (only the length differs).
Left out: 1FK2306 and 1FK2308 (motors_1fk2_s120.csv): neither D 32 nor the 1FK2 S120 configuration manual (02/2022)
  has their dimensions. 1FT7...-1A (High Dynamic, natural cooling; motors_s120.csv): the D 21.4 dimension tables list
  only -5A, -.W and -.S types, so no prefix covers them.
No misprints found.
'''

