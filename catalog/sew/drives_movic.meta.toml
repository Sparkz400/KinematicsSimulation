notes = '''
SEW-EURODRIVE MOVI-C inverters at 3 AC 400 V line voltage, typed in from two product manuals; currents RMS, per axis.
MOVIDRIVE modular (source movidrive-modular): the axis modules MDA90A (single axis, sizes 1 - 6) and MDD90A (double axis,
  types 0020/0040 of size 1 and 0020/0040/0080 of size 2 with card slot; MDD91A has the same data). Part number:
  the type designation as printed in the manual's nameplate examples, "MDA90A-0020-503-X-S00", with the type number of
  each column of 4.9.1 - 4.9.3. They take the DC link of an MDP.. power supply module (nominal DC 560 V at 400 V
  line): supply "DC 560 V link". rated_output_current: nominal output current IN at 4 kHz PWM.
  max_output_current: the overload capacity "250% IN: max. 1 s at fPWM = 4 kHz", so 2.5 * IN, duration 1 s.
  Braking chopper, braking resistor and DC link capacitance sit in the supply modules (MDP90A, MDP92A) and the
  capacitor modules, not in the axis modules; the manual gives the axis modules no DC link capacitance, so those
  columns are empty.
MOVIDRIVE system (default source): the single-axis inverters MDX90A, sizes 1 - 5 (types 0020 - 0750), from 4.4.1 and
  4.4.2 "Technical data of the MDX9.A.. basic device 3 x AC 380 - 500 V". Part number: "MDX90A-<type>-5E3-4-S00" for
  types 0020 - 0160 (EMC filter C2, "E") and "MDX90A-<type>-503-4-S00" for 0240 - 0750 (basic interference
  suppression, "0"), as in the type list of the 2017 product manual (23061715/EN, 1.3); the 2025 manual's tables
  name the family "MDX9.A-....-5.3-4..". MOVIDRIVE technology (-T00) has the same power section.
  max_output_current: "200% IN: max. 3 s at fPWM = 4 kHz", so 2 * IN, duration 3 s.
  min_braking_resistance: RBR_min of the brake chopper. The table prints one value per size where the cells are
  merged; the column of each value was read from the pdftotext -table layout: 90 ohm size 1, 42 size 2, 24 size 3,
  13 size 4 (0240, 0320), 9 for 0460, 5.4 for 0620 and 0750.
  No internal braking resistor; the brake chopper's continuous power (the manual prints it equal to the apparent output
  power) and its peak (200 % of it) are not taken: they are chopper ratings, not those of a resistor.
  Sizes 6 - 8 (0910 - 5880) are left out: their overload capacity differs by type (150 % for 30 s from 3000 up) and
  the merged cells of their RBR_min row cannot be told apart.
dc_link_voltage: nominal DC link voltage, DC 560 V at 400 V line, for both families.
Empty for both: braking_threshold (chopper switch-on voltage) and dc_link_overvoltage (trip level) are not in the
  manuals; they print only a "maximum DC link voltage" of DC 980 V, which is not stated as a trip level, so it is not
  taken. dc_link_capacitance of the MDX90A is not printed.
The 2017 MOVIDRIVE system manual (23061715/EN) lists the MDX90A-0095 as "MDX90A-0950-5E3-4-S00" and the 0460 with 45 A
  in its type list (1.3); its technical data and the 2025 manual print 0095 / 9.5 A and 46 A, which are used here.
'''

