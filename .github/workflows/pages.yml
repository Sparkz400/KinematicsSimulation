name: Pages

# The sizing page (crates/sim-wasm/web) on GitHub Pages: https://sparkz400.github.io/KinematicsSimulation/
# and the documentation (docs/, mdBook) beside it: https://sparkz400.github.io/KinematicsSimulation/docs/
# the validation dashboard: https://sparkz400.github.io/KinematicsSimulation/validation/
# and the API docs (rustdoc): https://sparkz400.github.io/KinematicsSimulation/api/
on:
  push:
    branches: [main]
  workflow_dispatch:

# The build runs third-party actions with read access only; the deploy job alone may write Pages and get an OIDC token.
permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one instead of cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-13
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same build as the job "wasm" in ci.yml.
      - name: Build for wasm32
        run: |
          cargo build -p sim-wasm --profile wasm --locked --target wasm32-unknown-unknown
          mkdir -p site
          cp crates/sim-wasm/web/index.html site/
          cp target/wasm32-unknown-unknown/wasm/sim_wasm.wasm site/
      # mdBook and lychee as pinned release binaries, checked against their SHA-256 (no Rust dependency for the site).
      - name: Install mdBook and lychee
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfLo mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLo lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  mdbook.tar.gz" | sha256sum -c
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  lychee.tar.gz" | sha256sum -c
          tar -xzf mdbook.tar.gz -C bin
          tar -xzf lychee.tar.gz -C bin --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The docs under /docs/; a broken link or anchor between pages fails the build (web links are not fetched).
      - name: Build and check the docs
        run: |
          mdbook build docs
          lychee --offline --include-fragments --no-progress --exclude-path '404\.html$' target/book
          cp -r target/book site/docs
      # The app's build scripts (ALSA, udev) need these to document and to test it, as in ci.yml.
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libvulkan-dev
      # The rustdoc of every crate under /api/, with a page that lists them (rustdoc on stable makes none).
      - name: Build the API docs
        run: |
          cargo doc --no-deps --workspace --locked
          cp -r target/doc site/api
          {
            echo '<!doctype html><meta charset="utf-8"><title>API docs</title><h1>Kinematics Simulation: API docs</h1><ul>'
            for d in site/api/*/index.html; do c=$(basename "$(dirname "$d")"); echo "<li><a href=\"$c/index.html\">$c</a></li>"; done
            echo '</ul>'
          } > site/api/index.html
      # The validation dashboard under /validation/: the tests docs/validation.md names, run with their values written to
      # a file (KS_VALIDATION_OUT), and a page made from the tables, the run's JUnit file and the values. A failed test
      # shows as failed on the page; CI's own jobs are the gate, so the page is published either way.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Run the validation tests and build the dashboard
        run: |
          python3 tools/validation_dashboard.py --nextest-filter > "$RUNNER_TEMP/filter.txt"
          KS_VALIDATION_OUT="$RUNNER_TEMP/validation.jsonl" cargo nextest run --workspace --release --locked \
            --exclude sim-py --profile full --no-fail-fast -E "$(cat "$RUNNER_TEMP/filter.txt")" || echo "::warning::a validation test failed"
          python3 tools/validation_dashboard.py --junit target/nextest/full/junit.xml \
            --records "$RUNNER_TEMP/validation.jsonl" --out site/validation \
            --repo "https://github.com/${{ github.repository }}/blob/${{ github.sha }}" \
            --stamp "Run of commit ${GITHUB_SHA::12} on $(date -u +'%Y-%m-%d %H:%M UTC')."
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
