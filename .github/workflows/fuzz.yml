name: Fuzz

# The readers of untrusted input under libFuzzer (fuzz/), a few minutes per target: weekly and by hand. A crash fails
# the job and uploads the input that caused it; keep it as a regression test (see fuzz/Cargo.toml for running one).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "240"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [config, machine_file, trace_import, trace_run, program, urdf, tables]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # libFuzzer and the address sanitizer need a nightly; pinned by date, moved on deliberately.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-13
        with:
          toolchain: nightly-2026-11-01

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz@0.13.2

      # The seeds: the files the repository ships for each reader.
      - name: Corpus
        run: |
          corpus=fuzz/corpus/${{ matrix.target }}
          mkdir -p "$corpus"
          case "${{ matrix.target }}" in
            config) cp machines/*.toml "$corpus"; for f in crates/*/*.toml; do [ "$(basename "$f")" = Cargo.toml ] || cp "$f" "$corpus/$(basename "$(dirname "$f")")-$(basename "$f")"; done ;;
            machine_file) cp machines/*.toml "$corpus" ;;
            trace_import) cp crates/sim-components/tests/fixtures/* datasets/*/map.toml "$corpus"; head -n 200 datasets/example-synthetic-belt-axis/trace.csv > "$corpus/dataset.csv" ;;
            trace_run) cp fuzz/seeds/trace_run/* "$corpus" ;;
            program) cp fuzz/seeds/program/* "$corpus" ;;
            urdf) cp crates/machine-joint-kit/urdf/*.urdf "$corpus" ;;
            tables) cp fuzz/seeds/cam/* fuzz/seeds/trajectory/* "$corpus" ;;
          esac

      - name: Fuzz
        working-directory: fuzz
        run: >
          cargo +nightly-2026-11-01 fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} --
          -max_total_time=${{ github.event.inputs.seconds || '240' }} -timeout=20 -rss_limit_mb=4096 -max_len=65536

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
