name: Bench

# The Criterion benchmarks of crates/sim-machines/benches, one step and one pass of the default cycle per registered
# machine (the group "analysis" is left out: up to 40 s an iteration, minutes a machine), on a push to main and by
# hand, against the medians of the last run on main, kept in the Actions cache. Slower by more than 15 % with the 95 %
# intervals apart gives a warning and a table in the job summary; it never fails the run, since shared runners differ
# by 10 to 20 % from one run to the next (tools/bench_compare.py). Not on pull requests: some 20 minutes. Only a run on
# main moves the baseline, so a run by hand on a branch compares that branch with main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time, so that each run on main compares against the one before it.
concurrency:
  group: bench
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master as of 2026-11-13
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The newest baseline any earlier run on main saved (a cache key cannot be overwritten: one per run).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.run_id }}
          restore-keys: bench-baseline-

      - name: Benchmarks
        run: cargo bench -p sim-machines --bench simulate --locked -- 'step/|cycle/'

      - name: Compare with the baseline
        run: python3 tools/bench_compare.py ${{ github.ref == 'refs/heads/main' && '--save' || '' }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.run_id }}
