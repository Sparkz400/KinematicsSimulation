name: Catalogue

# The data catalogue in catalog/: schema, provenance, physics and cross-document checks, and the tools' own tests.
# catalog/.github/workflows/validate.yml is the same job for the catalogue as a repository of its own.
on:
  push:
    paths: ["catalog/**", ".github/workflows/catalogue.yml"]
  pull_request:
    paths: ["catalog/**", ".github/workflows/catalogue.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.26.0
      - name: Validate
        run: python tools/catalog.py validate
      - name: Tool tests
        run: python -m unittest discover -s tools/tests -v
