name: Bug report
description: A crash, a wrong number, or something that does not do what the docs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command or the steps in the app, and the config file if it is not one of the shipped ones (attach it).
      render: sh
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Why you think the number is wrong
      description: For a physics result, the hand calculation, vendor figure or measurement you compare it with, and its source.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, Other]
    validations:
      required: true
