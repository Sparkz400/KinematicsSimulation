[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Layers, top to bottom: sim-cli -> machine-* -> sim-components -> sim-core.
# A crate may only depend on crates below it.
[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-components = { path = "crates/sim-components" }
machine-single-axis = { path = "crates/machine-single-axis" }
machine-t-gantry = { path = "crates/machine-t-gantry" }
