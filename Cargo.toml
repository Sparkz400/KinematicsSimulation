[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Layers, top to bottom: front ends -> sim-machines (registration list) -> machine crates
# -> sim-components -> sim-core. A crate may only depend on crates below it.
# Every external version is pinned with "="; upgrades happen deliberately between phases.
[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-components = { path = "crates/sim-components" }
sim-machines = { path = "crates/sim-machines" }
sim-netlist = { path = "crates/sim-netlist" }
toml = "=1.2.1"
# Machine files may be JSON as well as TOML (read in sim-machines); already in the lock file through the app.
serde_json = "=1.0.151"
# A running simulation's snapshot as bytes (sim-fmi's serialized FMU state); both already in the lock file.
serde = { version = "=1.0.229", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
# Only the app may depend on these five.
bevy = { version = "=0.20.1", default-features = false, features = ["3d"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
# egui_plot 0.37 is the release that shares egui 0.36 with bevy_egui 0.43.
egui_plot = "=0.37.0"
# The native file dialog of the app's config file buttons.
rfd = "=0.18.0"
# Writes a changed config over the file it came from, keeping its comments; already built for Bevy's macros.
toml_edit = "=0.25.19"
# Only the PLC link may depend on these three. async-trait is async-opcua's own (already in the lock): the link's node
# manager implements its trait to time the clients' requests.
async-opcua = "=0.19.0"
async-trait = "=0.1.92"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# The physics tests integrate millions of steps; unoptimised they take minutes.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The tests, run locally: optimised as release (the physics tests integrate millions of steps), but incremental, so a
# change to one crate rebuilds what changed instead of the crate whole; `cargo nextest run --cargo-profile quick ...`.
[profile.quick]
inherits = "release"
incremental = true

# The browser module (crates/sim-wasm): one codegen unit and link-time optimisation make it some 5 % faster and 10 %
# smaller than the release build (14 November 2026); `cargo build -p sim-wasm --profile wasm`.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1

# Lints every crate takes (each crate's Cargo.toml has `[lints] workspace = true`). Allowed on purpose:
# - neg_cmp_op_on_partial_ord: `!(a < b)` is how the physics code lets a NaN through to the check that refuses it.
# - needless_range_loop: index loops over several arrays of the same length (motors, axes, sections) read as the
#   equations do.
# - type_complexity, too_many_arguments: the analysis and planning functions take what the equations need.
[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
