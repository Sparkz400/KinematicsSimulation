# The ball screw test bench of ISW, University of Stuttgart, as the `screw-axis` machine of the joint kit
# (crates/machine-joint-kit/config/common.toml and screw.toml), for the recordings of this dataset (DaRUS,
# doi:10.18419/darus-3003). Every value changed from the screw axis says where it comes from:
#   [source]     the dataset's README and metadata (table 400 kg, 0.72 m stroke, spindle 1800 mm, 40 mm screw,
#                motor 1FT7085-7WF71, SINAMICS S120, position gain 35 1/s in the recordings).
#   [catalogue]  Siemens D 21.4 (2017) for the 1FT7085-7WF7: the rows of catalog/siemens/motors_s120.csv and
#                motors_s120_electrical.csv.
#   [estimate]   ours; the lead is read from the screw's article number (below), the source does not state it.
# Values not marked here are the screw axis's own estimates (its thermal, ratings and base values); they play no part in
# the replay of these recordings.
# A replay starts from each recording's own first position and speed, whatever start.pose says (README.md).

# What every machine of this crate shares (config/common.toml); the machine's own part follows [profile] below.
format_version = 1
# Obstacles the machine must not touch, as for every machine (see docs/config-reference.md): a list of
# { name, centre_m, size_m } boxes, or [[obstacles]] tables. None by default.
obstacles = []

# Parts by name from the catalogue in catalog/, as for every machine (see docs/config-reference.md). "" names none:
# the numbers in this file are used as written.
[parts]
motor = ""
motor_supply = "400v"
# Motor options: the holding brake (its inertia and weight) and the encoder ("" keeps drive.encoder_counts_per_rev;
# "AS22DQC", "AM22DQC", for a 1FT2 also the 26-bit "AS26DQC", "AM26DQC").
motor_brake = false
motor_encoder = ""
gearbox = ""
# [estimate] the S120 Motor Module D 21.4 pairs with the motor (45 A, 90 A maximum, 1230 uF), by the catalogue: the source
# names only "Sinamics S120".
drive = "6SL3120-1TE24-5AC0"
belt = ""
axis = ""

# One switch per effect.
[effects]
# The frame or stand under the machine gives way on springs ([base]): it sways under the motors' reactions and the
# moving masses and takes the tool with it. Off in the shipped configs: the stiffnesses are [estimate]s.
base_compliance = false
# With base_compliance, two-way: the machine feels its base's sway (its motors see it and hold against it) and
# the base's energy is in the budget. Off: one-way, the base sways under the machine.
base_reaction = false
# The URDF arms' links bend, each in its first Euler-Bernoulli mode in the plane its joint turns it in ([link_bending]):
# the tool rings with them. Not on the slides and the table, which have no links. Off in the shipped configs: the
# sections are [estimate]s.
link_bending = false
gravity = true
payload = true
# The arms' payload swings on a pivot at the flange (arm.payload_swing_*): two joints no motor drives. Off here; read
# by the arms only.
payload_swing = false
# Gearbox, coupling, screw or rack twist and stretch under load: motor and load are two bodies per joint. Off, the
# machine is the rigid reference model, in which the motor turns with the joint times the ratio.
joint_elasticity = true
# Friction in the joint: bearings, guides, the screw nut's preload.
joint_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
# The ball screw's efficiency from its lead angle and its balls' friction (screw.friction_coefficient, THK's
# formula) in place of screw.efficiency, a catalogue's figure that holds the nut's preload drag, which drags apart.
# On here: the preload drag is fitted (screw.preload_n), so screw.efficiency 0.9 counted it twice, on the inertial
# force too (docs/validation.md, "Against measured data").
screw_lead_efficiency = true
# The screw's axial stiffness follows its nut: the shaft between the fixed bearing and the nut, E A / a (held at both
# ends a (L - a) / (E A L)), with the nut a from the bearing at its travel (screw.fixed_bearing_at_m), in place of the
# far end's for the whole stroke. Off here: the fit (docs/validation.md) was made with the far end's, and the source
# does not say where the stroke lies on the spindle.
screw_stiffness_with_position = false
# The gearbox's no-load running torque at its input, over speed and its lubricant's temperature (gearbox.no_load_*):
# gearbox.efficiency then holds at gearbox.efficiency_torque_nm and falls at part load. Off here: on in the delta
# pickers D2 and D3, whose sizing was redone with them.
gearbox_drag = false
# The motor shaft's seals and bearings break away above their sliding level along a Stribeck curve
# (motor.friction_breakaway_nm, friction_stribeck_rad_s).
motor_stiction = false
# [source] on: the measured axis holds -1.44 N m at rest after the S-profile and turns its friction over some 15 um of
# travel at the sine's reversals (docs/validation.md, "Against measured data"); slide.presliding_stiffness_n_m below.
slide_presliding = true
# The gearbox's flanks take the load over a band beyond the backlash, with a hysteresis (gearbox.lost_motion_band_rad,
# hysteresis_rad).
gearbox_lost_motion = false
# A strain wave gear's three-segment stiffness, K1 to T1, K2 to T2, K3 beyond (gearbox.stiffness_*). Off in the shipped
# configs.
gearbox_stiffness_curve = false
torque_ripple = true
hard_stops = true
holding_brake = true
# The holding brakes engage brake.engage_delay_s after they are asked to hold (the torque off) and release
# brake.release_delay_s after they are asked to let go; a hanging axis sags while its brake engages. Off by default, so
# that earlier results stay as they were.
brake_delay = false
velocity_feedforward = true
# [source] off: the recordings' torque command (`u_motor`) holds no term of the acceleration setpoint; regressed on the
# speed error, its integral and the acceleration setpoint, the S-profile gives -0.9 N m per m/s2 where a torque
# feedforward would give +3.1 (the sine +6.9, noise: its accelerations are 0.04 m/s2).
torque_feedforward = false
# The drive runs the position setpoint on between profile cycles from the last setpoints (pos + v t + a t^2 / 2),
# as its speed feedforward runs on: a SINAMICS drive's fine interpolation, which a position loop at the speed loop's
# cycle (DSC) needs once the profile cycle is longer than the position cycle. Changes nothing while they are equal.
fine_interpolation = true
# Friction feedforward from the characteristic drive.friction_feedforward_* (S120 p3820-p3839). Off: no shipped
# config has a recorded characteristic.
friction_feedforward = false
# The position loop closes on a load-side scale (S120 direct measuring system, drive.load_encoder_step) instead of
# the motor encoder, which stays for the speed loop.
load_encoder = false
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here (14 November 2026): the drive's overload over time by its thermal image (ratings.drive_base_load_current_a,
# drive_overload_time_constant_s, drive_max_current_time_s) and the motor's three thermal nodes
# (motor.winding_resistance_share, winding_time_constant_s). On: field weakening of the d-q motor model
# (motor.pole_pairs, d_inductance_h).
field_weakening = true
drive_overload = false
motor_thermal_nodes = false
# Motor electrical and thermal model (14 November 2026). On here: field weakening above (the d-q voltage limit), the
# stator's iron loss heating the motor (motor.stall_current_a) and the braking resistor's temperature
# (ratings.braking_resistor_time_constant_s, braking_resistor_rated_rise_k; with dc_link only). Off: the magnets' flux
# over temperature (motor.magnet_temperature_coefficient_1_k).
iron_loss = true
magnet_temperature = false
braking_resistor_heating = true
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
part_heating = false
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point, not from cold. Nothing to do where nothing
# warms back on the run.
thermal_warm_start = true
torque_saturation = true
drive_delay = true
dc_link = true
shared_dc_link = false
# [estimate] on: an S120 on an Active Line Module feeds braking energy back; the source does not name the line module.
regenerative_supply = true
fieldbus_delay = false
fieldbus_jitter = false
sensor_noise = false
shaper_follows_pose = false
# Obstacles push back on a part that goes into them with their contact stiffness and damping, so that the axes in
# contact are blocked (see docs/model-reference.md). Off by default; without obstacles it changes nothing.
crash = false
# The drives watch their following error, their standstill and their torque limit ([drive] fault_reaction and the
# keys after it); one that trips stops all, each by its fault reaction. Off by default, so that earlier results
# stay as they were.
drive_monitoring = false

# With effects.part_heating: each gearbox (with the screw or rack behind it) warms with its loss. [estimate] as for the
# delta picker's planetary gearboxes.
[thermal]
gearbox_resistance_k_w = 1.5
gearbox_time_constant_s = 1200.0
gearbox_max_rise_k = 50.0

# With effects.thermal_feedback (see mech::ThermalFeedback). [estimate] as for the other machines; the belt's
# coefficient is read but not used, as these machines have no belt.
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
# With effects.thermal_feedback [estimate]: the motor shaft's seal friction (motor.friction_coulomb_nm and
# friction_breakaway_nm) follows the gearbox's lubricant, (nu / nu_ref) to this power: a lip seal on its oil film.
seal_viscosity_exponent = 0.33
belt_stiffness_coefficient_1_k = 3.0e-4

[profile]
cycle_s = 1.0e-3
fieldbus_delay_cycles = 1
fieldbus_jitter_cycles = 1
setpoint_interval_s = 10.0e-3
blend_time_s = 0.05
shaper_frequency_hz = 25.0
shaper_damping = 0.03
shaper2_frequency_hz = 0.0
shaper2_damping = 0.03
# The shape of moves (see docs/config-reference.md): "s-curve" (seven segments), "sin2" (Bestehorn), "poly345" or
# "poly4567" (VDI 2143); a [[cycle.segment]] may name its own with shape = "...". Braking within deceleration_ratio of
# the acceleration limits (1: as fast as speeding up). vertical_axis: the axis that lifts against gravity ("z", "-z"
# where up is its minus direction, "" for none), which has up_acceleration_ratio of its acceleration limit upwards.
shape = "s-curve"
deceleration_ratio = 1.0
vertical_axis = ""
up_acceleration_ratio = 1.0
# The curve a trajectory runs through its poses: "c2" (a cubic spline, the acceleration continuous) or "hermite" (the
# slopes of the neighbours, as before 14 November 2026).
trajectory_spline = "c2"
# With effects.input_shaping: the shaper ("zv", "zvd", "zvdd", "ei", "ei2" the two-hump EI), the vibration the EI
# shapers allow, the axes the first and the second shaper act on ([] for all), and further modes, each convolved:
# { frequency_hz = 40.0, damping = 0.02, type = "ei", axes = ["z"] } (type and axes may be left out).
shaper_type = "zvd"
shaper_ei_tolerance = 0.05
shaper_axes = []
shaper_modes = []
torque_reserve = 0.8
# Read but not used: no belt.
tension_reserve = 0.8
tension_margin_n = 0.0
# The share of every limit the time-optimal plan may use, on top of the reserves above (1: all; 0.9 plans at 90 %).
time_optimal_margin = 1.0
path_tolerance_m = 0.0
# How far a planned path may leave a corner between two lines to round it instead of stopping there (as a CNC's
# G642 or a robot's zone): the corner curve starts and ends 16/3 of it from a right-angled corner. 0: stop.
corner_tolerance_m = 0.0
# The factor on the programmed feed F of a program's G1, G2, G3 and robot moves (--path): 0.5 runs them at half the feed.
# Above 0 and at most 2 (this simulator's limit); a planning value, not a run-time one. G0 rapids and the axis limits stay.
feed_override = 1.0
# How the cycle's segments are timed: "axis_limits" (the S-curves within the axis limits above) or "time_optimal"
# (each segment as fast as the motors, the gearbox and belt ratings and the jerk limits allow, rest to rest).
cycle_timing = "axis_limits"
min_clearance_m = 0.0


[sim]
dt_s = 62.5e-6
substeps = 4

[mass]
# [source] the table
carriage_kg = 400.0
payload_kg = 0.0

# The carriage on its guides. [estimate] two ball guides of size 20, four carriages.
[slide]
# [source]
stroke_m = 0.72
# 90 for an axis that moves straight up, 0 for a horizontal one.
# [estimate] the constant force of +15.4 N the S-profile's fit finds (+13.9 N on the constant-speed run), as an incline
# of asin(15.4 / (400 9.80665)): the source does not say what it is (an incline, or the linear motor's magnets).
incline_deg = 0.225
# [estimate] guides and seals of a 400 kg table: 100 N and 500 N s/m before any fit, scaled as `sim-cli fit` on the
# S-profile advises (Coulomb x 0.876, viscous x 1.446; with the nut's preload and the motor's, below), and Coulomb again
# x 1.115 once effects.screw_lead_efficiency took the screw's 0.9 off the friction (16 November 2026). The nut's force
# sensors in the source put 59 to 89 N of Coulomb friction at the table (docs/validation.md).
friction_coulomb_n = 97.7
friction_viscous_n_s_m = 723.0
friction_smoothing_m_s = 0.002
# With effects.slide_presliding. [estimate] no breakaway above the sliding level: the S-profile does not tell it, and
# on the sine, with the linear drive's force taken off by hand, the friction at 0.5 to 8 mm/s is that at 8 to 60 mm/s.
friction_breakaway_n = 97.7
friction_stribeck_m_s = 0.001
# [estimate] sigma: a turn-over of the guides' and nut's 263 N within some 10 um. The S-profile's one reversal (at
# 1 m/s2, crossed in 2 ms) gives 7e6 N/m, the sine's four 3.1e7 +- 0.6e7 (a check recording, not applied).
presliding_stiffness_n_m = 2.0e7
# [estimate] a rubber buffer at each end.
stop_stiffness_n_m = 2.0e6
stop_damping_n_s_m = 2000.0

# The ball screw (transmission::BallScrew): Steinmeyer 3526/40.40.6,3E [source], nominal diameter 40 mm [source].
# [estimate] lead 40 mm: Steinmeyer's article numbers give lead.diameter (the 3526/25.40.7,5.3NE on steinmeyer.com
# is lead 25, diameter 40); the source does not state it. Root diameter: 40 mm less one ball of 6.35 mm. Nut,
# bearings and ratings [estimate]: a preloaded nut of this size.
[screw]
lead_m = 0.04
nominal_diameter_m = 0.04
root_diameter_m = 0.0337
# Between the bearings: the stroke, the nut's length and the run-outs.
# [source] the spindle's length
length_m = 1.8
mounting = "fixed-supported"
# [estimate] The fixed bearing at the motor, 0.54 m before the nut at the stroke's start: half the run-out of the
# 1.8 m spindle beyond the 0.72 m stroke (the source does not say where the stroke lies on it). With effects.screw_stiffness_with_position.
fixed_bearing_at_m = -0.54
efficiency = 0.9
# With effects.screw_lead_efficiency: the balls' rolling friction coefficient. [estimate] THK's general value for
# ball screws, not this screw's.
friction_coefficient = 0.003
nut_stiffness_n_m = 1.0e9
bearing_stiffness_n_m = 1.0e9
# [estimate] The damping ratio of the mass behind the nut on the screw's axial spring (nut, bearings, guides; the
# damper across the screw's spring alone, c = 2 zeta sqrt(k m)): 0.04, the axial mode of a ball screw drive
# identified by Hosseinkhani (Control Methods for Improving Tracking Accuracy and Disturbance Rejection in Ball
# Screw Feed Drives, PhD thesis, University of Waterloo, 2013, Table 3.5: 865 rad/s, zeta 0.04).
axial_damping_ratio = 0.04
# [estimate] 2000 N before any fit, times the fit's 0.876 and 1.115 (above).
preload_n = 1953.0
dynamic_load_rating_n = 40000.0
static_load_rating_n = 80000.0
# fw: smooth running without shocks, 1.0 to 1.2 in the makers' tables.
load_factor = 1.2
static_safety_factor = 2.0
critical_speed_factor = 0.8
buckling_safety_factor = 2.0
# d n allowed for the nut's ball return; 0 judges none.
max_dn = 160000.0

# No gearbox: the ratio 1 is the coupling between motor and screw. [estimate] a bellows coupling for a 40 mm shaft.
[gearbox]
ratio = 1.0
efficiency = 1.0
backlash_rad = 0.0
stiffness_nm_rad = 50000.0
damping_nm_s_rad = 0.5
inertia_at_input_kgm2 = 3.0e-4
# A coupling (ratio 1): it has no no-load torque (effects.gearbox_drag leaves a coupling out), no lost motion and one
# stiffness; these keys are there for a gearbox put in.
efficiency_torque_nm = 1.0
no_load_torque_nm = 0.0
no_load_speed_rpm = 3000.0
lost_motion_band_rad = 0.0
hysteresis_rad = 0.0
stiffness_t1_nm = 1.0
stiffness_t2_nm = 1.0
stiffness_k2_nm_rad = 50000.0
stiffness_k3_nm_rad = 50000.0

[motor]
# [catalogue] 1FT7085-7WF7, D 21.4: rotor 20.7 kg cm2 without brake (the source does not say whether it has one)
rotor_inertia_kgm2 = 2.07e-3
# [estimate] 0.3 N m and 1e-3 N m s/rad before any fit, times the fit's factors (above).
friction_coulomb_nm = 0.293
friction_viscous_nm_s_rad = 1.446e-3
friction_smoothing_rad_s = 0.5
# With effects.motor_stiction [estimate]: the shaft's breakaway torque, 1.5 times its Coulomb level (lip seals and
# bearings break away at about 1.3 to 2 times their running torque), and the speed over which it falls to that level.
friction_breakaway_nm = 0.45
friction_stribeck_rad_s = 2.0
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.1
cogging_order = 24.0
# [catalogue] Siemens data sheet of the 1FT7085-7WF71-1CG0 (catalog/siemens/motors_s120_electrical.csv): 1.20 N m/A,
# winding resistance 0.12 ohm per phase at 20 degC, rotating field inductance 3.1 mH, 8 poles. The model's one winding
# has three times the phase values (sim_components::drive, as a motor named in [parts] writes them): 0.36 ohm, 9.3 mH.
# The data sheet's own time constants hold them per phase: electrical L / R = 26 ms, mechanical 3 R J / kt^2 = 0.5 ms.
torque_constant_nm_a = 1.2
resistance_ohm = 0.36
inductance_h = 0.0093
# With effects.field_weakening [catalogue]: 4 pole pairs (the data sheet's 8 poles; D 21.4 p. 8/29 prints 5 for every
# 1FT7 High Dynamic, against the data sheets of all sixteen) and the d-axis inductance, the data sheet's one rotating
# field inductance for both axes (surface magnets), as the winding has it.
pole_pairs = 4.0
d_inductance_h = 0.0093
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] D 21.4 p. 8/30: stall current I0 36 A at the static torque M0 43 N m (100 K). With effects.iron_loss the copper loss at it brings the winding to its rated
# rise, and the iron loss at the rated speed is the rest of that loss at the rated current; the S1 check ("motor-s1")
# starts at kt times it.
stall_current_a = 36.0
# With effects.magnet_temperature [estimate]: NdFeB loses about 0.12 % of its remanence per kelvin.
# [bounds] -0.0013 ... -0.0009
magnet_temperature_coefficient_1_k = -0.0012
# [catalogue] 1FT7085-7WF7, D 21.4 p. 8/29: rated current 32 A, water cooled; data sheet: thermal time constant 10 min,
# 105 N m at 126 A.
rated_current_a = 32.0
thermal_time_constant_s = 600.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 126.0
torque_constant_at_max_current_nm_a = 0.83333
# [estimate]
brake_torque_nm = 40.0

# [source] the recordings run up to 0.75 m/s and, in the sines, 7 m/s2.
[axis.x]
max_velocity_m_s = 0.8
max_acceleration_m_s2 = 10.0
max_jerk_m_s3 = 400.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 250.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
# [source] control.p.K_v of the recordings. The speed loop (PI) ran on the dSPACE board at 4 kHz; the recordings name
# its gains 166 and 69.2 without units (DaRUS-3252, recorded later: Kp = 175, Ki = 11). [estimate] from the S-profile's
# signals: its torque command regressed on the speed error and that error's integral with Ki / Kp = 69.2 1/s gives
# Kp = 616 N m per m/s at the table, 3.9 N m s/rad at the motor (3.3 to 4.0 with Ki / Kp free); Tn = 1 / 69.2 s.
kv_1_s = 35.0
velocity_kp_nm_s_rad = 3.9
velocity_tn_s = 0.01445
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
# Torque feedforward: "rigid", the rigid model's inverse dynamics (inertia, gravity, speed terms), or "inertia", one
# moment of inertia per motor (the rigid model's at the start pose) times its acceleration setpoint, as a drive's
# speed/torque precontrol with the load inertia set (S120 p1498): no gravity, no coupling.
torque_feedforward_model = "rigid"
# With effects.friction_feedforward: the friction characteristic, torque over speed at rising speeds, linear between
# the points from 0 and held beyond the last (S120 p3820-p3839). [estimate] none recorded: no feedforward.
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
# The position setpoint passes a first-order lag of this time constant before the position loop compares it, so that
# it arrives with the motor the speed feedforward moves (S120 p1429 balancing). 0: off, as commissioned by default.
precontrol_balance_s = 0.0
# With effects.load_encoder: the step of the load-side scales, in the tool axes' units (m, rad). 1 um: a glass scale.
load_encoder_step = 1.0e-6
# The current loop's gain on the one winding's 9.3 mH: three times the 40 V/A it had on the phase's 3.1 mH, so the loop's
# bandwidth L / Kp (77.5 us) and its Tn are what they were. [estimate] both.
current_kp_v_a = 120.0
current_tn_s = 5.0e-3
# [catalogue] a 400 V line: 540 V DC link
bus_voltage_v = 540.0
# The back-EMF per speed of the one winding; 0: the torque constant. [catalogue] the data sheet's voltage constant,
# 77.0 V per 1000 r/min line to line RMS at 20 degC (0.7353 V s/rad), times sqrt(3), as a motor named in [parts] sets it.
back_emf_constant_v_s_rad = 1.27357
# [catalogue] 1FT7085-7WF7, D 21.4: 105 N m maximum, 38 N m rated at 3000 r/min
peak_torque_nm = 105.0
rated_torque_nm = 38.0
rated_speed_rad_s = 314.159
# sqrt(3/2) * 540 V / 1.27357 V s/rad
no_load_speed_rad_s = 519.3
# [estimate] The highest speed the motor may turn at (its datasheet's maximum speed); here the no-load speed, where the
# torque-speed curve ends. The time-optimal plan turns the motor up to it along that curve; the verdict motor-speed
# judges the cycle's peak speed against it. A motor by name sets the catalogue's.
max_speed_rad_s = 519.3
# [source] AM2048S/R, 2048 lines; [estimate] interpolated to 2^22 counts
encoder_counts_per_rev = 4194304.0
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
encoder_noise_counts = 4.0
current_noise_a = 0.01
noise_seed = 1
# effects.drive_monitoring: how a drive stops when the drives trip. "off1" ramps the speed setpoint down in off1_ramp_s
# from the rated speed (S120 p1121), "off3" in off3_ramp_s (p1135), "sto" takes the torque off at once (the motor
# coasts), "current_limit" brakes at the torque limit; at standstill, below pulse_off_speed_rad_s (p1226), the pulses
# go off. [estimate] OFF3 in 0.1 s, as commissioned for a fast stop; OFF1 1 s.
fault_reaction = "off3"
off1_ramp_s = 1.0
off3_ramp_s = 0.1
# A category 1 stop (sim-cli run --stop-category 1, sim-cli stop) takes the torque off after this time at the latest,
# as SS1's timer (p9652) does. [estimate] as commissioned: five times the OFF3 ramp.
ss1_time_s = 0.5
pulse_off_speed_rad_s = 2.09
# What trips it, at the motor (rad): the following error beyond its window (p2546); at standstill, after
# standstill_time_s of a resting setpoint, beyond the standstill window (p2542, p2543); held at the torque limit below
# blocked_speed_rad_s for blocked_time_s (F07900: p2175, p2177 3 s); the torque further from the model's expected
# torque than torque_band times the peak torque (0: off), as a robot controller detects a collision. [estimate]
following_error_window_rad = 1.0
standstill_window_rad = 0.1
standstill_time_s = 1.0
blocked_speed_rad_s = 12.57
blocked_time_s = 3.0
torque_band = 0.0
# Off: each axis brakes into a resistor of its own (an S210); on: one S120 Braking Module for all.
braking_module = false

# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged. The
# screw's own checks (speed, d n, buckling, static load, life) come from [screw] and ratings.required_life_h.
[ratings]
settling_tolerance_m = 0.00005
# The DC link: the Motor Module in [parts] sets the capacitance and the drive currents below.
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] internal braking resistor and trip level of the S210 (catalog/siemens/braking_s210.csv)
braking_resistor_continuous_w = 100.0
braking_resistor_peak_w = 5700.0
# With effects.braking_resistor_heating [estimate]: the braking resistor's time constant and its rise at its continuous
# power. Siemens gives duty cycles (catalog/siemens/braking_s120.csv: peak power 1 s in 68 s), not these.
# [bounds] time constant 20 ... 300 s, rise 100 ... 300 K
braking_resistor_time_constant_s = 60.0
braking_resistor_rated_rise_k = 200.0
dc_link_overvoltage_v = 820.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] S120 Active Line Module 6SL3130-7TE21-6AA4, for effects.regenerative_supply; its efficiency [estimate].
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
required_life_h = 20000.0
bearing_reliability_percent = 90.0
# Set by the Motor Module in [parts].
drive_rated_current_a = 45.0
drive_max_current_a = 90.0
# With effects.drive_overload [estimate]: the base load current the drive falls back to when its thermal image trips
# (0.85 of the rated current, as the S120 Motor Modules up to 30 A have it; a drive by name sets it), the time constant
# of the image, and how long the drive gives its maximum current from the rated load.
drive_base_load_current_a = 38.0
# With effects.drive_overload [estimate]: the chips' share of the power unit's rise and their time constant, the fast
# node of the two-node image (the slow one is the heat sink's above). Siemens publishes neither.
# [bounds] share 0 ... 0.5, time constant 0.1 ... 5 s
drive_chip_share = 0.3
drive_chip_time_constant_s = 1.0
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25

[start]
pose = [0.01]

[[cycle.segment]]
target = [0.7]
dwell_s = 0.1
payload = false

[[cycle.segment]]
target = [0.1]
dwell_s = 0.1
payload = true

# With effects.base_compliance [estimate]: the machine bed the axis is bolted to, about 100 kg, swaying along the
# axis at 25 Hz (k = 100 (2 pi 25)^2 = 2.5e6 N/m); typical, not measured.
[base]
# Where it tilts about, in the tool pose's frame (x, y, z), m.
pivot_m = [0.0, 0.0, 0.0]
# Everything that sways with it, the machine on it included: its natural frequency is sqrt(k / M) / 2 pi.
mass_kg = 100.0
inertia_x_kgm2 = 10.0
inertia_y_kgm2 = 10.0
inertia_z_kgm2 = 10.0
# 0: rigid in that direction (no state).
stiffness_x_n_m = 2.5e6
stiffness_y_n_m = 0.0
stiffness_z_n_m = 0.0
tilt_stiffness_x_nm_rad = 0.0
tilt_stiffness_y_nm_rad = 0.0
tilt_stiffness_z_nm_rad = 0.0
damping_ratio_x = 0.02
damping_ratio_y = 0.02
damping_ratio_z = 0.02
damping_ratio_rx = 0.02
damping_ratio_ry = 0.02
damping_ratio_rz = 0.02

# effects.brake_delay: how long the holding brakes take to engage once asked to hold, and to release once asked to let
# go. [estimate] the Siemens motor data in catalog/ gives no brake times; a servo motor's spring-applied brake closes in
# some 10 to 60 ms and opens in some 30 to 150 ms.
[brake]
engage_delay_s = 0.03
release_delay_s = 0.06

