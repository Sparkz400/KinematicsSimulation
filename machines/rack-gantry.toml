# A long two-axis gantry as a machine file: X, 3 m, on a rack and pinion behind a planetary gearbox of ratio 10
# ([gearbox.mx]), Y on a belt as the XYZ portal's (machines/xyz-portal.toml). The pinion (module 2, 30 teeth, helical,
# 200 mm per turn) is laid out as [rack] of the joint kit's rack axis in [rack_x]; its check rack-feed-force judges
# the force on its teeth (signal rack.mx.feed_force) against the pair's rated feed force over the service factor. Y
# runs from its carriage's clamp round its motor's pulley and an idler back to the clamp: two sections. The payload
# rides on the Y carriage. The value tables are the portal's placeholders, the rack's those of the joint kit's rack
# axis; nothing here is a real machine.
# Placeholder values; units are in the field names. See docs/machine-files.md.
format_version = 1
# Obstacles in the work area, boxes along the axes of the 3D view (see docs/config-reference.md), or as
# [[obstacles]] tables at the end of the file. None by default.
obstacles = []

[sim]
dt_s = 62.5e-6
substeps = 4

# Parts by name from the catalogue in catalog/: a motor by its article number, with the supply its data
# is for ("230v" or "400v" for the S210 data, "s120" for the motor on a SINAMICS S120), and a gearbox as
# size-frame-ratio, e.g. "NRK070-04-5". A drive (S210 converter or S120 Motor Module) by its article number
# sets ratings.drive_rated_current_a and drive_max_current_a; a belt as profile-width, e.g. "AT5-25" (Megadyne
# MEGALINEAR, steel cords); an axis by name, e.g. "EXCT-30" or "ELZI-40" (Festo, Bahr), sets pulley, belt,
# moved masses and the pulley rating, and keeps the strokes. The catalogue values of a named part replace the
# numbers this file has for it when the config is loaded. "" names none.
[parts]
motor = ""
motor_supply = "400v"
gearbox = ""
drive = ""
belt = ""
axis = ""

# One switch per effect. With belt_stretch off the machine falls back to the rigid reference model,
# in which belt damping, slack, backlash, gear stiffness and the frame mode have no meaning.
[effects]
gravity = true
payload = true
belt_stretch = true
belt_damping = true
belt_slack = true
belt_mass = true
belt_tooth_stiffness = false
belt_material_damping = false
guide_friction = true
load_dependent_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
torque_ripple = true
tooth_meshing = true
cable_chain = false
process_force = false
hard_stops = true
holding_brake = true
temperature = false
velocity_feedforward = true
torque_feedforward = true
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here (14 November 2026): field weakening of the d-q motor model (motor.pole_pairs, d_inductance_h), the drive's
# overload over time by its thermal image (ratings.drive_base_load_current_a, drive_overload_time_constant_s,
# drive_max_current_time_s) and the motor's three thermal nodes (motor.winding_resistance_share, winding_time_constant_s).
field_weakening = false
drive_overload = false
motor_thermal_nodes = false
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
# Gearboxes and guides warm with their losses (see [thermal]). Only computed and shown, unless thermal_feedback is on.
part_heating = false
# Guide friction and gearbox losses follow the temperatures part_heating computes, the belt's stiffness the ambient
# temperature (see [thermal_feedback]). Replaces effects.temperature: its hand-set factors are not used while this is
# on. Without part_heating the parts stay at ambient. Off by default, so that earlier results stay as they were.
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point, not from cold. Nothing to do where nothing
# warms back on the run.
thermal_warm_start = true
# The belt's teeth jump over a driven pulley when the effective pull there exceeds what the slack side's tension holds
# in mesh (see belt.tooth_jump_factor); elastic model only. Off by default, so that earlier results stay as they were.
belt_tooth_jump = false
# The first sideways mode of each free belt span, a string at its live tension, against the frequencies the drive
# excites (tooth mesh, torque ripple, cogging); judged at steady speed against ratings.belt_span_resonance_band.
# Signals and a check only, nothing acts back on the motion. Off by default.
belt_span_vibration = false
torque_saturation = true
drive_delay = true
# The DC link voltage rises with what the motors feed back; a chopper and a braking resistor hold it down.
# Its values in [ratings] are placeholders for this drive's DC link voltage. A motor named in [parts] brings
# the DC link voltage of its supply, and the braking threshold and the trip level are scaled along with it.
# Switched off, the voltage stays at drive.bus_voltage_v and the braking checks are estimates.
dc_link = true
# With dc_link: the drives of the machine share one DC link (one Line Module, as on a SINAMICS S120). What a
# braking motor feeds back, a motoring one draws. The link has the capacitance of all drives together, one
# chopper with one braking resistor of the [ratings] powers, and one trip.
shared_dc_link = false
# With dc_link: a regenerative supply (an Active Line Module, as on a SINAMICS S120) holds the DC link at the bus
# level from above too and feeds what the motors give back into the mains, up to its maximum power, instead of
# the braking resistor. Its values are in [ratings]. Off by default, so that earlier results stay as they were.
regenerative_supply = false
# The motor setpoints reach the drives some profile cycles late.
fieldbus_delay = false
# Each frame of motor setpoints takes up to profile.fieldbus_jitter_cycles more than the delay, pseudo-random from
# drive.noise_seed (every run the same); a late frame leaves the drives the one before. Off by default, so that
# earlier results stay as they were.
fieldbus_jitter = false
# Noise on the measured position and current.
sensor_noise = false
# With input_shaping: the shaper is set to the resonance the machine reports for the planned pose.
shaper_follows_pose = false
# Obstacles are rigid: a part moving into one stops dead there, drives on or off, and drives that were on go off
# (see docs/model-reference.md). Off by default; without obstacles it changes nothing.
crash = false

[geometry]
pulley_radius_m = 0.02
stroke_x_m = 3.0
stroke_y_m = 0.5

[mass]
# The X carriage (the gantry's bridge, with the pinion's motor and gearbox on it) and the Y carriage on it, which
# carries the payload.
carriage_kg = 12.0
y_carriage_kg = 4.0
payload_kg = 1.0

[belt]
stiffness_ea_n = 5.0e5
pretension_n = 300.0
damping_n_s_m = 100.0
mass_kg_m = 0.1
tooth_pitch_m = 0.005
tooth_force_n = 2.0
# With effects.belt_tooth_stiffness: the teeth in mesh on a driven pulley give way, in series with the belt.
tooth_mesh_stiffness_n_m = 5.0e6
# With effects.belt_material_damping: a section damps with its stiffness times this time (so a short
# section damps more), instead of with damping_n_s_m whatever its length.
damping_time_s = 2.5e-4
# With effects.belt_tooth_jump: the teeth climb out of a driven pulley's grooves when the effective pull there exceeds
# this times the teeth in mesh (ratings.belt_teeth_in_mesh) times pitch / pulley radius times the slack side's tension:
# each tooth in mesh is held in its groove by the tension's radial pull over one pitch and pushed out by its share of
# the pull times the tangent of an effective flank angle; this is 1 / that tangent (flank, friction and the tooth's
# give together). Estimate: 2.4 makes a pulley drive with 10 of 25 teeth in mesh (both sides at the pretension P
# plus and minus half the pull) jump at an effective pull of 1.5 P, between the belt makers' rule of a pretension at
# least the effective pull (which keeps the slack side at P / 2) and the slack side going slack at 2 P.
tooth_jump_factor = 2.4

[friction_x]
coulomb_n = 15.0
stiction_n = 20.0
viscous_n_s_m = 20.0
stribeck_m_s = 0.01
bristle_stiffness_n_m = 5.0e5
bristle_damping_n_s_m = 1500.0
preload_n = 200.0

# The Y guide (placeholders).
[friction_y]
coulomb_n = 10.0
stiction_n = 14.0
viscous_n_s_m = 15.0
stribeck_m_s = 0.01
bristle_stiffness_n_m = 5.0e5
bristle_damping_n_s_m = 1500.0
preload_n = 200.0

[motor]
rotor_inertia_kgm2 = 0.3e-4
friction_coulomb_nm = 0.02
friction_viscous_nm_s_rad = 1.0e-4
friction_smoothing_rad_s = 0.5
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.01
cogging_order = 24.0
# Winding, as seen by the current controller. The back-EMF constant equals the torque constant.
torque_constant_nm_a = 0.45
resistance_ohm = 4.0
inductance_h = 0.010
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.01
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# With effects.winding_heating: the winding warms with its copper loss and its resistance rises with it. At
# the rated current it settles at the rated temperature rise. Here the rated torque over the torque
# constant; a catalogue's own rated current can be some percent higher.
rated_current_a = 2.822
thermal_time_constant_s = 1800.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
# With effects.torque_saturation: at high current the iron saturates and a motor gives less torque per
# ampere. The torque constant falls with the square of the current to this value at the maximum current.
max_current_a = 9.5
torque_constant_at_max_current_nm_a = 0.40
# With effects.holding_brake: while the drives are disabled, a brake holds each motor shaft up to this
# torque and slips with it beyond.
brake_torque_nm = 1.0

[gearbox]
ratio = 5.0
efficiency = 0.95
backlash_rad = 8.7e-4
stiffness_nm_rad = 1.0e4
damping_nm_s_rad = 0.2
# The gearbox's own inertia at its input, which turns with the rotor. A gearbox named in [parts] brings it.
inertia_at_input_kgm2 = 0.0

# The X motor's gearbox: ratio 10, so that the long axis's carriage seen at the motor (12 + 4 + 1 kg through the
# pinion's 31.8 mm over 10: 1.7e-4 kg m2) is about what the portal's belt X has (2.2e-4). Stiffness and damping are
# the joint kit's rack axis's planetary gearbox (as the delta picker's NRB080 at ratio 20): with the belt motors' small
# gearbox at its upper bound (1.3e4 N m/rad) the X axis rang (settling 1.2 mm, 4863 N on the rack). Placeholders.
[gearbox.mx]
ratio = 10.0
stiffness_nm_rad = 35752.6
damping_nm_s_rad = 5.0

# The X axis's rack and pinion (transmission::RackPinion, laid out as [rack] of the joint kit's rack axis): module 2,
# 30 teeth, 19.5283 degrees helix, 200 mm per turn, on a ground rack, backlash-free (a preloaded dual pinion). The joint
# kit's rack axis's placeholders.
[rack_x]
module_m = 0.002
teeth = 30.0
helix_angle_deg = 19.5283
efficiency = 0.97
# Mesh and the rack's mounting, along the travel.
stiffness_n_m = 1.0e8
backlash_m = 0.0
pinion_inertia_kgm2 = 1.0e-4
# The pair's permissible feed force, and the application factor K_A for smooth running.
rated_feed_force_n = 3000.0
service_factor = 1.25

[pulley]
inertia_kgm2 = 1.0e-4

# With effects.cable_chain: the chain is fixed at the x = 0 end, so half of every metre the carriage
# travels joins the run that moves with it. It drags with a constant force.
[cable_chain]
mass_kg_m = 0.5
length_at_zero_m = 0.3
drag_n = 3.0

# With effects.process_force: a force on the tool while the cycle dwells, e.g. the reaction to pressing a part in.
[process]
force_x_n = 0.0
force_y_n = 0.0

# With effects.hard_stops: a spring and damper at both ends of each stroke that act only beyond it.
[hard_stop]
stiffness_n_m = 1.0e6
damping_n_s_m = 5.0e3

# Applied only with effects.temperature on: a cold machine has more friction and a stiffer belt.
[temperature]
friction_scale = 1.5
belt_stiffness_scale = 1.1

# With effects.part_heating: each gearbox and guide is one thermal mass that warms with its loss power (the signals
# power.gearbox_*, power.guide_*) through a thermal resistance to the air: its rise settles at resistance times the
# mean loss, with the time constant. The rated rises are the limits the 3D view colours up to. Friction and efficiency
# follow them only with effects.thermal_feedback (see [thermal_feedback]). Estimates for a size 60 to 70 planetary
# gearbox and a size 15 ball guide.
# The guide's heat goes into its rail and the aluminium profile the rail is bolted to, over the whole stroke: about
# 0.35 m2 of profile at 10 W/(m2 K) (still air and radiation) with a fin efficiency of about 0.6 gives 0.5 K/W, and
# about 5 kg of aluminium and steel (5 kJ/K) gives 40 minutes. The carriage alone would give 2 K/W, which put the
# guides of two of the three shipped configs above their rated rise (see docs/config-reference.md).
[thermal]
gearbox_resistance_k_w = 1.5
gearbox_time_constant_s = 1200.0
gearbox_max_rise_k = 50.0
guide_resistance_k_w = 0.5
guide_time_constant_s = 2400.0
guide_max_rise_k = 40.0

# With effects.thermal_feedback (see mech::ThermalFeedback): the config's friction, efficiency and belt stiffness hold
# at the reference temperature, 20 °C as gearbox makers quote their no-load torque; the machine stands at the ambient
# temperature, and each gearbox and guide is warmer by its rise. A lubricant's viscosity follows
# exp(B (1/T - 1/T_ref)): B from a mineral oil's viscosities at 40 and 100 °C, 3470 K for ISO VG 32 to 4730 K for
# VG 220, 4000 K for VG 68. The guide's viscous friction follows the viscosity (its Coulomb and stiction levels stay),
# and so does the share of the gearbox's loss that is churning and bearing drag (an estimate; the rest is tooth
# friction). The belt's EA falls by the coefficient per kelvin above the reference: the polyurethane softens, but the
# steel cords carry the load (an estimate; steel's own modulus falls by about 2.5e-4 per K).
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
belt_stiffness_coefficient_1_k = 3.0e-4

[axis.x]
max_velocity_m_s = 0.8
max_acceleration_m_s2 = 8.0
max_jerk_m_s3 = 100.0

[axis.y]
max_velocity_m_s = 0.6
max_acceleration_m_s2 = 6.0
max_jerk_m_s3 = 100.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
# With effects.drive_delay: a drive computes during one cycle what acts in the next. Whole cycles of
# the current loop for the voltage, of the velocity loop for the torque setpoint.
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# Velocity loop gain, tuned with `sim-cli margins t-gantry --bands` (the open-loop response of each motor's velocity
# loop, with every [bounds] value at its low and at its high bound) for a phase margin of at least 35 degrees and a
# gain margin of at least 6 dB in every run, also with effects.motor_friction and guide_friction off (in a cruise
# friction adds no damping to the loop). Found: at least 47.4 degrees and 8.2 dB (config as it is: 54 degrees,
# 9.0 dB); friction off at least 39.1 degrees and 7.3 dB. 0.08 left 12 degrees and 2 dB: motor B hunted in the
# gearbox backlash at a cruise.
velocity_kp_nm_s_rad = 0.04
velocity_tn_s = 0.01
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
# Current controller: Kp = L / T and Tn = L / R give the current loop the time constant T = 0.25 ms.
current_kp_v_a = 40.0
current_tn_s = 2.5e-3
# The DC link voltage. The winding gets sqrt(3/2) times it at most, here 190 V: the model's one winding
# carries the RMS phase current, and its voltage times that current is the power of all three phases.
bus_voltage_v = 155.13
peak_torque_nm = 3.8
# What the motor can give continuously; the RMS torque of a cycle is judged against it.
rated_torque_nm = 1.27
# Full torque up to the rated speed, falling to zero at the no-load speed (voltage limit).
rated_speed_rad_s = 314.0
no_load_speed_rad_s = 420.0
encoder_counts_per_rev = 1048576.0
velocity_filter_s = 0.2e-3
torque_filter_s = 0.2e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
# With effects.sensor_noise: standard deviation of the noise on the measured position, in encoder counts,
# and on the measured current. Pseudo-random from the seed, so every run is the same; each motor has a stream of its own.
encoder_noise_counts = 1.0
current_noise_a = 0.01
# The seed also draws the fieldbus jitter (effects.fieldbus_jitter), from a stream of its own.
noise_seed = 1
# The axes brake through one braking resistor for all, an S120 line-up's Braking Module: verdicts judges the
# sum of their braking power against ratings.braking_resistor_continuous_w and _peak_w. Off: each axis has a
# resistor of its own (an S210). A drive by name sets it.
braking_module = false

# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged.
[ratings]
# Placeholder for a belt of this size.
belt_max_tension_n = 1500.0
# Below this the teeth can jump.
belt_min_tension_n = 0.0
# How far the tool may be from its target in the second half of a dwell, when the gripper acts.
settling_tolerance_m = 0.0001
# As the Siemens NRB060 with ratio 5 in catalog/siemens/gearbox_nrb.csv.
gearbox_rated_torque_nm = 40.0
gearbox_max_torque_nm = 64.0
# Placeholders for a drive of this size: the DC link capacitors take braking energy until the voltage
# reaches the threshold, beyond that the braking resistor has to. The threshold has to lie above
# drive.bus_voltage_v; between the two the capacitors here hold 6.2 J.
dc_link_capacitance_uf = 470.0
braking_threshold_v = 224.65
braking_resistor_continuous_w = 20.0
braking_resistor_peak_w = 500.0
# With effects.dc_link the four values above are also what the simulated DC link is built from, and the
# drive trips when the voltage passes this one.
dc_link_overvoltage_v = 257.6
# With effects.dc_link: a disabled drive's DC link discharges through its bleeder and the drive's own consumption
# with this time constant, down to the bus level the rectifier holds. An estimate: Siemens asks to wait 5 minutes
# after switching off for the DC link to discharge, taken as 600 V falling to 60 V, 300 s / ln 10.
dc_link_discharge_time_constant_s = 130.0
# With effects.regenerative_supply: the line module that feeds back, the smallest SINAMICS S120 Active Line Module
# 6SL3130-7TE21-6AA4 of catalog/siemens/line_modules_s120.csv (rated 16 kW, 35 kW maximum). Its efficiency is an
# estimate from the catalogue's 0.28 kW loss at rated power; at the small powers of this machine it is a guess.
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
# Placeholders: neither is in the catalogue's gearbox files. Highest speed at the gearbox input, and the
# radial load its output shaft takes from the belt.
gearbox_max_input_speed_rpm = 13000.0
shaft_max_radial_load_n = 1500.0
# Placeholders for a ball guide of this size: the highest load, and the dynamic load rating C of the
# life estimate L10 = (C / P)^3 * 50 km.
guide_max_load_n = 2000.0
guide_dynamic_load_rating_n = 5000.0
# The life the parts are to last, against which the lives below are judged: 20000 h, the life Siemens rates its
# planetary gearboxes' planet bearings for.
required_life_h = 20000.0
# Reliability of the two bearing lives (pulley shaft, gearbox planets), %: the life factor a1 of ISO 281 turns their
# L10, which 90 % of bearings reach, into the life this share reaches (0.64 at 95 %, 0.25 at 99 %). 90 to 99.95.
bearing_reliability_percent = 90.0
# Dynamic load rating C of the bearing that takes the belt's pull on a pulley shaft (here the gearbox output),
# for its rating life (C / P)^3 * 10^6 / (60 n) h. Placeholder: the output bearing of a Siemens NRB120, whose
# 1500 N of average radial force for 30000 h at 100 r/min in the middle of the shaft (Table 7-14 of the
# configuration manual "Planetary gearboxes for S-1FK2 and S-1FT2 servomotors", 01/2023) give
# C = 1500 N * (30000 * 60 * 100 / 10^6)^(1/3) = 8469 N. The NRB060 whose torques are taken above allows 340 N
# there (C = 1920 N), the NRB080 650 N (C = 3670 N): less than the 600 N the belt's pretension alone puts on
# the shaft; on this cycle they would last about 2500 h and 17000 h.
pulley_bearing_load_rating_n = 8469.0
# The output speed at which the planet bearings last 20000 h at the rated torque, for the gearbox life
# 20000 h * (n2B / n2) * (M2N / M2eq)^(10/3): 175 r/min for the NRB060 with ratio 5 (Table 7-15 of the manual).
# A gearbox named in [parts] does not set it.
gearbox_reference_speed_rpm = 175.0
# The belt's teeth, by Megadyne's MEGALINEAR handbook (02.2026, page 9): the effective pull at a pulley times a
# service factor against the specific tooth load the teeth allow at the pulley's speed, times the width and the
# teeth in mesh. Placeholders for a 25 mm AT5 steel-cord belt: the handbook's table for open-ended AT5 (page 52,
# N/cm per tooth at the pulley's r/min), the factor for low shock loads (1.4, its Table 4), and 10 of the
# pulley's 25 teeth in mesh (an estimate; the handbook counts at most 12).
belt_tooth_load_rpm = [0.0, 20.0, 40.0, 60.0, 80.0, 100.0, 200.0, 300.0, 400.0, 500.0, 750.0, 1000.0, 1500.0, 2000.0, 3000.0, 4000.0, 5000.0, 8000.0]
belt_tooth_load_n_cm = [35.0, 35.0, 35.0, 34.0, 34.0, 34.0, 32.0, 31.0, 30.0, 29.0, 27.0, 26.0, 24.0, 22.0, 19.0, 18.0, 16.0, 13.0]
belt_width_mm = 25.0
belt_service_factor = 1.4
belt_teeth_in_mesh = 10.0
# With effects.belt_span_vibration: how close a span's first sideways mode may come to what the drive excites, as a
# share of the mode, at steady speed. An estimate: belt makers ask to keep the two apart without a figure; 10 % is the
# separation usually kept from a resonance.
belt_span_resonance_band = 0.1
# The drive's rated and maximum output current, against which the cycle's RMS and peak motor current are judged
# (checks drive-current and drive-peak-current). A drive named in [parts] sets them. Placeholders here: the values
# of the S210 converter 6SL3210-5HE11-0UF0 (3 A, 10.9 A), which carries this placeholder motor's rated (2.8 A) and
# maximum current (9.5 A).
drive_rated_current_a = 3.0
drive_max_current_a = 10.9
# With effects.drive_overload [estimate]: the base load current the drive falls back to when its thermal image trips
# (0.85 of the rated current, as the S120 Motor Modules up to 30 A have it; a drive by name sets it), the time constant
# of the image, and how long the drive gives its maximum current from the rated load.
drive_base_load_current_a = 2.55
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25

[profile]
cycle_s = 1.0e-3
# With effects.fieldbus_delay: whole profile cycles between the controller computing the motor setpoints
# (position, speed, torque feedforward) and the drives using them.
fieldbus_delay_cycles = 1
# With effects.fieldbus_jitter: the most whole profile cycles a frame can take beyond the delay, evenly from 0 to it.
fieldbus_jitter_cycles = 1
# Setpoints from the PLC are interpolated over this interval.
setpoint_interval_s = 10.0e-3
# With effects.corner_blending on: how long before the end of a cycle segment the next one may
# start. Applies where the machine need not stop: no dwell, no gripper action, no axis reversing.
blend_time_s = 0.15
# With effects.input_shaping: every setpoint is spread over three steps half a vibration period apart,
# so that the swings they start cancel. Tuned to one resonance; each move takes one period longer.
shaper_frequency_hz = 25.0
shaper_damping = 0.03
# With effects.input_shaping: a second ZVD shaper, convolved with the first, for a second resonance (nine copies of
# the plan; each move takes the periods of both longer). 0: none.
shaper2_frequency_hz = 0.0
shaper2_damping = 0.03
# The shape of moves (see docs/config-reference.md): "s-curve" (seven segments), "sin2" (Bestehorn), "poly345" or
# "poly4567" (VDI 2143); a [[cycle.segment]] may name its own with shape = "...". Braking within deceleration_ratio of
# the acceleration limits (1: as fast as speeding up). vertical_axis: the axis that lifts against gravity ("z", "-z"
# where up is its minus direction, "" for none), which has up_acceleration_ratio of its acceleration limit upwards.
shape = "s-curve"
deceleration_ratio = 1.0
vertical_axis = ""
up_acceleration_ratio = 1.0
# The curve a trajectory runs through its poses: "c2" (a cubic spline, the acceleration continuous) or "hermite" (the
# slopes of the neighbours, as before 14 November 2026).
trajectory_spline = "c2"
# With effects.input_shaping: the shaper ("zv", "zvd", "zvdd", "ei", "ei2" the two-hump EI), the vibration the EI
# shapers allow, the axes the first and the second shaper act on ([] for all), and further modes, each convolved:
# { frequency_hz = 40.0, damping = 0.02, type = "ei", axes = ["z"] } (type and axes may be left out).
shaper_type = "zvd"
shaper_ei_tolerance = 0.05
shaper_axes = []
shaper_modes = []
# For a path timed as fast as the motors allow: the share of the torque-speed curve the plan may use (the
# rest is for friction and elasticity, which the plan leaves out).
torque_reserve = 0.8
# For a path timed as fast as the motors allow: the share of the room between the tension that holds the tool and the
# belt's tension ratings (less tension_margin_n) that the plan's rigid model may use. 0.5, because the belt's vibration
# adds up to as much again: a change of acceleration that is quick against the belt's period (a ramp shorter than about
# a third of it) makes a lightly damped belt overshoot by up to the change itself.
tension_reserve = 0.5
# For a path timed as fast as the motors allow: taken off both tension ratings before the share above, for what the
# rigid model leaves out whatever the room: the guides' friction, which the loss-free rigid model does not carry:
# the x guide's 15 N coulomb plus 20 N s/m at the axis' 0.8 m/s.
tension_margin_n = 31.0
# For a path of lines and arcs: how far the planned path may leave them, so that transition curves
# (clothoids) can take it from a line into an arc at speed. 0: the path as given, and a crawl into every arc.
path_tolerance_m = 0.0
# For `sim-cli optimise`: how far the tool has to stay beyond the farther of pick and place while it traverses
# between them (an obstacle there). The optimiser lowers each lift, traverse and lower of the cycle to this and
# rounds its corners only where the path keeps it. The lift as configured: 0.3 m above pick and place. Placeholder: no obstacle is known.
min_clearance_m = 0.3

# Low and high bound of the values that are estimates, in the tables and units they have above.
# `sim-cli verdicts --bands` runs the cycle with each at its low and at its high bound, one at a time,
# and `sim-cli sensitivity` uses the bounds in place of its flat percentage.
# Not bounded: the masses, inertias and the backlash (datasheet-type values), the values of effects that
# are off by default, and the shape of the friction curve (Stribeck speed, bristles, preload). Bounded but
# without runs while they change nothing: [thermal] and the line module's efficiency with their effects off, and
# the DC link's discharge, which acts only while the drives are disabled.
[bounds]
motor.pole_pairs = [3.0, 5.0]
motor.d_inductance_h = [0.008, 0.012]
motor.winding_resistance_share = [0.2, 0.5]
motor.winding_time_constant_s = [20.0, 120.0]
ratings.drive_base_load_current_a = [2.4, 2.7]
ratings.drive_overload_time_constant_s = [2.0, 60.0]
ratings.drive_max_current_time_s = [0.1, 1.0]
belt.stiffness_ea_n = [4.0e5, 6.0e5]
belt.pretension_n = [200.0, 400.0]
belt.damping_n_s_m = [50.0, 200.0]
belt.tooth_force_n = [1.0, 4.0]
belt.tooth_jump_factor = [1.2, 4.8]
friction_x.coulomb_n = [10.0, 20.0]
friction_x.stiction_n = [15.0, 30.0]
friction_x.viscous_n_s_m = [10.0, 40.0]
friction_y.coulomb_n = [7.0, 14.0]
friction_y.stiction_n = [10.0, 21.0]
friction_y.viscous_n_s_m = [7.5, 30.0]
motor.friction_coulomb_nm = [0.01, 0.04]
motor.friction_viscous_nm_s_rad = [0.5e-4, 2.0e-4]
motor.ripple_fraction = [0.01, 0.04]
motor.cogging_nm = [0.005, 0.02]
gearbox.efficiency = [0.90, 0.97]
gearbox.stiffness_nm_rad = [0.7e4, 1.3e4]
gearbox.damping_nm_s_rad = [0.1, 0.4]
thermal.gearbox_resistance_k_w = [0.8, 3.0]
thermal.gearbox_time_constant_s = [600.0, 2400.0]
thermal.guide_resistance_k_w = [0.25, 1.0]
thermal.guide_time_constant_s = [1200.0, 4800.0]
ratings.dc_link_discharge_time_constant_s = [30.0, 300.0]
ratings.line_module_efficiency = [0.95, 0.99]
ratings.belt_teeth_in_mesh = [6.0, 12.0]
thermal_feedback.ambient_c = [10.0, 40.0]
thermal_feedback.viscosity_slope_k = [3470.0, 4730.0]
thermal_feedback.gearbox_viscous_loss_share = [0.25, 0.75]
thermal_feedback.belt_stiffness_coefficient_1_k = [0.0, 1.0e-3]
rack_x.efficiency = [0.95, 0.98]
rack_x.stiffness_n_m = [6.0e7, 1.5e8]
gearbox.mx.stiffness_nm_rad = [25000.0, 40000.0]
gearbox.mx.damping_nm_s_rad = [2.0, 10.0]

[start]
pose = [0.2, 0.1]

# Pick and place over the long axis: grip at one end, place at the other, and back.
# "payload" is the state of the gripper once the segment has arrived.
[[cycle.segment]]
target = [2.8, 0.4]
dwell_s = 0.1
payload = false

[[cycle.segment]]
target = [0.2, 0.1]
dwell_s = 0.1
payload = true

# The machine as a netlist: two axes, two motors, a rack and pinion on X and a belt of two sections on Y.
[machine]
version = 1
id = "rack-gantry"
name = "Rack gantry (machine file)"

[[machine.axis]]
id = "x"
stroke_m = "geometry.stroke_x_m"
pos = [600, 0]

[[machine.axis]]
id = "y"
stroke_m = "geometry.stroke_y_m"
pos = [600, 300]

[[machine.motor]]
id = "mx"
pos = [0, 0]

[[machine.motor]]
id = "my"
pos = [0, 300]

[[machine.gearbox]]
id = "gearbox_x"
motor = "mx"
pos = [150, 0]

[[machine.gearbox]]
id = "gearbox_y"
motor = "my"
pos = [150, 300]

# X: the pinion on the X gearbox drives the bridge along the rack.
[[machine.rack]]
id = "rack_x"
gearbox = "gearbox_x"
axis = "x"
values = "rack_x"
pos = [300, 0]

[[machine.pulley]]
id = "pulley_y"
gearbox = "gearbox_y"
radius_m = "geometry.pulley_radius_m"
inertia_kgm2 = "pulley.inertia_kgm2"
at_m = [1.5, -0.1, 0.06]
pos = [300, 300]

# Y, on the bridge: clamp to motor (0.1 m + y) and motor round the far idler back to the clamp (0.7 m - y).
[[machine.section]]
id = "y1"
length_m = 0.1
axes = { y = 1 }
pulleys = { pulley_y = 1 }
route = ["y_carriage", "pulley_y"]
pos = [450, 240]

[[machine.section]]
id = "y2"
length_m = 0.7
axes = { y = -1 }
pulleys = { pulley_y = -1 }
route = ["pulley_y", "y_carriage"]
pos = [450, 360]

[[machine.body]]
id = "bridge"
mass_kg = "mass.carriage_kg"
axes = ["x"]
pos = [750, 0]

[[machine.body]]
id = "y_carriage"
mass_kg = "mass.y_carriage_kg"
payload_kg = "mass.payload_kg"
axes = ["x", "y"]
pos = [750, 300]

# Both lie flat and carry the weight of what rides on them.
[[machine.guide]]
id = "guide_x"
axis = "x"
friction = "friction_x"
carries = ["bridge", "y_carriage"]
pos = [900, 0]

[[machine.guide]]
id = "guide_y"
axis = "y"
friction = "friction_y"
carries = ["y_carriage"]
pos = [900, 300]
