# The spatial delta of crates/machine-delta-d3 as a machine file: the same values, with the machine wired up in
# [machine] at the end instead of in Rust (a linkage node with three arms, see docs/machine-files.md). Crate and file
# build one implementation (sim-netlist's spatial.rs); crates/sim-machines/tests/machine_file_linkage.rs checks the
# file against the crate, with every effect the crate has.
#
# Delta picker D3: three rotary arms on a base, three parallelograms of forearms down to a platform that stays level
# (Clavel's delta). Sized like the Autonox DELTA RL3-1200-3kg (A_00035-02): working range 1200 mm across, 200 mm high at
# its edge and 386 mm at its centre, 3 kg payload, with the Siemens 1FK2105-4AF Autonox recommends for it.
# Every value says where it comes from:
#   [catalogue]  read from a maker's document: the Autonox Finder product page and connecting dimensions of the
#                RL3-1200-3kg, Siemens catalogue D 32 and the planetary gearbox manual (catalog/siemens/*.csv).
#   [estimate]   ours. Autonox keeps arm lengths, masses and inertias behind a registration this project does not
#                have; the geometry is scaled from Williams' estimate of an ABB IRB 360 (Ohio University, 2016) to the
#                Autonox working range, and checked to reach all of it with condition numbers below 3.6.
# Units are in the field names. The frame: origin at the centre of the shoulder axes' plane, z up, so the platform
# works below zero; arm 1 points along +x, arms 2 and 3 at 120 and 240 degrees.
format_version = 1
# Obstacles in the work area, boxes along the axes of the 3D view (see docs/config-reference.md), e.g.
# obstacles = [{ name = "fixture", centre_m = [0.0, 0.0, -0.95], size_m = [0.1, 0.1, 0.1] }]
# (between pick and place, 50 mm below the payload as it passes: `collision` passes at profile.min_clearance_m 0.025)
# or as [[obstacles]] tables at the end of the file. None by default.
obstacles = []

[sim]
dt_s = 62.5e-6
substeps = 4

# Parts by name from the catalogue in catalog/, as for every machine (see docs/config-reference.md). Named here, they
# would replace the numbers below when the config is loaded; the numbers below are those parts' own, written out
# (motor 1FK2105-4AF at 400 V, gearbox NRB080-05-20, converter 6SL3210-5HE11-5UF0), so that the config reads as it
# runs. "" names none.
[parts]
motor = ""
motor_supply = "400v"
gearbox = ""
drive = ""
belt = ""
axis = ""

# One switch per effect.
# Motor options: the holding brake (its inertia and weight) and the encoder ("" keeps drive.encoder_counts_per_rev;
# "AS22DQC", "AM22DQC", for a 1FT2 also the 26-bit "AS26DQC", "AM26DQC").
motor_brake = false
motor_encoder = ""
[effects]
gravity = true
payload = true
# The gearboxes twist under load (stiffness, damping, backlash): motor and arm are two bodies per joint. Off, the
# machine is the rigid reference model, in which the motor turns with the arm times the ratio and backlash, gearbox
# stiffness and damping have no meaning.
joint_elasticity = true
# Each forearm pair a rigid rod with its mass and rotational inertia (a sixth of its mass at each end, two thirds at its
# middle: exact for a slender rod), and the rods' spin about their own axes as the pair's plane turns
# (mass.forearm_rod_spin_inertia_kgm2). Off: the lumped model of Codourey and Olsson, mass.forearm_elbow_share at the
# elbow and the rest at the platform, the rods' rotational inertia left out. On in the shipped config.
forearm_inertia = true
# The upper arms bend (springs and dampers, [upper_arm]): in the plane they turn in, the elbow turns against the arm's
# root; out of it, the elbow moves along its axis. The platform rings after a move. Off in the shipped config: the
# stiffnesses are estimates.
link_elasticity = false
# Friction in the arms' bearings at the base (Coulomb and viscous, [joint]).
joint_friction = true
motor_friction = true
gearbox_backlash = true
gearbox_efficiency = true
torque_ripple = true
# Stops at both ends of each arm's angle range ([joint]).
hard_stops = true
holding_brake = true
velocity_feedforward = true
torque_feedforward = true
encoder_resolution = true
velocity_filter = true
torque_filter = true
notch_filter = false
torque_limit = true
# The drive gives no more than its maximum output current, ratings.drive_max_current_a: the torque setpoint is held to
# the torque of that current where it is below the motor's limit. Without the rating nothing is held.
drive_current_limit = true
# Off here (14 November 2026): field weakening of the d-q motor model (motor.pole_pairs, d_inductance_h), the drive's
# overload over time by its thermal image (ratings.drive_base_load_current_a, drive_overload_time_constant_s,
# drive_max_current_time_s) and the motor's three thermal nodes (motor.winding_resistance_share, winding_time_constant_s).
field_weakening = true
drive_overload = false
motor_thermal_nodes = false
corner_blending = false
input_shaping = false
back_emf = true
voltage_limit = true
winding_heating = true
part_heating = false
thermal_feedback = false
# The cycle analysis measures its pass with the windings (winding_heating) and, with thermal_feedback, the parts at the
# rises they settle at on the cycle, iterated from cold to a fixed point, not from cold. Nothing to do where nothing
# warms back on the run.
thermal_warm_start = true
torque_saturation = true
drive_delay = true
dc_link = true
shared_dc_link = false
regenerative_supply = false
fieldbus_delay = false
fieldbus_jitter = false
sensor_noise = false
shaper_follows_pose = false
# Obstacles are rigid: a part moving into one stops dead there, drives on or off, and drives that were on go off
# (see docs/model-reference.md). Off by default; without obstacles it changes nothing.
crash = false

# The kinematics. e = base_radius_m - platform_radius_m is what the equations use.
# [estimate] Williams' IRB 360-1/1600 figures (R 164, r 44, upper arm 524, forearm 1244 mm, for a working radius of
# 720 mm), scaled towards this working radius of 600 mm and rounded; with these the whole working range is reachable,
# the arm angles stay between -44 and +80 degrees and the condition number of the Jacobian below 3.6.
# With link_elasticity: the arm tube's own share of the bending modes (a quarter of its mass in each, as a
# cantilever's first mode) and the elbow block's twist as an arm bends out of its plane. Off as shipped, with
# link_elasticity.
arm_tube_inertia = false
# The frame or stand under the machine gives way on springs ([base]): it sways under the motors' reactions and the
# moving masses and takes the tool with it. Off in the shipped configs: the stiffnesses are [estimate]s.
base_compliance = false
braking_resistor_heating = true
# The drive runs the position setpoint on between profile cycles from the last setpoints (pos + v t + a t^2 / 2),
# as its speed feedforward runs on: a SINAMICS drive's fine interpolation, which a position loop at the speed loop's
# cycle (DSC) needs once the profile cycle is longer than the position cycle. Changes nothing while they are equal.
fine_interpolation = true
# Friction feedforward from the characteristic drive.friction_feedforward_* (S120 p3820-p3839). Off: no shipped
# config has a recorded characteristic.
friction_feedforward = false
# The gearbox's no-load running torque at its input, over speed and its lubricant's temperature (gearbox.no_load_*):
# gearbox.efficiency then holds at gearbox.efficiency_torque_nm and falls at part load. On here: the sizing of this
# delta was redone with them (14 November 2026).
gearbox_drag = true
# The gearbox's flanks take the load over a band beyond the backlash, with a hysteresis (gearbox.lost_motion_band_rad,
# hysteresis_rad).
gearbox_lost_motion = true
# A strain wave gear's three-segment stiffness, K1 to T1, K2 to T2, K3 beyond (gearbox.stiffness_*). Off in the shipped
# configs.
gearbox_stiffness_curve = false
# Motor electrical and thermal model (14 November 2026). On here: field weakening above (the d-q voltage limit), the
# stator's iron loss heating the motor (motor.stall_current_a) and the braking resistor's temperature
# (ratings.braking_resistor_time_constant_s, braking_resistor_rated_rise_k; with dc_link only). Off: the magnets' flux
# over temperature (motor.magnet_temperature_coefficient_1_k).
iron_loss = true
# The position loop closes on a load-side scale (S120 direct measuring system, drive.load_encoder_step) instead of
# the motor encoder, which stays for the speed loop.
load_encoder = false
magnet_temperature = false
# The motor shaft's seals and bearings break away above their sliding level along a Stribeck curve
# (motor.friction_breakaway_nm, friction_stribeck_rad_s).
motor_stiction = true
# The drives watch their following error, their standstill and their torque limit ([drive] fault_reaction and the
# keys after it); one that trips stops all, each by its fault reaction. Off by default, so that earlier results
# stay as they were.
drive_monitoring = false
[geometry]
base_radius_m = 0.2
platform_radius_m = 0.05
upper_arm_m = 0.4
forearm_m = 0.95
# Distance between the two rods of a forearm pair, for the 3D view only.
forearm_spacing_m = 0.1

# The working range: a cylinder with a spherical bottom, as Autonox draws it.
# [catalogue] Autonox RL3-1200-3kg: 1200 mm across, 200 mm high at the edge, about 386 mm at the centre; the drawing's
# R1060.74 is the bottom sphere, (600^2 + 186^2) / (2 * 186) = 1060.7 mm.
# [estimate] its top 675 mm below the shoulder plane: the bottom sphere's centre then lies on the shoulder plane.
[workspace]
radius_m = 0.6
top_z_m = -0.675
height_edge_m = 0.2
height_centre_m = 0.386
# Targets where the Jacobian's condition number is above this are refused: near a singularity. Above anything in
# the working range (3.6). The cycle is judged against ratings.max_condition_number.
# [estimate]
max_condition_number = 10.0

# [estimate] all: a carbon tube arm with an aluminium elbow block, carbon rods with ball cups, an aluminium platform
# with the ISO 9409-1-63 flange. Autonox's 32 kg of mechanics are mostly base frame.
[mass]
upper_arm_kg = 0.9
# Centre of mass of the arm's tube from the shoulder axis, and its inertia about the shoulder axis (uniform tube:
# m L^2 / 3 = 0.048 kg m^2), without the elbow block.
upper_arm_cg_m = 0.2
upper_arm_inertia_kgm2 = 0.048
elbow_kg = 0.3
forearm_pair_kg = 0.5
# The share of a forearm pair's mass counted at the elbow (the rest at the platform): 2/3 matches the rod's inertia
# about its end, m L^2 / 3 (Codourey 1998, Olsson 2009). Only with effects.forearm_inertia off (the lumped model).
forearm_elbow_share = 0.6667
# With effects.forearm_inertia: each rod's inertia about its own axis. [estimate] a carbon tube 20 x 1.5 mm of 0.15 kg,
# m (r_o^2 + r_i^2) / 2 = 0.15 (0.01^2 + 0.0085^2) / 2 = 1.29e-5 kg m^2; the ball cups on the axis add little.
forearm_rod_spin_inertia_kgm2 = 1.3e-5
platform_kg = 1.2
# [catalogue] Autonox: rated payload 3 kg
payload_kg = 3.0

# With effects.link_elasticity: each upper arm bends in the plane it turns in, a turn of the elbow against the arm's
# root. [estimate] a carbon tube 50 x 2 mm, E 100 GPa: I = pi (50^4 - 46^4) / 64 mm^4 = 8.70e-8 m^4, and a cantilever's
# tip deflection F L^3 / (3 E I) as a turn about the shoulder: k = 3 E I / L_a = 3 * 8700 / 0.4 = 65250 N m/rad. The
# damping about 2 % of critical at the platform's sideways mode.
# With effects.arm_tube_inertia: the elbow block's inertia about the arm's normal through it, which turns as the arm
# bends out of its plane. [estimate] an aluminium block of 0.3 kg and 0.1 m across: m w^2 / 12 = 2.5e-4 kg m^2.
elbow_twist_inertia_kgm2 = 2.5e-4
[upper_arm]
bending_stiffness_nm_rad = 65000.0
bending_damping_nm_s_rad = 5.0
# Out of the plane the arm turns in, the elbow moves along its axis on the tube's lateral stiffness. [estimate] the
# same tube (round, so EI is the same both ways): a cantilever's tip, 3 E I / L_a^3 = 3 * 8700 / 0.4^3 = 407800 N/m.
# The damping about 2 % of critical with the elbow's share of mass (about 0.47 kg with the rods: 2 * 0.02 *
# sqrt(4e5 * 0.47) = 17 N s/m).
lateral_stiffness_n_m = 400000.0
lateral_damping_n_s_m = 15.0

# Each arm's joint at the base.
[joint]
# [estimate] two angular contact bearings of the arm's shaft, about 1 % of the arm's holding torque.
friction_coulomb_nm = 0.3
friction_viscous_nm_s_rad = 0.05
friction_smoothing_rad_s = 0.01
# The stops. [estimate] beyond the -44 to +80 degrees the working range needs. Autonox draws a maximum upper-arm
# deflection of about 235 (unit and meaning not stated).
min_angle_deg = -55.0
max_angle_deg = 95.0
# [estimate] a rubber buffer.
stop_stiffness_nm_rad = 2.0e4
stop_damping_nm_s_rad = 20.0

[motor]
# [catalogue] 1FK2105-4AF, D 32: rotor 1.7 kg cm2
rotor_inertia_kgm2 = 1.7e-4
# [estimate]
friction_coulomb_nm = 0.05
friction_viscous_nm_s_rad = 2.0e-4
friction_smoothing_rad_s = 0.5
ripple_fraction = 0.02
ripple_order = 24.0
cogging_nm = 0.02
cogging_order = 24.0
# [catalogue] static torque 5 N m over stall current 4.65 A
torque_constant_nm_a = 1.07527
# [estimate] Siemens publishes neither for the 1FK2.
resistance_ohm = 2.0
inductance_h = 0.010
# With effects.field_weakening [estimate]: pole pairs (not published for the 1FK2; the 1FK7 have 4) and the d-axis
# inductance, as the winding has it, here that of the q axis above (surface magnets).
pole_pairs = 4.0
d_inductance_h = 0.01
# With effects.motor_thermal_nodes [estimate]: the winding's share of the thermal resistance to the surroundings (the
# rest is the stator and housing's), and its time constant against the housing.
winding_resistance_share = 0.3
winding_time_constant_s = 60.0
# [catalogue] rated current 4.35 A at 400 V; thermal time constant 37 min (1FK2 configuration manual); 15 N m at the
# maximum current of 18 A. With effects.winding_heating the winding settles at the rated rise at the rated current.
rated_current_a = 4.35
thermal_time_constant_s = 2220.0
rated_temperature_rise_k = 100.0
start_temperature_rise_k = 0.0
max_current_a = 18.0
torque_constant_at_max_current_nm_a = 0.83333
# With effects.holding_brake: while the drives are disabled, a brake holds each motor shaft up to this torque.
# [estimate] Autonox lists the motor with brake (-0MB0) beside the one without; the D 32 gives no brake torque.
brake_torque_nm = 8.0

# The gearbox of each arm. Autonox fits its own "Getriebe Typ 3", whose ratio is behind the registration.
# [catalogue] Siemens NRB080-05-20 (catalog/siemens/gearbox_nrb.csv): ratio 20, 96 % at full load, 10.4 N m/arcmin,
# 9 arcmin backlash, 0.406 kg cm2 at the input. Twist and backlash put the tool off the motors' pose at rest by 0.64 mm
# at pick and place and up to 2.09 mm at the rim's lower edge, and the cycle fails settling against 0.5 mm with it
# (0.68 mm in the dwell): a sizing finding, the NRB080 is too loose for this class of delta (3 arcmin passes with
# 0.33 mm). No limit cycle at rest: peak-to-peak below 2e-8 m at five poses (a limit cycle of +-4 mm reported before
# 13 November 2026 was not found again).
# The ratio is chosen: with all three axes at their 3 m/s at once at the middle of the range the motors turn at
# 259 rad/s, 82 % of the rated 314 rad/s (16 gives 207, 25 gives 324); and 50 m/s2 along all three at once needs at
# most 12.1 N m of the 15 N m (16: 14.7 N m). 20 is the highest catalogue ratio below the rated speed.
# With effects.motor_stiction [estimate]: the shaft's breakaway torque, 1.5 times its Coulomb level (lip seals and
# bearings break away at about 1.3 to 2 times their running torque), and the speed over which it falls to that level.
friction_breakaway_nm = 0.075
friction_stribeck_rad_s = 2.0
# With effects.magnet_temperature [estimate]: NdFeB loses about 0.12 % of its remanence per kelvin.
# [bounds] -0.0013 ... -0.0009
magnet_temperature_coefficient_1_k = -0.0012
# [catalogue] a motor named in [parts] brings its stall current (static torque over torque constant); here the rated
# current where the motor is an estimate. With effects.iron_loss the copper loss at it brings the winding to its rated
# rise, and the iron loss at the rated speed is the rest of that loss at the rated current; the S1 check ("motor-s1")
# starts at kt times it.
stall_current_a = 4.35
[gearbox]
ratio = 20.0
efficiency = 0.94
backlash_rad = 0.0006545
stiffness_nm_rad = 106570.15
# [estimate]
damping_nm_s_rad = 5.0
inertia_at_input_kgm2 = 7e-05

# With effects.part_heating: each gearbox warms with its loss (power.gearbox_*). [estimate] as for the other machines'
# planetary gearboxes of this size.
# The torque at which `efficiency` holds: [catalogue] WITTENSTEIN alpha SP+ 100 MF, two stages, ratio 20 (the SP100
# Siemens fits, chapter 6.5 of its manual): "efficiency at full load 94 %" at its nominal torque T2N = 259 N m.
efficiency_torque_nm = 259.0
hysteresis_rad = 1.454e-4
# With effects.gearbox_lost_motion [estimate]: the band beyond the backlash over which the flanks' stiffness rises from
# 0 to stiffness_nm_rad, half an arcmin (WITTENSTEIN publishes none; it measures the backlash at 2 % of T2B, where the
# twist is 0.22 arcmin). hysteresis_rad [estimate]: the hysteresis loop's width at zero torque, half an arcmin
# (WITTENSTEIN publishes none for SP+; Harmonic Drive's strain wave gears give 1 arcmin). The flanks' friction is a
# Dahl state (mech::Gearbox): at the small amplitudes of a frequency response it is a spring beside K1, and the D3's
# velocity loop keeps its crossover (305 Hz with it, 259 Hz without; it locked at 19 Hz as a friction on the rate).
lost_motion_band_rad = 1.454e-4
no_load_speed_rpm = 3000.0
# With effects.gearbox_drag: [catalogue] the same sheet's mean no-load running torque T012 "at n1 = 3000 rpm and 20 degC
# gearbox temperature", ratio 20: 0.93 N m (an oil-lubricated precision gearbox churns more than a greased one: the
# NRB080 has 0.15 to 0.25 N m, Neugart PLE080). It is more than the 6 % at T2N (0.78 N m at the input), so the teeth
# come out loss-free and the gearbox passes 93.3 % at T2N and 20 degC; its efficiency falls at part load and in the
# cold through this drag (mech::GearDrag), and rises as it warms.
no_load_torque_nm = 0.93
stiffness_k2_nm_rad = 106570.15
stiffness_k3_nm_rad = 106570.15
# With effects.gearbox_stiffness_curve: a planetary gearbox has one stiffness, the knees at T2B and K2 = K3 = K1.
stiffness_t1_nm = 347.0
stiffness_t2_nm = 347.0
[thermal]
gearbox_resistance_k_w = 1.5
gearbox_time_constant_s = 1200.0
gearbox_max_rise_k = 50.0

# With effects.thermal_feedback (see mech::ThermalFeedback). [estimate] as for the other machines; the belt's
# coefficient is read but not used, as the delta has no belt.
[thermal_feedback]
ambient_c = 20.0
reference_c = 20.0
viscosity_slope_k = 4000.0
gearbox_viscous_loss_share = 0.5
belt_stiffness_coefficient_1_k = 3.0e-4

# The tool's limits along x, y and z. [estimate] Autonox publishes none. 3 m/s and 50 m/s2 (about 5 g) are below what
# deltas of this class are sold for (ABB IRB 360: 10 m/s, 100 m/s2), chosen for the 1FK2105 behind ratio 20 (see
# [gearbox]); 2500 m/s3 reaches the acceleration in 20 ms.
# With effects.thermal_feedback [estimate]: the motor shaft's seal friction (motor.friction_coulomb_nm and
# friction_breakaway_nm) follows the gearbox's lubricant, (nu / nu_ref) to this power: a lip seal on its oil film.
seal_viscosity_exponent = 0.33
[axis.x]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 50.0
max_jerk_m_s3 = 2500.0

[axis.y]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 50.0
max_jerk_m_s3 = 2500.0

[axis.z]
max_velocity_m_s = 3.0
max_acceleration_m_s2 = 50.0
max_jerk_m_s3 = 2500.0

# One drive per motor, all with the same settings. Cycle times must be whole multiples of sim.dt_s.
[drive]
current_cycle_s = 62.5e-6
velocity_cycle_s = 125.0e-6
position_cycle_s = 1.0e-3
current_delay_cycles = 1
velocity_delay_cycles = 1
kv_1_s = 50.0
# Velocity loop gain, tuned with `sim-cli margins delta-d3 --bands` for a phase margin of at least 35 degrees and a gain
# margin of at least 6 dB in every run, also with motor and joint friction off. The loop crosses over near 230 Hz, where
# the rotor alone is left (above the gearboxes' resonance), so the filters below are 0.1 ms (0.2 ms on the belt
# machines). Found: at least 41.7 degrees and 8.1 dB (friction off), 47.0 degrees and 8.6 dB (on), with the catalogue's
# 9 arcmin backlash. 0.2 left 30.9 degrees.
velocity_kp_nm_s_rad = 0.25
velocity_tn_s = 0.03
velocity_feedforward_factor = 1.0
torque_feedforward_factor = 1.0
current_kp_v_a = 40.0
current_tn_s = 5.0e-3
# [catalogue] a 400 V line: 540 V DC link (as catalog.rs puts it for a 400 V motor)
bus_voltage_v = 540.0
# [catalogue] 1FK2105-4AF at 400 V: 15 N m maximum, 4.6 N m rated at 3000 r/min
peak_torque_nm = 15.0
rated_torque_nm = 4.6
rated_speed_rad_s = 314.159
# sqrt(3/2) * 540 V / 1.07527 N m/A
no_load_speed_rad_s = 615.07
# [estimate] a 22-bit encoder
encoder_counts_per_rev = 4194304.0
velocity_filter_s = 0.1e-3
torque_filter_s = 0.1e-3
notch_frequency_hz = 60.0
notch_bandwidth_hz = 20.0
encoder_noise_counts = 4.0
current_noise_a = 0.01
noise_seed = 1
# The axes brake through one braking resistor for all, an S120 line-up's Braking Module: verdicts judges the
# sum of their braking power against ratings.braking_resistor_continuous_w and _peak_w. Off: each axis has a
# resistor of its own (an S210). A drive by name sets it.
braking_module = false

# What the parts allow. `sim-cli verdicts` judges a cycle against these; a rating that is left out is not judged.
# With effects.friction_feedforward: the friction characteristic, torque over speed at rising speeds, linear between
# the points from 0 and held beyond the last (S120 p3820-p3839). [estimate] none recorded: no feedforward.
friction_feedforward_speed_rad_s = [10.0]
friction_feedforward_torque_nm = [0.0]
# With effects.load_encoder: the step of the load-side scales, in the tool axes' units (m, rad). 1 um: a glass scale.
load_encoder_step = 1.0e-6
# [estimate] The highest speed the motor may turn at (its datasheet's maximum speed); here the no-load speed, where the
# torque-speed curve ends. The time-optimal plan turns the motor up to it along that curve; the verdict motor-speed
# judges the cycle's peak speed against it. A motor by name sets the catalogue's.
max_speed_rad_s = 615.07
# The position setpoint passes a first-order lag of this time constant before the position loop compares it, so that
# it arrives with the motor the speed feedforward moves (S120 p1429 balancing). 0: off, as commissioned by default.
precontrol_balance_s = 0.0
# Torque feedforward: "rigid", the rigid model's inverse dynamics (inertia, gravity, speed terms), or "inertia", one
# moment of inertia per motor (the rigid model's at the start pose) times its acceleration setpoint, as a drive's
# speed/torque precontrol with the load inertia set (S120 p1498): no gravity, no coupling.
torque_feedforward_model = "rigid"
blocked_speed_rad_s = 12.57
blocked_time_s = 3.0
# effects.drive_monitoring: how a drive stops when the drives trip. "off1" ramps the speed setpoint down in off1_ramp_s
# from the rated speed (S120 p1121), "off3" in off3_ramp_s (p1135), "sto" takes the torque off at once (the motor
# coasts), "current_limit" brakes at the torque limit; at standstill, below pulse_off_speed_rad_s (p1226), the pulses
# go off. [estimate] OFF3 in 0.1 s, as commissioned for a fast stop; OFF1 1 s.
fault_reaction = "off3"
# What trips it, at the motor (rad): the following error beyond its window (p2546); at standstill, after
# standstill_time_s of a resting setpoint, beyond the standstill window (p2542, p2543); held at the torque limit below
# blocked_speed_rad_s for blocked_time_s (F07900: p2175, p2177 3 s); the torque further from the model's expected
# torque than torque_band times the peak torque (0: off), as a robot controller detects a collision. [estimate]
following_error_window_rad = 1.0
off1_ramp_s = 1.0
off3_ramp_s = 0.1
pulse_off_speed_rad_s = 2.09
standstill_time_s = 1.0
standstill_window_rad = 0.1
torque_band = 0.0
[ratings]
# How far the tool may be from its target in the second half of a dwell, when the gripper acts. It counts the
# gearboxes' twist and backlash under the platform's weight, which the motors' encoders do not see: 0.68 mm in the
# dwell (0.64 mm of it static), so the cycle fails it with the catalogue gearbox (see [gearbox]). [estimate] the positioning accuracy of a delta of this class, +-0.5 mm (Festo EXPT, catalogue 2024/12); the
# 0.1 mm the makers state is the repeatability, which a constant sag does not spoil.
settling_tolerance_m = 0.0005
# [catalogue] NRB080-05-20: 120 N m rated, 192 N m maximum
gearbox_rated_torque_nm = 347.0
gearbox_max_torque_nm = 278.0
# [estimate] a gearbox of this size; not in the catalogue's files.
gearbox_max_input_speed_rpm = 6500.0
# The DC link of the S210 converter. [estimate] as for the EXCT-30: 66 uF for 1.5 kW, the chopper at 770 V.
dc_link_capacitance_uf = 66.0
braking_threshold_v = 770.0
# [catalogue] its internal braking resistor and trip level (catalog/siemens/braking_s210.csv, operating instructions
# 09/2022): 100 W, 5.7 kW, 820 V.
braking_resistor_continuous_w = 100.0
braking_resistor_peak_w = 5700.0
dc_link_overvoltage_v = 820.0
dc_link_discharge_time_constant_s = 130.0
# [catalogue] S120 Active Line Module 6SL3130-7TE21-6AA4, for effects.regenerative_supply; its efficiency [estimate].
line_module_rated_power_w = 16000.0
line_module_max_power_w = 35000.0
line_module_efficiency = 0.98
required_life_h = 20000.0
# Reliability of the bearing lives, %: the life factor a1 of ISO 281 (see docs/config-reference.md). 90 to 99.95.
bearing_reliability_percent = 90.0
# The output speed at which the planet bearings last 20000 h at the rated torque, for the gearbox life.
# [estimate] the NRB060 ratio 5 figure (175 r/min, Table 7-15 of the manual) scaled with the ratio's slower planets:
# not printed for the NRB080-05-20.
gearbox_reference_speed_rpm = 59.0
# The fatigue of the gearbox's gearing above its rated torque, by Palmgren and Miner's damage sum over the cycle's
# output torque (Siemens' own method is in its gearbox manual, which is not in this repository), on a Woehler line
# through Siemens' two figures: gearbox_max_torque_nm (M2max) for at most 30000 output revolutions (equipment manual
# 04/2025, chapter 6), and no damage at or below gearbox_rated_torque_nm (M2N). A torque M between allows
# 30000 * (M2max / M)^k output revolutions.
# [estimate] k = 8.7, the slope of the tooth root's S-N line of case-hardened gears in ISO 6336-3 (life factor 2.5 at
# 10^3 load cycles, 1 from 3 * 10^6: ln(3000) / ln(2.5)), the root stress in proportion to the torque.
gearbox_gearing_wohler_exponent = 8.7
# [catalogue] S210 converter 6SL3210-5HE11-5UF0, which D 32 pairs with the 1FK2105-4AF at 400 V: 5 A rated, 19 A maximum
drive_rated_current_a = 5.0
drive_max_current_a = 19.0
# With effects.drive_overload [estimate]: the base load current the drive falls back to when its thermal image trips
# (0.85 of the rated current, as the S120 Motor Modules up to 30 A have it; a drive by name sets it), the time constant
# of the image, and how long the drive gives its maximum current from the rated load.
drive_base_load_current_a = 4.25
drive_overload_time_constant_s = 10.0
drive_max_current_time_s = 0.25
# The highest condition number of the Jacobian the cycle may reach ("singularity"). [estimate] a design rule: the
# working range has up to 3.6, the Adept cycle about 2.
max_condition_number = 5.0
braking_resistor_rated_rise_k = 200.0
# With effects.braking_resistor_heating [estimate]: the braking resistor's time constant and its rise at its continuous
# power. Siemens gives duty cycles (catalog/siemens/braking_s120.csv: peak power 1 s in 68 s), not these.
# [bounds] time constant 20 ... 300 s, rise 100 ... 300 K
braking_resistor_time_constant_s = 60.0
# With effects.drive_overload [estimate]: the chips' share of the power unit's rise and their time constant, the fast
# node of the two-node image (the slow one is the heat sink's above). Siemens publishes neither.
# [bounds] share 0 ... 0.5, time constant 0.1 ... 5 s
drive_chip_share = 0.3
drive_chip_time_constant_s = 1.0

[profile]
cycle_s = 1.0e-3
fieldbus_delay_cycles = 1
fieldbus_jitter_cycles = 1
setpoint_interval_s = 10.0e-3
blend_time_s = 0.05
shaper_frequency_hz = 25.0
shaper_damping = 0.03
shaper2_frequency_hz = 0.0
shaper2_damping = 0.03
torque_reserve = 0.8
# Read but not used: the delta has no belt.
tension_reserve = 0.8
tension_margin_n = 0.0
# Not used on three axes (see docs/user-guide.md): paths run as given.
path_tolerance_m = 0.0
# For `sim-cli optimise`: the cycle's own 25 mm lift, as if something that high stood between pick and place. The
# same clearance is kept from every obstacle (check "collision", and a time-optimal path that comes nearer is refused).
min_clearance_m = 0.025

# Low and high bound of the values that are estimates (see the other machines' configs).
# How far a planned path may leave a corner between two lines to round it instead of stopping there (as a CNC's
# G642 or a robot's zone): the corner curve starts and ends 16/3 of it from a right-angled corner. 0: stop.
corner_tolerance_m = 0.0
# How the cycle's segments are timed: "axis_limits" (the S-curves within the axis limits above) or "time_optimal"
# (each segment as fast as the motors, the gearbox and belt ratings and the jerk limits allow, rest to rest).
cycle_timing = "axis_limits"
deceleration_ratio = 1.0
# The shape of moves (see docs/config-reference.md): "s-curve" (seven segments), "sin2" (Bestehorn), "poly345" or
# "poly4567" (VDI 2143); a [[cycle.segment]] may name its own with shape = "...". Braking within deceleration_ratio of
# the acceleration limits (1: as fast as speeding up). vertical_axis: the axis that lifts against gravity ("z", "-z"
# where up is its minus direction, "" for none), which has up_acceleration_ratio of its acceleration limit upwards.
shape = "s-curve"
shaper_axes = []
shaper_ei_tolerance = 0.05
shaper_modes = []
# With effects.input_shaping: the shaper ("zv", "zvd", "zvdd", "ei", "ei2" the two-hump EI), the vibration the EI
# shapers allow, the axes the first and the second shaper act on ([] for all), and further modes, each convolved:
# { frequency_hz = 40.0, damping = 0.02, type = "ei", axes = ["z"] } (type and axes may be left out).
shaper_type = "zvd"
# The curve a trajectory runs through its poses: "c2" (a cubic spline, the acceleration continuous) or "hermite" (the
# slopes of the neighbours, as before 14 November 2026).
trajectory_spline = "c2"
up_acceleration_ratio = 1.0
vertical_axis = ""
[bounds]
motor.pole_pairs = [3.0, 5.0]
motor.d_inductance_h = [0.008, 0.012]
motor.winding_resistance_share = [0.2, 0.5]
motor.winding_time_constant_s = [20.0, 120.0]
ratings.drive_base_load_current_a = [4.0, 4.5]
ratings.drive_overload_time_constant_s = [2.0, 60.0]
ratings.drive_max_current_time_s = [0.1, 1.0]
geometry.base_radius_m = [0.18, 0.22]
geometry.platform_radius_m = [0.04, 0.06]
geometry.upper_arm_m = [0.38, 0.42]
geometry.forearm_m = [0.92, 0.98]
mass.upper_arm_kg = [0.6, 1.2]
mass.upper_arm_inertia_kgm2 = [0.032, 0.064]
mass.elbow_kg = [0.2, 0.45]
mass.forearm_pair_kg = [0.35, 0.7]
mass.forearm_elbow_share = [0.5, 0.667]
mass.platform_kg = [0.8, 1.6]
upper_arm.bending_stiffness_nm_rad = [40000.0, 100000.0]
upper_arm.bending_damping_nm_s_rad = [2.0, 10.0]
upper_arm.lateral_stiffness_n_m = [250000.0, 620000.0]
upper_arm.lateral_damping_n_s_m = [6.0, 30.0]
mass.forearm_rod_spin_inertia_kgm2 = [0.6e-5, 2.6e-5]
joint.friction_coulomb_nm = [0.1, 0.6]
joint.friction_viscous_nm_s_rad = [0.02, 0.1]
motor.friction_coulomb_nm = [0.025, 0.1]
motor.friction_viscous_nm_s_rad = [1.0e-4, 4.0e-4]
motor.ripple_fraction = [0.01, 0.04]
motor.cogging_nm = [0.01, 0.04]
motor.resistance_ohm = [1.5, 3.0]
gearbox.damping_nm_s_rad = [2.0, 10.0]
gearbox.stiffness_nm_rad = [75000.0, 120000.0]
thermal.gearbox_resistance_k_w = [0.8, 3.0]
thermal.gearbox_time_constant_s = [600.0, 2400.0]
ratings.dc_link_discharge_time_constant_s = [30.0, 300.0]
ratings.line_module_efficiency = [0.95, 0.99]
thermal_feedback.ambient_c = [10.0, 40.0]
thermal_feedback.viscosity_slope_k = [3470.0, 4730.0]
thermal_feedback.gearbox_viscous_loss_share = [0.25, 0.75]
ratings.gearbox_gearing_wohler_exponent = [6.6, 10.0]

# Above the place position of the cycle. (Further out, near the edge of the range, one arm carries little of the
# platform's weight and its velocity loop measures badly in `sim-cli margins`.)
base.damping_ratio_x = [0.01, 0.05]
base.damping_ratio_y = [0.01, 0.05]
base.damping_ratio_z = [0.01, 0.05]
base.mass_kg = [180.0, 480.0]
base.stiffness_x_n_m = [1.08e6, 6.75e6]
base.stiffness_y_n_m = [1.08e6, 6.75e6]
base.stiffness_z_n_m = [7.6e6, 4.75e7]
gearbox.backlash_rad = [4.363e-4, 8.727e-4]
gearbox.lost_motion_band_rad = [0.0, 2.909e-4]
gearbox.hysteresis_rad = [0.0, 2.909e-4]
gearbox.no_load_torque_nm = [0.7, 1.2]
mass.elbow_twist_inertia_kgm2 = [1.2e-4, 5.0e-4]
# Above the place position of the cycle. (Further out, near the edge of the range, one arm carries little of the
# platform's weight and its velocity loop measures badly in `sim-cli margins`.)
motor.friction_breakaway_nm = [0.05, 0.1]
motor.friction_stribeck_rad_s = [0.5, 10.0]
motor.magnet_temperature_coefficient_1_k = [-0.0013, -0.0009]
ratings.braking_resistor_rated_rise_k = [100.0, 300.0]
ratings.braking_resistor_time_constant_s = [20.0, 300.0]
ratings.drive_chip_share = [0.0, 0.5]
ratings.drive_chip_time_constant_s = [0.1, 5.0]
thermal_feedback.seal_viscosity_exponent = [0.0, 0.5]
[start]
pose = [0.1525, 0.0, -0.75]

# The Adept cycle 25/305/25 mm (Omron/Adept, ABB): up 25 mm, across 305 mm, down 25 mm, and back. Each leg is a move of
# its own, stopping at the corners; at the bottom the gripper acts for 35 ms (ABB's figure for its 2009 cycle times). It
# lies on y = 0, across the centre, 100 mm below the top of the working range. "payload" is the state of the gripper
# once the segment has arrived. One pass of the six segments is one Adept cycle: one place and one pick.
[[cycle.segment]]
target = [0.1525, 0.0, -0.775]
dwell_s = 0.035
payload = false

[[cycle.segment]]
target = [0.1525, 0.0, -0.75]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [-0.1525, 0.0, -0.75]
dwell_s = 0.0
payload = false

[[cycle.segment]]
target = [-0.1525, 0.0, -0.775]
dwell_s = 0.035
payload = true

[[cycle.segment]]
target = [-0.1525, 0.0, -0.75]
dwell_s = 0.0
payload = true

[[cycle.segment]]
target = [0.1525, 0.0, -0.75]
dwell_s = 0.0
payload = true

# The machine as a netlist: three motors, each turning an arm through its gearbox; the arms, forearms and platform are
# the linkage, whose numbers name the values of the tables above. The axes have no stroke: the linkage's working range
# sets their range (x and y from -radius_m to +radius_m, z from the bottom to top_z_m).
[machine]
version = 1
id = "spatial-delta-file"
name = "Spatial delta (machine file)"

[[machine.axis]]
id = "x"
pos = [600, 0]

[[machine.axis]]
id = "y"
pos = [600, 150]

[[machine.axis]]
id = "z"
pos = [600, 300]

[[machine.motor]]
id = "1"
key = "motor-arm-1"
pos = [0, 0]

[[machine.motor]]
id = "2"
key = "motor-arm-2"
pos = [0, 150]

[[machine.motor]]
id = "3"
key = "motor-arm-3"
pos = [0, 300]

[[machine.gearbox]]
id = "gearbox_1"
motor = "1"
pos = [150, 0]

[[machine.gearbox]]
id = "gearbox_2"
motor = "2"
pos = [150, 150]

[[machine.gearbox]]
id = "gearbox_3"
motor = "3"
pos = [150, 300]

# Arm 1 at 0 degrees (+x), arm 2 at 120, arm 3 at 240.
[[machine.linkage]]
id = "delta"
arms = ["gearbox_1", "gearbox_2", "gearbox_3"]
axes = ["x", "y", "z"]
base_radius_m = "geometry.base_radius_m"
platform_radius_m = "geometry.platform_radius_m"
upper_arm_m = "geometry.upper_arm_m"
forearm_m = "geometry.forearm_m"
forearm_spacing_m = "geometry.forearm_spacing_m"
upper_arm_kg = "mass.upper_arm_kg"
upper_arm_cg_m = "mass.upper_arm_cg_m"
upper_arm_inertia_kgm2 = "mass.upper_arm_inertia_kgm2"
elbow_kg = "mass.elbow_kg"
forearm_pair_kg = "mass.forearm_pair_kg"
forearm_elbow_share = "mass.forearm_elbow_share"
forearm_rod_spin_inertia_kgm2 = "mass.forearm_rod_spin_inertia_kgm2"
platform_kg = "mass.platform_kg"
payload_kg = "mass.payload_kg"
bending_stiffness_nm_rad = "upper_arm.bending_stiffness_nm_rad"
bending_damping_nm_s_rad = "upper_arm.bending_damping_nm_s_rad"
lateral_stiffness_n_m = "upper_arm.lateral_stiffness_n_m"
lateral_damping_n_s_m = "upper_arm.lateral_damping_n_s_m"
radius_m = "workspace.radius_m"
top_z_m = "workspace.top_z_m"
height_edge_m = "workspace.height_edge_m"
height_centre_m = "workspace.height_centre_m"
max_condition_number = "workspace.max_condition_number"
pos = [350, 150]

[base]
damping_ratio_rx = 0.02
damping_ratio_ry = 0.02
damping_ratio_rz = 0.02
damping_ratio_x = 0.02
damping_ratio_y = 0.02
damping_ratio_z = 0.02
inertia_x_kgm2 = 100.0
inertia_y_kgm2 = 100.0
inertia_z_kgm2 = 100.0
# Everything that sways with it, the machine on it included: its natural frequency is sqrt(k / M) / 2 pi.
mass_kg = 300.0
# Where it tilts about, in the tool pose's frame (x, y, z), m.
pivot_m = [0.0, 0.0, 0.0]
# 0: rigid in that direction (no state).
stiffness_x_n_m = 2.7e6
stiffness_y_n_m = 2.7e6
stiffness_z_n_m = 1.9e7
tilt_stiffness_x_nm_rad = 0.0
tilt_stiffness_y_nm_rad = 0.0
tilt_stiffness_z_nm_rad = 0.0
