# Fuzz targets for the readers of untrusted input (cargo-fuzz, nightly; run weekly by .github/workflows/fuzz.yml). Not a
# member of the workspace: libFuzzer needs a nightly toolchain and sanitizer flags the workspace is not built with.
#   cd fuzz && cargo +nightly fuzz run <target> corpus/<target> -- -max_total_time=60
[package]
name = "kinematics-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
sim-core = { path = "../crates/sim-core" }
sim-components = { path = "../crates/sim-components" }
sim-machines = { path = "../crates/sim-machines" }

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "machine_file"
path = "fuzz_targets/machine_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trace_import"
path = "fuzz_targets/trace_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trace_run"
path = "fuzz_targets/trace_run.rs"
test = false
doc = false
bench = false

[[bin]]
name = "program"
path = "fuzz_targets/program.rs"
test = false
doc = false
bench = false

[[bin]]
name = "urdf"
path = "fuzz_targets/urdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tables"
path = "fuzz_targets/tables.rs"
test = false
doc = false
bench = false
