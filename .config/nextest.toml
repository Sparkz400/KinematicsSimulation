# End of the default filter.

# Tests that run against the wall clock: the OPC UA server and the app's simulation thread. They share the
# machine with every other test; few of them at a time, so that a busy machine does not make them miss their times.
[test-groups]
real-time = { max-threads = 4 }

[[profile.default.overrides]]
filter = "package(sim-opcua) & (binary(plc) | binary(soak) | binary(interop))"
test-group = "real-time"

# Not the app's long analyses: they wait for their jobs as long as these take (`wait_for_jobs`, up to 20 minutes) and
# judge nothing against the clock. In the group they held one of its four places for up to 5 minutes of an 8-minute run.
# Nor switching an effect, which runs the simulation step by step on the test's own thread.
[[profile.default.overrides]]
filter = """
package(sim-app) & binary(app) & not (
    test(=the_app_optimises_the_cycle_and_applies_the_settings)
    | test(=the_app_optimises_the_cycle_of_the_machines_slow_to_simulate)
    | test(=switching_an_effect_changes_the_traces_within_one_cycle)
    | test(=the_app_ranks_the_uncertain_parameters)
    | test(=the_app_ranks_the_uncertain_parameters_of_the_machines_slow_to_simulate)
    | test(=the_app_shows_and_applies_lower_lifts)
    | test(=the_checks_get_error_bands_in_the_app)
    | test(=the_app_searches_the_worst_corner_of_the_bounds)
    | test(=the_app_searches_motors_and_names_one_in_the_config)
    | test(=the_operating_points_are_shown_over_the_torque_speed_curve)
    | test(=the_regenerative_supply_shows_in_the_apps_tables)
    | test(=the_replayed_trace_is_overlaid_and_exported_in_the_app)
)
"""
test-group = "real-time"

# The longest tests first, so that the run does not end waiting for one of them: each takes 1.5 to 7 minutes in a
# full run (10 s to 2 min alone; the ones on one thread the longest there).
[[profile.default.overrides]]
filter = """
test(=the_exct_30_config_passes_settling_at_the_worst_corner_of_its_bounds)
| test(=a_path_is_planned_run_and_analysed_in_the_app)
| test(=switching_an_effect_changes_the_traces_within_one_cycle)
| test(=the_app_ranks_the_uncertain_parameters)
| test(=a_path_file_is_planned_run_and_analysed_for_every_machine)
| test(=the_app_optimises_the_cycle_and_applies_the_settings)
| test(=every_machine_file_passes_the_standard_suite)
| test(=a_path_from_an_end_of_a_stroke_is_run)
| test(=the_netlist_machines_run_their_crates_cycle)
| test(=step_bode_and_tuning_write_csv_for_every_machine)
| test(=a_changed_ratio_or_pulley_radius_does_not_tear_the_machine)
| test(=the_replayed_trace_is_overlaid_and_exported_in_the_app)
| test(=the_app_shows_and_applies_lower_lifts)
| test(=the_operating_points_are_shown_over_the_torque_speed_curve)
| test(=the_supply_converges_with_the_integration_step_on_every_config)
| test(=tests::urdf_arm_passes_the_standard_suite)
| test(=the_regenerative_supply_shows_in_the_apps_tables)
| test(=verdicts_judge_the_default_cycle_of_every_machine)
| test(=changing_the_profile_cycle_on_the_way_does_not_move_the_setpoint)
| test(=the_shipped_velocity_loops_keep_their_margins)
| test(=the_app_searches_motors_and_names_one_in_the_config)
"""
priority = 50

# CI: a test still running after 30 minutes is stopped and fails, so that one that hangs cannot hold a runner until the
# job's own limit. The longest of the default run takes 2 minutes alone on an 8-core machine; the margin sweeps, which
# CI runs one at a time, take the most: the arms' and the D4's some 1100 to 1700 s of processor each (estimated from the
# cost of one loop measurement), about 7 minutes on 4 cores.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 30 }

# Every test but the margin sweeps and the EXCT-30's worst corner, which CI runs one at a time in a step of their own
# (`cargo nextest run --workspace --release --exclude sim-py --ignore-default-filter -E "not default()" --test-threads 1`
# with the profile `full` lists what the default leaves out). Its JUnit report is what tools/slow_tests.py reads.
[profile.full]
default-filter = "not ((package(sim-machines) & binary(control) & test(/^across_the_bounds::/)) | test(=the_exct_30_config_passes_settling_at_the_worst_corner_of_its_bounds))"

[profile.full.junit]
path = "junit.xml"

# CI on a push to main: everything `full` runs, with the CI time limit.
[profile.ci-full]
slow-timeout = { period = "60s", terminate-after = 30 }
default-filter = "not ((package(sim-machines) & binary(control) & test(/^across_the_bounds::/)) | test(=the_exct_30_config_passes_settling_at_the_worst_corner_of_its_bounds))"

