# cargo nextest run --workspace --release --exclude sim-py
# Every test runs in a process of its own, the tests of all binaries at once. nextest runs no doctests:
# cargo test --doc --workspace --release --exclude sim-py

[profile.default]
# A test still running after a minute is reported as slow, and one still running after 15 is stopped as hung (the
# longest take up to nine minutes in a full run; on 14 November 2026 a hung OPC UA test held a local run for 20).
slow-timeout = { period = "60s", terminate-after = 15 }
# Run every test and report every failure, not just the first.
fail-fast = false
# No retries: a test that passes on the second try still has a defect to find.
retries = 0
# Left out of a local run and of CI on a pull request: the slow tests, each over 20 s in a full run (150 of 917 on 14
# November 2026, 96 % of the suite's processor time). `cargo nextest run` then takes a few minutes; `--profile full` runs
# them too (some 25 minutes on 16 threads), and so does CI on a push to main (profile `ci-full`). After a full run,
# `python tools/slow_tests.py` rewrites the list from target/nextest/full/junit.xml.
# Left out of every profile but CI's last step: the sweeps of the velocity loops' margins across the bounds, a test per
# shipped config (sim-machines control, `across_the_bounds::*`, 8600 s of processor time), and the EXCT-30's worst
# corner of its bounds (2400 cycles, 1230 s): see the profile `full`.
# The default filter, written by tools/slow_tests.py:
default-filter = """
not ((package(sim-machines) & binary(control) & test(/^across_the_bounds::/)) | test(=the_exct_30_config_passes_settling_at_the_worst_corner_of_its_bounds))
& not (
(binary_id(=machine-cable-robot) & test(=tests::the_default_cycles_pass_their_verdicts))
| (binary_id(=machine-cable-robot) & test(=tests::the_planar_cable_robot_passes_the_standard_suite))
